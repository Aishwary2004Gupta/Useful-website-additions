<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Optimized Interactable Ripple Water Sphere</title>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: system-ui, sans-serif;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #hint {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        padding: 10px 14px;
        border-radius: 999px;
        color: rgba(255, 255, 255, 0.85);
        background: rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(8px);
        font-size: 14px;
        pointer-events: none;
        user-select: none;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: white;
        background: #000;
        z-index: 10;
        transition: opacity 0.4s ease;
        pointer-events: none;
      }

      #loading.hidden {
        opacity: 0;
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>

  <body>
    <div id="loading">Loading water sphere...</div>
    <div id="hint">Move or click on the sphere</div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const MAX_RIPPLES = 8;
      const RIPPLE_MAX_AGE = 2.8;

      const loadingEl = document.getElementById("loading");

      // ------------------------------------------------
      // Scene, camera, renderer
      // ------------------------------------------------
      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );

      camera.position.set(-4, 1.2, -4);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({
        antialias: window.devicePixelRatio <= 1.5,
        powerPreference: "high-performance"
      });

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;

      document.body.appendChild(renderer.domElement);

      // ------------------------------------------------
      // Controls
      // ------------------------------------------------
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.enablePan = false;
      controls.minDistance = 3.2;
      controls.maxDistance = 8;

      // ------------------------------------------------
      // Environment texture
      // ------------------------------------------------
      const manager = new THREE.LoadingManager(() => {
        loadingEl.classList.add("hidden");
        setTimeout(() => loadingEl.remove(), 500);
      });

      const textureLoader = new THREE.TextureLoader(manager);

      const envURL =
        "https://i.postimg.cc/DZTfk0vf/D10451C5-EB9F-4364-B668-83F91FC4B26C.jpg";

      const envTexture = textureLoader.load(envURL);
      envTexture.mapping = THREE.EquirectangularReflectionMapping;
      envTexture.colorSpace = THREE.SRGBColorSpace;

      scene.background = envTexture;

      // ------------------------------------------------
      // Optimized GPU water sphere
      // ------------------------------------------------
      const geometry = new THREE.SphereGeometry(2, 96, 64);

      const rippleCenters = Array.from(
        { length: MAX_RIPPLES },
        () => new THREE.Vector3(999, 999, 999)
      );

      const rippleAges = new Float32Array(MAX_RIPPLES);

      const uniforms = {
        uEnvMap: { value: envTexture },
        uTime: { value: 0 },

        uRippleCount: { value: 0 },
        uRippleCenters: { value: rippleCenters },
        uRippleAges: { value: rippleAges },

        uRippleMaxAge: { value: RIPPLE_MAX_AGE },
        uRippleSpeed: { value: 2.05 },
        uRippleStrength: { value: 0.16 },
        uRippleFrequency: { value: 12.0 },
        uRippleSharpness: { value: 7.5 },

        uIor: { value: 1.14 },
        uOpacity: { value: 0.92 },
        uBaseColor: { value: new THREE.Color(0x7ed8ff) }
      };

      const material = new THREE.ShaderMaterial({
        uniforms,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        extensions: {
          derivatives: true
        },
        vertexShader: `
          #define MAX_RIPPLES ${MAX_RIPPLES}

          uniform float uTime;

          uniform int uRippleCount;
          uniform vec3 uRippleCenters[MAX_RIPPLES];
          uniform float uRippleAges[MAX_RIPPLES];

          uniform float uRippleMaxAge;
          uniform float uRippleSpeed;
          uniform float uRippleStrength;
          uniform float uRippleFrequency;
          uniform float uRippleSharpness;

          varying vec3 vWorldPosition;

          float getRippleDisplacement(vec3 p) {
            float displacement = 0.0;

            for (int i = 0; i < MAX_RIPPLES; i++) {
              if (i >= uRippleCount) break;

              float age = uRippleAges[i];
              float fade = max(0.0, 1.0 - age / uRippleMaxAge);
              fade *= fade;

              float dist = distance(p, uRippleCenters[i]);
              float ring = dist - age * uRippleSpeed;

              float band = exp(-ring * ring * uRippleSharpness);
              float wave = sin(ring * uRippleFrequency);

              displacement += wave * band * fade;
            }

            return displacement * uRippleStrength;
          }

          void main() {
            vec3 p = position;
            vec3 dir = normalize(position);

            // Very subtle idle movement so the sphere feels alive.
            float idle =
              sin(position.x * 3.2 + uTime * 0.8) *
              sin(position.y * 4.1 + uTime * 1.1) *
              0.012;

            float ripple = getRippleDisplacement(position);

            p += dir * (idle + ripple);

            vec4 worldPosition = modelMatrix * vec4(p, 1.0);
            vWorldPosition = worldPosition.xyz;

            gl_Position = projectionMatrix * viewMatrix * worldPosition;
          }
        `,
        fragmentShader: `
          uniform sampler2D uEnvMap;
          uniform vec3 uBaseColor;
          uniform float uIor;
          uniform float uOpacity;

          varying vec3 vWorldPosition;

          const float PI = 3.141592653589793;

          vec2 equirectUV(vec3 dir) {
            dir = normalize(dir);

            float u = atan(dir.z, dir.x) / (2.0 * PI) + 0.5;
            float v = asin(clamp(dir.y, -1.0, 1.0)) / PI + 0.5;

            return vec2(u, v);
          }

          void main() {
            vec3 viewDir = normalize(cameraPosition - vWorldPosition);

            // Real geometric normal from the displaced surface.
            vec3 normal = normalize(cross(dFdx(vWorldPosition), dFdy(vWorldPosition)));

            if (dot(normal, viewDir) < 0.0) {
              normal = -normal;
            }

            vec3 reflectDir = reflect(-viewDir, normal);
            vec3 refractDir = refract(-viewDir, normal, 1.0 / uIor);

            vec3 reflected = texture2D(uEnvMap, equirectUV(reflectDir)).rgb;
            vec3 refracted = texture2D(uEnvMap, equirectUV(refractDir)).rgb;

            float fresnel = pow(1.0 - clamp(dot(viewDir, normal), 0.0, 1.0), 3.0);

            vec3 waterTint = uBaseColor;
            vec3 color = mix(refracted * waterTint, reflected, 0.2 + fresnel * 0.75);

            // Small fake specular highlight.
            vec3 lightDir = normalize(vec3(-0.35, 0.55, 0.75));
            float specular = pow(max(dot(reflect(-lightDir, normal), viewDir), 0.0), 90.0);
            color += specular * vec3(1.0, 0.95, 0.85) * 0.65;

            gl_FragColor = vec4(color, uOpacity);

            #include <tonemapping_fragment>
            #include <colorspace_fragment>
          }
        `
      });

      const sphere = new THREE.Mesh(geometry, material);
      scene.add(sphere);

      // ------------------------------------------------
      // Ripple interaction
      // ------------------------------------------------
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      const ripples = [];

      const localPoint = new THREE.Vector3();

      function syncRippleUniforms() {
        uniforms.uRippleCount.value = ripples.length;

        for (let i = 0; i < MAX_RIPPLES; i++) {
          if (i < ripples.length) {
            rippleCenters[i].copy(ripples[i].center);
            rippleAges[i] = ripples[i].age;
          } else {
            rippleCenters[i].set(999, 999, 999);
            rippleAges[i] = 999;
          }
        }
      }

      function addRipple(worldPoint) {
        sphere.worldToLocal(localPoint.copy(worldPoint));

        const lastRipple = ripples[ripples.length - 1];

        // Avoid stacking many ripples in almost the same place.
        if (
          lastRipple &&
          lastRipple.age < 0.15 &&
          lastRipple.center.distanceToSquared(localPoint) < 0.05
        ) {
          return;
        }

        ripples.push({
          center: localPoint.clone(),
          age: 0
        });

        if (ripples.length > MAX_RIPPLES) {
          ripples.shift();
        }

        syncRippleUniforms();
      }

      function updatePointer(event) {
        const rect = renderer.domElement.getBoundingClientRect();

        pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      }

      let lastMoveRippleTime = 0;
      const MOVE_RIPPLE_INTERVAL = 80;

      function onPointerMove(event) {
        const now = performance.now();

        if (now - lastMoveRippleTime < MOVE_RIPPLE_INTERVAL) {
          return;
        }

        lastMoveRippleTime = now;

        updatePointer(event);
        raycaster.setFromCamera(pointer, camera);

        const hit = raycaster.intersectObject(sphere, false)[0];

        if (hit) {
          addRipple(hit.point);
        }
      }

      function onPointerDown(event) {
        updatePointer(event);
        raycaster.setFromCamera(pointer, camera);

        const hit = raycaster.intersectObject(sphere, false)[0];

        if (hit) {
          addRipple(hit.point);
        }
      }

      renderer.domElement.addEventListener("pointermove", onPointerMove, {
        passive: true
      });

      renderer.domElement.addEventListener("pointerdown", onPointerDown, {
        passive: true
      });

      // ------------------------------------------------
      // Animation
      // ------------------------------------------------
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        const dt = Math.min(clock.getDelta(), 0.033);

        uniforms.uTime.value += dt;

        controls.update();

        for (let i = ripples.length - 1; i >= 0; i--) {
          ripples[i].age += dt;

          if (ripples[i].age > RIPPLE_MAX_AGE) {
            ripples.splice(i, 1);
          }
        }

        syncRippleUniforms();

        renderer.render(scene, camera);
      }

      animate();

      // ------------------------------------------------
      // Resize
      // ------------------------------------------------
      function resize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      window.addEventListener("resize", resize);
    </script>
  </body>
</html>

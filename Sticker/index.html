<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whiteboard Studio</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      /* Provided Floor Background */
      #floor {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 50% 40%,
            rgba(255, 255, 255, 0.25),
            rgba(0, 0, 0, 0.08) 80%
          ),
          repeating-linear-gradient(
            90deg,
            #cbb79a 0px,
            #cbb79a 46px,
            #c2ad8e 46px,
            #c2ad8e 48px
          );
        z-index: 0;
      }

      /* Whiteboard Container */
      #whiteboard {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(90vw, 1000px);
        height: min(80vh, 600px);
        background: #2a2a2a;
        border: 20px solid #5d4037;
        border-radius: 4px;
        box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
        z-index: 1;
        overflow: hidden;
      }

      #whiteboard::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("https://www.transparenttextures.com/patterns/felt.png");
        opacity: 0.3;
        pointer-events: none;
      }

      #board-surface {
        position: absolute;
        inset: 0;
        z-index: 2;
        overflow: visible;
        perspective: 1000px;
      }

      .sticker-wrap {
        position: absolute;
        cursor: grab;
        transform-style: preserve-3d;
        user-select: none;
        will-change: transform, left, top;
        z-index: 10;
      }
      .sticker-wrap:active {
        cursor: grabbing;
      }

      .gl-canvas {
        display: block;
        pointer-events: none;
        will-change: filter;
      }
    </style>
  </head>
  <body>
    <div id="floor"></div>

    <div id="whiteboard">
      <div id="board-surface"></div>
    </div>

    <script>
      // ============================================================================
      // WEBGL SHADERS
      // ============================================================================
      const VS = `
        attribute vec2 aPos; attribute vec2 aUV;
        uniform float uPeel, uLift, uPeelAngle, uPasting, uScale, uElevation;
        varying vec2 vUV; varying float vHi, vSh;
        void main() {
            vUV = aUV; vec2 p = aPos; vHi = 0.0; vSh = 0.0;
            if (uPeel > 0.0) {
                vec2 peelAxis = vec2(cos(uPeelAngle), sin(uPeelAngle));
                vec2 uvCentered = aUV - vec2(0.5);
                float proj = dot(uvCentered, peelAxis);
                float diag = 0.5 - proj;
                float peelLine = -0.3 + uPeel * 2.0;
                float rampWidth = 0.6;
                float lifted = 1.0 - smoothstep(peelLine - rampWidth, peelLine, diag);
                p *= (1.0 + lifted * uElevation);
                float inRamp = smoothstep(peelLine - rampWidth, peelLine - rampWidth * 0.5, diag) * smoothstep(peelLine + 0.05, peelLine - rampWidth * 0.3, diag);
                p += (-peelAxis) * inRamp * (uPasting > 0.5 ? 0.06 : 0.12);
                float t = smoothstep(peelLine - rampWidth, peelLine, diag);
                vHi = inRamp * 0.75 * pow(1.0 - t, 1.2);
                vSh = inRamp * 0.75 * pow(t, 1.2);
            }
            gl_Position = vec4(p * uScale, 0.0, 1.0);
        }`;

      const FS = `
        precision mediump float;
        uniform sampler2D uTex; uniform vec2 uTilt; uniform float uAspect;
        varying vec2 vUV; varying float vHi, vSh;
        float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
        void main() {
            vec4 tex = texture2D(uTex, vUV); if (tex.a < 0.01) discard;
            vec3 c = tex.rgb;
            vec2 aspUV = vec2(vUV.x * uAspect, vUV.y);
            float pattern = mix(sin(aspUV.x * 500.0) * sin(aspUV.y * 500.0) * 0.5 + 0.5, hash(aspUV * 1000.0), 0.2);
            c *= mix(0.7, 1.05, pattern);
            float align = dot(normalize(uTilt + 0.001), normalize(vec2(1.0, -1.0)));
            c *= (1.0 + align * 0.2);
            c = mix(c, c + 0.3, vHi);
            c = mix(c, c * 0.6, vSh);
            gl_FragColor = vec4(c, tex.a);
        }`;

      // ============================================================================
      // STICKER CLASS
      // ============================================================================
      let globalZ = 1000;

      class Sticker {
        constructor(parent, config) {
          this.parent = parent;
          this.config = {
            url: "",
            x: 0,
            y: 0,
            w: 150,
            h: 150,
            elevation: 0.2,
            ...config,
          };
          this.state = {
            x: this.config.x,
            y: this.config.y,
            peel: 0,
            lift: 0,
            tX: 0,
            tY: 0,
            peeling: false,
            held: false,
            pasting: false,
            texReady: false,
          };
          this.initDOM();
          this.initGL();
          this.loadImage();
          this.attachEvents();
        }

        initDOM() {
          this.wrap = document.createElement("div");
          this.wrap.className = "sticker-wrap";
          this.wrap.style.width = this.config.w + "px";
          this.wrap.style.height = this.config.h + "px";
          this.wrap.style.left = this.config.x + "px";
          this.wrap.style.top = this.config.y + "px";
          this.canvas = document.createElement("canvas");
          this.canvas.className = "gl-canvas";
          this.wrap.appendChild(this.canvas);
          this.parent.appendChild(this.wrap);
        }

        initGL() {
          const gl = (this.gl = this.canvas.getContext("webgl", {
            alpha: true,
          }));
          const compile = (s, t) => {
            const sh = gl.createShader(t);
            gl.shaderSource(sh, s);
            gl.compileShader(sh);
            return sh;
          };
          this.prog = gl.createProgram();
          gl.attachShader(this.prog, compile(VS, gl.VERTEX_SHADER));
          gl.attachShader(this.prog, compile(FS, gl.FRAGMENT_SHADER));
          gl.linkProgram(this.prog);
          gl.useProgram(this.prog);

          const grid = 32,
            verts = [],
            inds = [];
          for (let j = 0; j <= grid; j++)
            for (let i = 0; i <= grid; i++)
              verts.push(
                (i / grid) * 2 - 1,
                (j / grid) * 2 - 1,
                i / grid,
                1 - j / grid,
              );
          for (let j = 0; j < grid; j++)
            for (let i = 0; i < grid; i++) {
              let a = j * (grid + 1) + i;
              inds.push(
                a,
                a + 1,
                a + grid + 1,
                a + 1,
                a + grid + 2,
                a + grid + 1,
              );
            }
          this.indexCount = inds.length;
          gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
          gl.bufferData(
            gl.ARRAY_BUFFER,
            new Float32Array(verts),
            gl.STATIC_DRAW,
          );
          gl.enableVertexAttribArray(gl.getAttribLocation(this.prog, "aPos"));
          gl.vertexAttribPointer(
            gl.getAttribLocation(this.prog, "aPos"),
            2,
            gl.FLOAT,
            false,
            16,
            0,
          );
          gl.enableVertexAttribArray(gl.getAttribLocation(this.prog, "aUV"));
          gl.vertexAttribPointer(
            gl.getAttribLocation(this.prog, "aUV"),
            2,
            gl.FLOAT,
            false,
            16,
            8,
          );
          gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
          gl.bufferData(
            gl.ELEMENT_ARRAY_BUFFER,
            new Uint16Array(inds),
            gl.STATIC_DRAW,
          );

          const pad = this.config.w * 0.5;
          const cw = this.config.w + pad * 2,
            ch = this.config.h + pad * 2;
          this.canvas.width = cw * 2;
          this.canvas.height = ch * 2;
          this.canvas.style.width = cw + "px";
          this.canvas.style.height = ch + "px";
          this.canvas.style.marginLeft = -pad + "px";
          this.canvas.style.marginTop = -pad + "px";
          this.state.scale = this.config.w / cw;
          gl.viewport(0, 0, this.canvas.width, this.canvas.height);
        }

        loadImage() {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onerror = () =>
            console.error("Failed to load image:", this.config.url);
          img.onload = () => {
            const gl = this.gl;
            this.tex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, this.tex);
            // Crucial: Set texture parameters to support non-power-of-two images
            gl.texParameteri(
              gl.TEXTURE_2D,
              gl.TEXTURE_WRAP_S,
              gl.CLAMP_TO_EDGE,
            );
            gl.texParameteri(
              gl.TEXTURE_2D,
              gl.TEXTURE_WRAP_T,
              gl.CLAMP_TO_EDGE,
            );
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

            gl.texImage2D(
              gl.TEXTURE_2D,
              0,
              gl.RGBA,
              gl.RGBA,
              gl.UNSIGNED_BYTE,
              img,
            );

            this.state.texReady = true;
            this.draw();
          };
          img.src = this.config.url;
        }

        attachEvents() {
          const start = (e) => {
            const p = e.touches ? e.touches[0] : e;
            this.state.held = true;
            this.state.peeling = true;
            this.state.pasting = false;
            const r = this.wrap.getBoundingClientRect();
            this.state.offX = p.clientX - r.left;
            this.state.offY = p.clientY - r.top;
            this.wrap.style.zIndex = globalZ++;
            this.state.peelAngle = Math.atan2(
              p.clientY - (r.top + r.height / 2),
              p.clientX - (r.left + r.width / 2),
            );
            this.lastT = performance.now();
            this.anim();
          };
          this.wrap.addEventListener("mousedown", start);
          this.wrap.addEventListener("touchstart", start);

          window.addEventListener("mousemove", (e) => {
            if (!this.state.held) return;
            const p = e.touches ? e.touches[0] : e;
            const parentR = this.parent.getBoundingClientRect();
            this.state.x = p.clientX - parentR.left - this.state.offX;
            this.state.y = p.clientY - parentR.top - this.state.offY;
            this.wrap.style.left = this.state.x + "px";
            this.wrap.style.top = this.state.y + "px";
            this.state.tY +=
              ((p.clientX - (this.lastX || p.clientX)) * 2 - this.state.tY) *
              0.1;
            this.state.tX +=
              (-(p.clientY - (this.lastY || p.clientY)) * 2 - this.state.tX) *
              0.1;
            this.wrap.style.transform = `rotateX(${this.state.tX}deg) rotateY(${this.state.tY}deg)`;
            this.lastX = p.clientX;
            this.lastY = p.clientY;
          });

          window.addEventListener("mouseup", () => {
            if (this.state.held) {
              this.state.held = false;
              this.state.peeling = false;
              this.state.pasting = true;
              const settle = () => {
                this.state.tX *= 0.85;
                this.state.tY *= 0.85;
                this.wrap.style.transform = `rotateX(${this.state.tX}deg) rotateY(${this.state.tY}deg)`;
                if (Math.abs(this.state.tX) > 0.1)
                  requestAnimationFrame(settle);
                else this.wrap.style.transform = "";
              };
              settle();
            }
          });
        }

        anim() {
          const now = performance.now();
          const dt = (now - (this.lastAnimT || now)) / 1000;
          this.lastAnimT = now;
          const step = 2.0 * dt;
          if (this.state.peeling) {
            this.state.peel = Math.min(1, this.state.peel + step);
            this.state.lift = Math.min(1, this.state.lift + step);
          } else if (this.state.pasting) {
            this.state.peel = Math.max(0, this.state.peel - step);
            this.state.lift = Math.max(0, this.state.lift - step);
            if (this.state.peel === 0) this.state.pasting = false;
          }
          const tr = this.state.peel;
          this.canvas.style.filter = `drop-shadow(${tr * 15}px ${tr * 15}px ${tr * 10}px rgba(0,0,0,0.4))`;
          this.draw();
          if (this.state.held || this.state.peeling || this.state.pasting)
            requestAnimationFrame(() => this.anim());
          else this.lastAnimT = null;
        }

        draw() {
          const gl = this.gl,
            s = this.state;
          if (!s.texReady) return;
          gl.clear(gl.COLOR_BUFFER_BIT);
          const loc = (n) => gl.getUniformLocation(this.prog, n);
          gl.uniform1f(loc("uPeel"), s.peel);
          gl.uniform1f(loc("uLift"), s.lift);
          gl.uniform1f(loc("uPasting"), s.pasting ? 1 : 0);
          gl.uniform1f(loc("uScale"), s.scale);
          gl.uniform1f(loc("uElevation"), this.config.elevation);
          gl.uniform2f(loc("uTilt"), s.tY, -s.tX);
          gl.uniform1f(loc("uAspect"), this.config.w / this.config.h);
          gl.bindTexture(gl.TEXTURE_2D, this.tex);
          gl.drawElements(gl.TRIANGLES, this.indexCount, gl.UNSIGNED_SHORT, 0);
        }
      }

      // ============================================================================
      // SETUP
      // ============================================================================
      window.addEventListener("DOMContentLoaded", () => {
        const board = document.getElementById("board-surface");

        // These images are hosted on reliable services to prevent "black sticker" issues
        const notes = [
          {
            url: "https://static.vecteezy.com/system/resources/previews/024/207/646/non_2x/old-retro-car-cartoon-sticker-with-ai-generative-free-png.png",
            x: 100,
            y: 100,
            w: 346,
            h: 107,
          },
          {
            url: "https://static.vecteezy.com/system/resources/previews/024/207/646/non_2x/old-retro-car-cartoon-sticker-with-ai-generative-free-png.png",
            x: 200,
            y: 200,
            w: 346,
            h: 107,
          },
          {
            url: "https://static.vecteezy.com/system/resources/previews/024/207/646/non_2x/old-retro-car-cartoon-sticker-with-ai-generative-free-png.png",
            x: 300,
            y: 300,
            w: 346,
            h: 107,
          },
          {
            url: "https://static.vecteezy.com/system/resources/previews/027/183/094/non_2x/cute-baby-panda-sticker-transparent-free-png.png",
            x: 500,
            y: 190,
            w: 300,
            h: 300,
          },
          {
            url: "https://static.vecteezy.com/system/resources/previews/024/684/305/non_2x/sticker-illustration-of-eagle-head-with-ai-generative-free-png.png",
            x: 100,
            y: 300,
            w: 200,
            h: 200,
          },
          {
            url: "https://static.vecteezy.com/system/resources/previews/044/876/360/non_2x/cat-with-glasses-meme-sticker-tshirt-illustration-free-png.png",
            x: 700,
            y: 50,
            w: 200,
            h: 200,
          },
        ];

        notes.forEach((n) => new Sticker(board, n));
      });
    </script>
  </body>
</html>

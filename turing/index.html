<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Field Notes — Turning Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Kalam:wght@300;400;700&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="stage">
      <header class="mast">
        <p class="mast-kicker">A travel sketchbook</p>
        <h1>Field notes, turned by hand</h1>
      </header>

      <div class="book-wrap">
        <div class="book" id="book" aria-label="Illustrated journal">
          <div class="sheet sheet-left" id="sheetLeft"></div>
          <div class="sheet sheet-right" id="sheetRight"></div>

          <div class="leaf" id="leaf" aria-hidden="true">
            <div class="leaf-face leaf-front" id="leafFront"></div>
            <div class="leaf-face leaf-back" id="leafBack"></div>
          </div>

          <div class="spine" aria-hidden="true"></div>
        </div>
      </div>

      <nav class="controls" aria-label="Page controls">
        <button class="nav-btn" id="prevBtn" type="button" aria-label="Previous page">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M15.5 5.5 9 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <p class="pager" id="pager">01 — 02</p>

        <button class="nav-btn" id="nextBtn" type="button" aria-label="Next page">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M8.5 5.5 15 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </nav>

      <p class="hint" id="hint">Pages turn on their own until you take over.</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>

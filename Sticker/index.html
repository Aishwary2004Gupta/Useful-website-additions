<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draggable Sticker Board</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: #cbb79a;
      }

      /* ----------------------------------------------------------------
         BACKGROUND REQUESTED BY YOU
      ---------------------------------------------------------------- */
      #floor {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 50% 40%,
            rgba(255, 255, 255, 0.25),
            rgba(0, 0, 0, 0.08) 80%
          ),
          repeating-linear-gradient(
            90deg,
            #cbb79a 0px,
            #cbb79a 46px,
            #c2ad8e 46px,
            #c2ad8e 48px
          );
        z-index: 0;
      }

      #scene {
        position: relative;
        width: 100%;
        height: 100%;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1200px;
      }

      /* ----------------------------------------------------------------
         REALISTIC NOTICE BOARD / WHITEBOARD STYLE
      ---------------------------------------------------------------- */
      #board-shadow {
        position: absolute;
        width: min(88vw, 1050px);
        height: min(70vh, 610px);
        transform: translateY(26px);
        background: rgba(55, 35, 19, 0.32);
        border-radius: 10px;
        filter: blur(24px);
        z-index: 1;
      }

      #board-frame {
        position: relative;
        width: min(88vw, 1050px);
        height: min(70vh, 610px);
        padding: 19px;
        z-index: 5;

        background:
          linear-gradient(
            90deg,
            rgba(41, 20, 9, 0.6),
            transparent 10%,
            transparent 88%,
            rgba(41, 20, 9, 0.6)
          ),
          repeating-linear-gradient(
            0deg,
            #6b3017 0px,
            #8f4828 3px,
            #73351c 6px,
            #a35732 9px,
            #632b16 13px
          );

        border: 8px solid #542510;
        border-radius: 5px;

        box-shadow:
          inset 0 0 0 2px rgba(255, 214, 164, 0.25),
          inset 0 0 20px rgba(20, 7, 2, 0.72),
          0 26px 40px rgba(40, 20, 8, 0.4),
          0 7px 9px rgba(50, 22, 8, 0.35);
      }

      /* Inner dark felt board */
      #board-surface {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        perspective: 950px;

        background:
          radial-gradient(
            circle at 30% 15%,
            rgba(255, 255, 255, 0.08),
            transparent 35%
          ),
          radial-gradient(
            circle at 75% 85%,
            rgba(0, 0, 0, 0.35),
            transparent 42%
          ),
          repeating-linear-gradient(
            45deg,
            rgba(255, 255, 255, 0.025) 0px,
            rgba(255, 255, 255, 0.025) 1px,
            transparent 1px,
            transparent 4px
          ),
          repeating-linear-gradient(
            -45deg,
            rgba(0, 0, 0, 0.055) 0px,
            rgba(0, 0, 0, 0.055) 1px,
            transparent 1px,
            transparent 5px
          ),
          #17202a;

        border: 2px solid #25130b;

        box-shadow:
          inset 0 0 45px rgba(0, 0, 0, 0.78),
          inset 0 0 7px rgba(255, 255, 255, 0.14);
      }

      /* Felt grain */
      #board-surface::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.36;
        background-image:
          radial-gradient(rgba(255, 255, 255, 0.17) 0.55px, transparent 0.7px),
          radial-gradient(rgba(0, 0, 0, 0.35) 0.55px, transparent 0.7px);
        background-size: 4px 4px, 5px 5px;
        background-position: 0 0, 2px 3px;
        mix-blend-mode: overlay;
      }

      /* Reflection across the board */
      #board-surface::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          120deg,
          rgba(255, 255, 255, 0.08) 0%,
          rgba(255, 255, 255, 0.018) 24%,
          transparent 42%,
          transparent 68%,
          rgba(255, 255, 255, 0.028) 100%
        );
      }

      /* Marker shelf under board */
      #marker-shelf {
        position: absolute;
        width: 48%;
        height: 19px;
        left: 50%;
        bottom: -24px;
        transform: translateX(-50%);
        z-index: 7;

        border-radius: 0 0 8px 8px;
        background: linear-gradient(
          to bottom,
          #d8d1c6 0%,
          #8d8377 45%,
          #4d453d 100%
        );

        box-shadow:
          0 7px 8px rgba(0, 0, 0, 0.28),
          inset 0 2px 2px rgba(255, 255, 255, 0.45);
      }

      .marker {
        position: absolute;
        bottom: 5px;
        width: 54px;
        height: 9px;
        border-radius: 9px;
        box-shadow: 0 2px 3px rgba(0, 0, 0, 0.3);
      }

      .marker.one {
        left: 22%;
        background: linear-gradient(90deg, #222 0 16%, #f43f5e 16% 88%, #222 88%);
      }

      .marker.two {
        left: 42%;
        background: linear-gradient(90deg, #222 0 16%, #2563eb 16% 88%, #222 88%);
      }

      .marker.three {
        left: 62%;
        background: linear-gradient(90deg, #222 0 16%, #f7c948 16% 88%, #222 88%);
      }

      /* ----------------------------------------------------------------
         STICKERS
      ---------------------------------------------------------------- */
      .sticker {
        position: absolute;
        cursor: grab;
        user-select: none;
        touch-action: none;
        transform-style: preserve-3d;
        will-change: left, top, transform;
      }

      .sticker:active {
        cursor: grabbing;
      }

      .sticker-inner {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        will-change: transform;
      }

      .sticker-canvas {
        display: block;
        position: absolute;
        pointer-events: none;
        will-change: filter;
      }

      /* Decorative push pins */
      .pin {
        position: absolute;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        z-index: 20;
        pointer-events: none;
        box-shadow:
          0 2px 2px rgba(0, 0, 0, 0.42),
          inset 2px 2px 3px rgba(255, 255, 255, 0.55);
      }

      .pin::after {
        content: "";
        position: absolute;
        width: 4px;
        height: 10px;
        left: 5px;
        top: 10px;
        background: #777;
        border-radius: 0 0 4px 4px;
        transform: rotate(12deg);
        z-index: -1;
      }

      .red {
        background: radial-gradient(circle at 32% 28%, #ff8a8a, #d71920 62%, #7c0710);
      }

      .yellow {
        background: radial-gradient(circle at 32% 28%, #fff89a, #eab308 62%, #8a5b00);
      }

      .green {
        background: radial-gradient(circle at 32% 28%, #9df7b2, #22a34a 62%, #075a21);
      }

      .blue {
        background: radial-gradient(circle at 32% 28%, #9ccaff, #2563eb 62%, #0a2670);
      }

      /* Board heading */
      #board-label {
        position: absolute;
        top: 14px;
        right: 18px;
        color: rgba(255, 255, 255, 0.42);
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        pointer-events: none;
        z-index: 2;
      }

      @media (max-width: 700px) {
        #board-frame {
          width: 94vw;
          height: 75vh;
          padding: 13px;
          border-width: 6px;
        }

        #marker-shelf {
          display: none;
        }
      }
    </style>
  </head>

      /* ================================================================
         WEBGL SHADERS
      ================================================================= */

      const VERTEX_SHADER = `
        attribute vec2 aPos;
        attribute vec2 aUV;

        uniform float uPeel;
        uniform float uPeelAngle;
        uniform float uPasting;
        uniform float uScale;
        uniform float uElevation;

        varying vec2 vUV;
        varying float vHi;
        varying float vSh;

        void main() {
          vUV = aUV;

          vec2 p = aPos;
          vHi = 0.0;
          vSh = 0.0;

          if (uPeel > 0.0) {
            vec2 peelAxis = vec2(cos(uPeelAngle), sin(uPeelAngle));
            vec2 centered = aUV - vec2(0.5);

            float projection = dot(centered, peelAxis);
            float diagonal = 0.5 - projection;
            float peelLine = -0.3 + uPeel * 2.0;
            float rampWidth = 0.6;

            float lifted = 1.0 - smoothstep(peelLine - rampWidth, peelLine, diagonal);
            p *= 1.0 + lifted * uElevation;

            float ramp =
              smoothstep(peelLine - rampWidth, peelLine - rampWidth * 0.5, diagonal) *
              smoothstep(peelLine + 0.05, peelLine - rampWidth * 0.3, diagonal);

            float curveAmount = uPasting > 0.5 ? 0.06 : 0.12;
            p += (-peelAxis) * ramp * curveAmount;

            float shadeT = smoothstep(peelLine - rampWidth, peelLine, diagonal);
            vHi = ramp * 0.75 * pow(1.0 - shadeT, 1.2);
            vSh = ramp * 0.75 * pow(shadeT, 1.2);
          }

          gl_Position = vec4(p * uScale, 0.0, 1.0);
        }
      `;

      const FRAGMENT_SHADER = `
        precision mediump float;

        uniform sampler2D uTex;
        uniform vec2 uTilt;
        uniform float uAspect;

        varying vec2 vUV;
        varying float vHi;
        varying float vSh;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
        }

        void main() {
          vec4 tex = texture2D(uTex, vUV);

          if (tex.a < 0.01) discard;

          vec3 color = tex.rgb;

          /* Rug / fiber texture */
          vec2 uv = vec2(vUV.x * uAspect, vUV.y);

          float horizontalFiber = sin(uv.y * 560.0) * 0.5 + 0.5;
          float verticalFiber = sin(uv.x * 380.0) * 0.5 + 0.5;
          float weave = horizontalFiber * verticalFiber;
          float noise = hash(uv * 900.0);

          float rugTexture = mix(weave, noise, 0.25);
          color *= mix(0.76, 1.10, rugTexture);

          /* Directional rug pile sheen while dragging */
          vec2 pileDirection = normalize(vec2(0.8, -1.0));
          vec2 tiltDirection = normalize(uTilt + vec2(0.0001));

          float pileLight = dot(tiltDirection, pileDirection);
          color *= 1.0 + pileLight * 0.16;

          /* Curved peel lighting */
          color = mix(color, color + vec3(0.28), clamp(vHi, 0.0, 1.0) * 0.55);
          color = mix(color, color * 0.48, clamp(vSh, 0.0, 1.0) * 0.58);

          gl_FragColor = vec4(color, tex.a);
        }
      `;

      /* ================================================================
         STICKER CLASS
      ================================================================= */

      const RENDER_SCALE = 2;
      const GRID_SIZE = 32;
      const ANIMATION_SPEED = 1.9;
      let topZIndex = 100;

      class Sticker {
        constructor(parent, config) {
          this.parent = parent;

          this.config = {
            image: "",
            x: 0,
            y: 0,
            width: 160,
            height: 160,
            pinColor: "red",
            elevation: 0.22,
            ...config,
          };

          this.state = {
            x: this.config.x,
            y: this.config.y,

            held: false,
            peeling: false,
            pasting: false,

            peel: 0,
            lift: 0,
            peelAngle: -Math.PI / 4,

            dragStartX: 0,
            dragStartY: 0,
            originalX: 0,
            originalY: 0,

            lastX: 0,
            lastY: 0,
            lastTime: 0,

            tiltX: 0,
            tiltY: 0,

            textureReady: false,
            scale: 1,
          };

          this.animationFrame = null;
          this.lastTick = null;

          this.createDOM();
          this.createWebGL();
          this.loadTexture();
          this.attachEvents();
        }

        createDOM() {
          this.el = document.createElement("div");
          this.el.className = "sticker";
          this.el.style.left = `${this.config.x}px`;
          this.el.style.top = `${this.config.y}px`;
          this.el.style.width = `${this.config.width}px`;
          this.el.style.height = `${this.config.height}px`;

          this.inner = document.createElement("div");
          this.inner.className = "sticker-inner";

          this.canvas = document.createElement("canvas");
          this.canvas.className = "sticker-canvas";

          this.pin = document.createElement("div");
          this.pin.className = `pin ${this.config.pinColor}`;
          this.pin.style.left = `calc(50% - 7px)`;
          this.pin.style.top = `-7px`;

          this.inner.appendChild(this.canvas);
          this.el.appendChild(this.inner);
          this.el.appendChild(this.pin);
          this.parent.appendChild(this.el);
        }

        compileShader(gl, source, type) {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);

          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            console.error(gl.getShaderInfoLog(shader));
            return null;
          }

          return shader;
        }

        createWebGL() {
          const gl = this.canvas.getContext("webgl", {
            alpha: true,
            antialias: true,
            premultipliedAlpha: false,
          });

          this.gl = gl;

          const vertexShader = this.compileShader(
            gl,
            VERTEX_SHADER,
            gl.VERTEX_SHADER,
          );

          const fragmentShader = this.compileShader(
            gl,
            FRAGMENT_SHADER,
            gl.FRAGMENT_SHADER,
          );

          this.program = gl.createProgram();
          gl.attachShader(this.program, vertexShader);
          gl.attachShader(this.program, fragmentShader);
          gl.linkProgram(this.program);

          if (!gl.getProgramParameter(this.program, gl.LINK_STATUS)) {
            console.error("WebGL link error:", gl.getProgramInfoLog(this.program));
          }

          gl.useProgram(this.program);

          this.uniforms = {
            peel: gl.getUniformLocation(this.program, "uPeel"),
            peelAngle: gl.getUniformLocation(this.program, "uPeelAngle"),
            pasting: gl.getUniformLocation(this.program, "uPasting"),
            scale: gl.getUniformLocation(this.program, "uScale"),
            elevation: gl.getUniformLocation(this.program, "uElevation"),
            tilt: gl.getUniformLocation(this.program, "uTilt"),
            aspect: gl.getUniformLocation(this.program, "uAspect"),
            texture: gl.getUniformLocation(this.program, "uTex"),
          };

          const vertices = [];
          const indices = [];

          for (let y = 0; y <= GRID_SIZE; y++) {
            for (let x = 0; x <= GRID_SIZE; x++) {
              vertices.push(
                (x / GRID_SIZE) * 2 - 1,
                (y / GRID_SIZE) * 2 - 1,
                x / GRID_SIZE,
                1 - y / GRID_SIZE,
              );
            }
          }

          for (let y = 0; y < GRID_SIZE; y++) {
            for (let x = 0; x < GRID_SIZE; x++) {
              const a = y * (GRID_SIZE + 1) + x;

              indices.push(
                a,
                a + 1,
                a + GRID_SIZE + 1,
                a + 1,
                a + GRID_SIZE + 2,
                a + GRID_SIZE + 1,
              );
            }
          }

          this.indexCount = indices.length;

          this.vertexBuffer = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, this.vertexBuffer);
          gl.bufferData(
            gl.ARRAY_BUFFER,
            new Float32Array(vertices),
            gl.STATIC_DRAW,
          );

          this.indexBuffer = gl.createBuffer();
          gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.indexBuffer);
          gl.bufferData(
            gl.ELEMENT_ARRAY_BUFFER,
            new Uint16Array(indices),
            gl.STATIC_DRAW,
          );

          this.positionAttribute = gl.getAttribLocation(this.program, "aPos");
          this.uvAttribute = gl.getAttribLocation(this.program, "aUV");

          gl.enableVertexAttribArray(this.positionAttribute);
          gl.enableVertexAttribArray(this.uvAttribute);

          gl.vertexAttribPointer(
            this.positionAttribute,
            2,
            gl.FLOAT,
            false,
            16,
            0,
          );

          gl.vertexAttribPointer(
            this.uvAttribute,
            2,
            gl.FLOAT,
            false,
            16,
            8,
          );

          this.resizeCanvas();
        }

        resizeCanvas() {
          const width = this.config.width;
          const height = this.config.height;
          const padding = Math.max(width, height) * 0.22;

          const canvasWidth = width + padding * 2;
          const canvasHeight = height + padding * 2;

          this.canvas.width = Math.round(canvasWidth * RENDER_SCALE);
          this.canvas.height = Math.round(canvasHeight * RENDER_SCALE);

          this.canvas.style.width = `${canvasWidth}px`;
          this.canvas.style.height = `${canvasHeight}px`;
          this.canvas.style.left = `${-padding}px`;
          this.canvas.style.top = `${-padding}px`;

          this.state.scale = Math.min(width / canvasWidth, height / canvasHeight);

          this.gl.viewport(0, 0, this.canvas.width, this.canvas.height);
        }

        loadTexture() {
          const image = new Image();

          image.onload = () => {
            const gl = this.gl;

            this.texture = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, this.texture);

            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);

            gl.texImage2D(
              gl.TEXTURE_2D,
              0,
              gl.RGBA,
              gl.RGBA,
              gl.UNSIGNED_BYTE,
              image,
            );

            gl.texParameteri(
              gl.TEXTURE_2D,
              gl.TEXTURE_WRAP_S,
              gl.CLAMP_TO_EDGE,
            );

            gl.texParameteri(
              gl.TEXTURE_2D,
              gl.TEXTURE_WRAP_T,
              gl.CLAMP_TO_EDGE,
            );

            gl.texParameteri(
              gl.TEXTURE_2D,
              gl.TEXTURE_MIN_FILTER,
              gl.LINEAR,
            );

            gl.texParameteri(
              gl.TEXTURE_2D,
              gl.TEXTURE_MAG_FILTER,
              gl.LINEAR,
            );

            this.state.textureReady = true;
            this.draw();
          };

          image.src = this.config.image;
        }

        attachEvents() {
          this.el.addEventListener("pointerdown", (event) => {
            event.preventDefault();

            this.el.setPointerCapture(event.pointerId);

            const rect = this.el.getBoundingClientRect();

            this.state.held = true;
            this.state.peeling = true;
            this.state.pasting = false;
            this.state.peel = 0;
            this.state.lift = 0;

            this.state.dragStartX = event.clientX;
            this.state.dragStartY = event.clientY;
            this.state.originalX = this.state.x;
            this.state.originalY = this.state.y;

            this.state.lastX = event.clientX;
            this.state.lastY = event.clientY;
            this.state.lastTime = performance.now();

            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            this.state.peelAngle = Math.atan2(
              event.clientY - centerY,
              event.clientX - centerX,
            );

            this.inner.style.transformOrigin = `${event.clientX - rect.left}px ${event.clientY - rect.top}px`;

            this.el.style.zIndex = ++topZIndex;
            this.startAnimation();
          });

          this.el.addEventListener("pointermove", (event) => {
            if (!this.state.held) return;

            const now = performance.now();
            const dt = Math.max(1, now - this.state.lastTime);

            this.state.x =
              this.state.originalX + event.clientX - this.state.dragStartX;

            this.state.y =
              this.state.originalY + event.clientY - this.state.dragStartY;

            this.el.style.left = `${this.state.x}px`;
            this.el.style.top = `${this.state.y}px`;

            const velocityX =
              ((event.clientX - this.state.lastX) / dt) * 16;

            const velocityY =
              ((event.clientY - this.state.lastY) / dt) * 16;

            const targetTiltY = Math.max(-25, Math.min(25, velocityX * 2));
            const targetTiltX = Math.max(-25, Math.min(25, -velocityY * 2));

            this.state.tiltX += (targetTiltX - this.state.tiltX) * 0.09;
            this.state.tiltY += (targetTiltY - this.state.tiltY) * 0.09;

            this.inner.style.transform = `
              rotateX(${this.state.tiltX}deg)
              rotateY(${this.state.tiltY}deg)
            `;

            this.state.lastX = event.clientX;
            this.state.lastY = event.clientY;
            this.state.lastTime = now;
          });

          const release = () => {
            if (!this.state.held) return;

            this.state.held = false;
            this.state.peeling = false;
            this.state.pasting = true;

            this.settleTilt();
            this.startAnimation();
          };

          this.el.addEventListener("pointerup", release);
          this.el.addEventListener("pointercancel", release);
        }

        settleTilt() {
          const settle = () => {
            this.state.tiltX *= 0.86;
            this.state.tiltY *= 0.86;

            this.inner.style.transform = `
              rotateX(${this.state.tiltX}deg)
              rotateY(${this.state.tiltY}deg)
            `;

            if (
              Math.abs(this.state.tiltX) > 0.08 ||
              Math.abs(this.state.tiltY) > 0.08
            ) {
              requestAnimationFrame(settle);
            } else {
              this.state.tiltX = 0;
              this.state.tiltY = 0;
              this.inner.style.transform = "";
            }
          };

          settle();
        }

        startAnimation() {
          if (this.animationFrame !== null) return;

          this.lastTick = null;
          this.animationFrame = requestAnimationFrame((time) =>
            this.animate(time),
          );
        }

        animate(time) {
          if (this.lastTick === null) this.lastTick = time;

          const delta = Math.min((time - this.lastTick) / 1000, 0.1);
          this.lastTick = time;

          const step = ANIMATION_SPEED * delta;

          if (this.state.peeling) {
            this.state.peel = Math.min(1, this.state.peel + step);
            this.state.lift = Math.min(1, this.state.lift + step);
          }

          if (this.state.pasting) {
            this.state.peel = Math.max(0, this.state.peel - step);
            this.state.lift = Math.max(0, this.state.lift - step);

            if (this.state.peel <= 0) {
              this.state.pasting = false;
            }
          }

          const shadowStrength = Math.max(this.state.peel, this.state.lift);

          this.canvas.style.filter = `
            drop-shadow(
              ${shadowStrength * 8}px
              ${2 + shadowStrength * 18}px
              ${2 + shadowStrength * 16}px
              rgba(0, 0, 0, ${0.22 + shadowStrength * 0.25})
            )
          `;

          this.draw();

          if (
            this.state.held ||
            this.state.peeling ||
            this.state.pasting
          ) {
            this.animationFrame = requestAnimationFrame((nextTime) =>
              this.animate(nextTime),
            );
          } else {
            this.animationFrame = null;
            this.lastTick = null;
          }
        }

        draw() {
          if (!this.state.textureReady) return;

          const gl = this.gl;
          const s = this.state;
          const u = this.uniforms;

          gl.useProgram(this.program);
          gl.viewport(0, 0, this.canvas.width, this.canvas.height);

          gl.clearColor(0, 0, 0, 0);
          gl.clear(gl.COLOR_BUFFER_BIT);

          gl.enable(gl.BLEND);
          gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

          gl.uniform1f(u.peel, s.peel);
          gl.uniform1f(u.peelAngle, s.peelAngle);
          gl.uniform1f(u.pasting, s.pasting ? 1 : 0);
          gl.uniform1f(u.scale, s.scale);
          gl.uniform1f(u.elevation, this.config.elevation);
          gl.uniform2f(u.tilt, s.tiltY, s.tiltX);
          gl.uniform1f(
            u.aspect,
            this.config.width / this.config.height,
          );

          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, this.texture);
          gl.uniform1i(u.texture, 0);

          gl.drawElements(
            gl.TRIANGLES,
            this.indexCount,
            gl.UNSIGNED_SHORT,
            0,
          );
        }
      }

      ================================================================= */

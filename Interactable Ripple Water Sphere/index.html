<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Interactable Ripple Water Sphere</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
      }
      #hud {
        position: fixed;
        top: 10px;
        left: 10px;
        color: #fff;
        font: 12px/1.4 system-ui, sans-serif;
        background: rgba(0, 0, 0, 0.4);
        padding: 6px 10px;
        border-radius: 4px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="hud">Move / click to ripple</div>

    <script type="module">
      import * as THREE from "https://esm.sh/three";
      import { OrbitControls } from "https://esm.sh/three/addons/controls/OrbitControls.js";

      // ------------------------------------------------
      // SCENE + CAMERA + RENDERER
      // ------------------------------------------------
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(-4, 0, -3);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // cap DPR
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 1));

      // ------------------------------------------------
      // ENVIRONMENT MAP
      // ------------------------------------------------
      const textureLoader = new THREE.TextureLoader();
      const envURL =
        "https://i.postimg.cc/DZTfk0vf/D10451C5-EB9F-4364-B668-83F91FC4B26C.jpg";

      const envTex = textureLoader.load(envURL, (t) => {
        // Generate mipmaps for better, faster envmap sampling
        t.mapping = THREE.EquirectangularReflectionMapping;
        t.colorSpace = THREE.SRGBColorSpace;
        t.generateMipmaps = true;
        t.minFilter = THREE.LinearMipmapLinearFilter;
        t.magFilter = THREE.LinearFilter;
        t.needsUpdate = true;
      });

      scene.background = envTex;
      scene.environment = envTex;

      // ------------------------------------------------
      // MEDIUM-RES WATER SPHERE
      // ------------------------------------------------
      // 64x64 instead of 128x128: 4x fewer vertices (16k -> 4k)
      const geometry = new THREE.SphereGeometry(2, 64, 64);
      const base = new Float32Array(geometry.attributes.position.array);
      const pos = geometry.attributes.position;

      // One material is enough — drop the second overlapping sphere
      const matWater = new THREE.MeshPhysicalMaterial({
        color: 0x5cafdf,
        envMap: envTex,
        metalness: 0.25,
        roughness: 0.05,
        transmission: 0.85,
        ior: 1.12,
        side: THREE.FrontSide,            // FrontSide is enough
        transparent: true,
        thickness: 0.5,
        clearcoat: 0.5,
        clearcoatRoughness: 0.1,
      });

      const sphereMesh = new THREE.Mesh(geometry, matWater);
      scene.add(sphereMesh);

      // ------------------------------------------------
      // CONTROLS
      // ------------------------------------------------
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;

      // ------------------------------------------------
      // RIPPLE DATA
      // ------------------------------------------------
      const vertexCount = pos.count;
      const RIPPLE_RADIUS = 1.3;
      const RIPPLE_DECAY = 2.2;
      const RIPPLE_SPEED = 2.0;
      const RIPPLE_AMPLITUDE = 0.05;
      const RIPPLE_LIFETIME = 2.5;   // seconds
      const MAX_RIPPLES = 6;         // cap simultaneous ripples

      // Use simple object pools to avoid GC churn
      const ripples = []; // each: { x, y, z, t }

      // ------------------------------------------------
      // RIPPLE TRIGGER (throttled)
      // ------------------------------------------------
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let lastTriggerTime = 0;
      const TRIGGER_COOLDOWN = 30; // ms between ripples on move

      function triggerRipple(point) {
        if (ripples.length >= MAX_RIPPLES) ripples.shift(); // drop oldest
        ripples.push({ x: point.x, y: point.y, z: point.z, t: 0 });
      }

      function onPointer(e, force) {
        const now = performance.now();
        if (!force && now - lastTriggerTime < TRIGGER_COOLDOWN) return;
        lastTriggerTime = now;

        const r = renderer.domElement.getBoundingClientRect();
        pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
        pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;

        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.intersectObject(sphereMesh, false)[0];
        if (hit) triggerRipple(hit.point);
      }

      window.addEventListener("pointermove", (e) => onPointer(e, false));
      window.addEventListener("pointerdown", (e) => onPointer(e, true));

      // ------------------------------------------------
      // ANIMATION LOOP
      // ------------------------------------------------
      const tmpVec = new THREE.Vector3();
      const dt = 0.016; // fixed timestep for stable ripples
      let elapsed = 0;

      function animate() {
        requestAnimationFrame(animate);
        controls.update();

        // Skip work entirely if nothing is happening
        if (ripples.length === 0) {
          renderer.render(scene, camera);
          return;
        }

        elapsed += dt;

        // Advance ripple times and drop dead ones
        for (let r = ripples.length - 1; r >= 0; r--) {
          ripples[r].t += dt;
          if (ripples[r].t > RIPPLE_LIFETIME) ripples.splice(r, 1);
        }

        // Reset to base positions
        pos.array.set(base);
        pos.needsUpdate = true;

        const arr = pos.array;
        const numRipples = ripples.length;
        const r2 = RIPPLE_RADIUS * RIPPLE_RADIUS; // squared for cheaper check

        for (let r = 0; r < numRipples; r++) {
          const c = ripples[r];
          const time = c.t;
          const bandCenter = time * RIPPLE_SPEED;
          const bandMin = bandCenter - RIPPLE_RADIUS;
          const bandMax = bandCenter + RIPPLE_RADIUS;

          for (let i = 0; i < vertexCount; i++) {
            const i3 = i * 3;
            const dx = arr[i3]     - c.x;
            const dy = arr[i3 + 1] - c.y;
            const dz = arr[i3 + 2] - c.z;
            const dist2 = dx * dx + dy * dy + dz * dz;

            if (dist2 > bandMax * bandMax) continue;
            if (dist2 < bandMin * bandMin && time > 0.05) continue;

            const dist = Math.sqrt(dist2);

            // Skip very far ripples cheaply
            if (dist > bandMax) continue;

            const wave = Math.sin((dist - bandCenter) * 6.0);
            const falloff = Math.exp(-dist * RIPPLE_DECAY);
            const intensity = wave * falloff * RIPPLE_AMPLITUDE;

            // Push outward along vertex normal (== vertex direction here)
            arr[i3]     += arr[i3]     * intensity;
            arr[i3 + 1] += arr[i3 + 1] * intensity;
            arr[i3 + 2] += arr[i3 + 2] * intensity;
          }
        }

        pos.needsUpdate = true;
        // Recompute normals only if we have ripples; expensive op.
        geometry.computeVertexNormals();
        geometry.attributes.normal.needsUpdate = true;

        renderer.render(scene, camera);
      }

      animate();

      // ------------------------------------------------
      // RESIZE HANDLER
      // ------------------------------------------------
      window.addEventListener("resize", () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
      });
    </script>
  </body>
</html>

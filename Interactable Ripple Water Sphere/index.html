<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Optimized Interactable Ripple Water Sphere</title>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      canvas {
        display: block;
        touch-action: none;
      }
    </style>
  </head>

  <body>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      // ------------------------------------------------
      // SCENE + CAMERA + RENDERER
      // ------------------------------------------------
      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );

      camera.position.set(-4, 0, -3);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({
        antialias: window.devicePixelRatio <= 1.5,
        powerPreference: "high-performance",
      });

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 1));

      // ------------------------------------------------
      // ENVIRONMENT MAP
      // ------------------------------------------------
      const textureLoader = new THREE.TextureLoader();

      const envURL =
        "https://i.postimg.cc/DZTfk0vf/D10451C5-EB9F-4364-B668-83F91FC4B26C.jpg";

      const envTex = textureLoader.load(envURL);
      envTex.mapping = THREE.EquirectangularReflectionMapping;
      envTex.colorSpace = THREE.SRGBColorSpace;

      scene.background = envTex;
      scene.environment = envTex;

      // ------------------------------------------------
      // WATER SPHERE
      // ------------------------------------------------

      // 128x128 is expensive. 96x64 still looks smooth but performs better.
      const geometry = new THREE.SphereGeometry(2, 96, 64);

      const positionAttr = geometry.attributes.position;
      const basePositions = positionAttr.array.slice();
      const vertexCount = positionAttr.count;

      const waterMaterial = new THREE.MeshPhysicalMaterial({
        color: 0x5cafdf,
        envMap: envTex,
        roughness: 0.02,
        metalness: 0.1,
        transmission: 0.75,
        thickness: 0.7,
        transparent: true,
        opacity: 0.9,
        ior: 1.12,
        side: THREE.DoubleSide,
        depthWrite: false,
      });

      const sphere = new THREE.Mesh(geometry, waterMaterial);
      scene.add(sphere);

      // ------------------------------------------------
      // CONTROLS
      // ------------------------------------------------
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.enablePan = false;

      // ------------------------------------------------
      // RIPPLE SETTINGS
      // ------------------------------------------------

      const ripples = [];

      const MAX_RIPPLES = 8;
      const RIPPLE_LIFE = 1.6;
      const RIPPLE_SPEED = 2.35;

      // This replaces your old RIPPLE_RADIUS = 1.3.
      // Smaller value = tighter ripple.
      const RIPPLE_WIDTH = 0.26;

      const RIPPLE_FREQUENCY = 18.0;
      const RIPPLE_STRENGTH = 0.04;

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();

      // ------------------------------------------------
      // RIPPLE TRIGGER
      // ------------------------------------------------
      function updatePointer(event) {
        const rect = renderer.domElement.getBoundingClientRect();

        pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      }

      function addRippleFromEvent(event) {
        updatePointer(event);

        raycaster.setFromCamera(pointer, camera);

        const hit = raycaster.intersectObject(sphere, false)[0];

        if (!hit) return;

        // Important fix:
        // hit.point is world space.
        // geometry vertices are local space.
        // So convert the ripple center to local sphere space.
        const localPoint = sphere.worldToLocal(hit.point.clone());

        addRipple(localPoint);
      }

      function addRipple(localPoint) {
        const lastRipple = ripples[ripples.length - 1];

        // Avoid creating multiple nearly identical ripples.
        if (
          lastRipple &&
          lastRipple.age < 0.08 &&
          lastRipple.center.distanceToSquared(localPoint) < 0.03
        ) {
          return;
        }

        ripples.push({
          center: localPoint.clone(),
          age: 0,
        });

        // Important fix:
        // Do not let ripple count grow forever.
        if (ripples.length > MAX_RIPPLES) {
          ripples.shift();
        }
      }

      // ------------------------------------------------
      // POINTER INTERACTION FIX
      // ------------------------------------------------

      let pointerIsDown = false;
      let lastHoverRippleTime = 0;

      const HOVER_RIPPLE_INTERVAL = 120;

      renderer.domElement.addEventListener(
        "pointerdown",
        (event) => {
          pointerIsDown = true;

          // Immediate click feedback.
          // Only one ripple is created when dragging starts.
          addRippleFromEvent(event);
        },
        { passive: true }
      );

      renderer.domElement.addEventListener(
        "pointermove",
        (event) => {
          // Important fix:
          // Do not create ripples while dragging/rotating with OrbitControls.
          if (pointerIsDown) return;

          // Throttle hover ripples.
          const now = performance.now();

          if (now - lastHoverRippleTime < HOVER_RIPPLE_INTERVAL) {
            return;
          }

          lastHoverRippleTime = now;

          addRippleFromEvent(event);
        },
        { passive: true }
      );

      window.addEventListener("pointerup", () => {
        pointerIsDown = false;
      });

      window.addEventListener("pointercancel", () => {
        pointerIsDown = false;
      });

      // ------------------------------------------------
      // RIPPLE UPDATE
      // ------------------------------------------------
      let geometryWasDeformed = false;

      function updateRipples(dt) {
        // Update ripple ages and remove old ripples.
        for (let i = ripples.length - 1; i >= 0; i--) {
          ripples[i].age += dt;

          if (ripples[i].age > RIPPLE_LIFE) {
            ripples.splice(i, 1);
          }
        }

        const arr = positionAttr.array;

        // If no ripples are active, reset geometry once.
        if (ripples.length === 0) {
          if (geometryWasDeformed) {
            arr.set(basePositions);
            positionAttr.needsUpdate = true;
            geometry.computeVertexNormals();
            geometry.attributes.normal.needsUpdate = true;
            geometryWasDeformed = false;
          }

          return;
        }

        // Fast vertex update:
        // Calculate from original base sphere every frame.
        for (let i = 0; i < vertexCount; i++) {
          const index = i * 3;

          const bx = basePositions[index];
          const by = basePositions[index + 1];
          const bz = basePositions[index + 2];

          let totalIntensity = 0;

          for (let r = 0; r < ripples.length; r++) {
            const ripple = ripples[r];

            const dx = bx - ripple.center.x;
            const dy = by - ripple.center.y;
            const dz = bz - ripple.center.z;

            const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

            const ring = dist - ripple.age * RIPPLE_SPEED;

            // Skip vertices far away from the ripple band.
            if (Math.abs(ring) > RIPPLE_WIDTH * 3.5) continue;

            const fade = 1.0 - ripple.age / RIPPLE_LIFE;
            const fadeSmooth = fade * fade;

            const band =
              Math.exp(-(ring * ring) / (RIPPLE_WIDTH * RIPPLE_WIDTH));

            const wave = Math.sin(ring * RIPPLE_FREQUENCY);

            totalIntensity +=
              wave * band * fadeSmooth * RIPPLE_STRENGTH;
          }

          const scale = 1.0 + totalIntensity;

          arr[index] = bx * scale;
          arr[index + 1] = by * scale;
          arr[index + 2] = bz * scale;
        }

        positionAttr.needsUpdate = true;

        // Only recompute normals while the sphere is actually deformed.
        geometry.computeVertexNormals();
        geometry.attributes.normal.needsUpdate = true;

        geometryWasDeformed = true;
      }

      // ------------------------------------------------
      // ANIMATION LOOP
      // ------------------------------------------------
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        const dt = Math.min(clock.getDelta(), 0.033);

        controls.update();

        updateRipples(dt);

        renderer.render(scene, camera);
      }

      animate();

      // ------------------------------------------------
      // RESIZE HANDLER
      // ------------------------------------------------
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whiteboard Studio</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      /* Background requested by you */
      #floor {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 50% 40%,
            rgba(255, 255, 255, 0.25),
            rgba(0, 0, 0, 0.08) 80%
          ),
          repeating-linear-gradient(
            90deg,
            #cbb79a 0px,
            #cbb79a 46px,
            #c2ad8e 46px,
            #c2ad8e 48px
          );
        z-index: 0;
      }

      /* Wood framed felt board */
      #whiteboard {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(90vw, 1000px);
        height: min(78vh, 600px);
        padding: 18px;
        z-index: 1;

        background:
          repeating-linear-gradient(
            0deg,
            #592610 0px,
            #813d20 4px,
            #a45c36 8px,
            #6a2d16 12px,
            #4d210f 16px
          );

        border: 8px solid #44200f;
        border-radius: 5px;

        box-shadow:
          0 36px 70px rgba(0, 0, 0, 0.44),
          inset 0 0 14px rgba(0, 0, 0, 0.65),
          inset 0 0 0 2px rgba(255, 219, 175, 0.22);
      }

      #whiteboard::before {
        content: "";
        position: absolute;
        inset: 8px;
        pointer-events: none;
        border: 2px solid rgba(255, 218, 170, 0.18);
      }

      /* Dark felt inside the wooden frame */
      #board-surface {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        perspective: 1000px;

        background:
          radial-gradient(
            circle at 25% 20%,
            rgba(255, 255, 255, 0.07),
            transparent 35%
          ),
          radial-gradient(
            circle at 75% 80%,
            rgba(0, 0, 0, 0.45),
            transparent 45%
          ),
          repeating-linear-gradient(
            45deg,
            rgba(255, 255, 255, 0.025) 0px,
            rgba(255, 255, 255, 0.025) 1px,
            transparent 1px,
            transparent 4px
          ),
          repeating-linear-gradient(
            -45deg,
            rgba(0, 0, 0, 0.04) 0px,
            rgba(0, 0, 0, 0.04) 1px,
            transparent 1px,
            transparent 5px
          ),
          #1b2731;

        border: 2px solid #2a1309;

        box-shadow:
          inset 0 0 42px rgba(0, 0, 0, 0.82),
          inset 0 0 5px rgba(255, 255, 255, 0.1);
      }

      /* Felt grain */
      #board-surface::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.22;
        background-image:
          radial-gradient(rgba(255, 255, 255, 0.22) 0.6px, transparent 0.7px),
          radial-gradient(rgba(0, 0, 0, 0.32) 0.6px, transparent 0.7px);
        background-size: 5px 5px, 6px 6px;
        background-position: 0 0, 3px 3px;
      }

      /* Marker tray */
      #marker-tray {
        position: absolute;
        left: 50%;
        bottom: -25px;
        transform: translateX(-50%);
        width: 46%;
        height: 18px;
        border-radius: 0 0 8px 8px;
        background: linear-gradient(
          to bottom,
          #d8d1c6,
          #938b80 42%,
          #4a443d
        );
        box-shadow:
          0 7px 9px rgba(0, 0, 0, 0.3),
          inset 0 2px 2px rgba(255, 255, 255, 0.45);
      }

      .marker {
        position: absolute;
        bottom: 5px;
        width: 52px;
        height: 8px;
        border-radius: 9px;
        box-shadow: 0 2px 3px rgba(0, 0, 0, 0.3);
      }

      .marker.red {
        left: 18%;
        background: linear-gradient(90deg, #222 0 14%, #ed3b45 14% 88%, #222 88%);
      }

      .marker.blue {
        left: 43%;
        background: linear-gradient(90deg, #222 0 14%, #2d71e8 14% 88%, #222 88%);
      }

      .marker.yellow {
        left: 68%;
        background: linear-gradient(90deg, #222 0 14%, #f0bf32 14% 88%, #222 88%);
      }

      .sticker-wrap {
        position: absolute;
        cursor: grab;
        user-select: none;
        touch-action: none;
        transform-style: preserve-3d;
        will-change: transform, left, top;
        z-index: 10;
      }

      .sticker-wrap:active {
        cursor: grabbing;
      }

      .sticker-inner {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
        will-change: transform;
      }

      .gl-canvas {
        display: block;
        pointer-events: none;
        position: absolute;
        will-change: filter;
      }

      .pin {
        position: absolute;
        top: -8px;
        left: calc(50% - 8px);
        width: 16px;
        height: 16px;
        border-radius: 50%;
        z-index: 30;
        pointer-events: none;
        box-shadow:
          0 2px 3px rgba(0, 0, 0, 0.5),
          inset 2px 2px 3px rgba(255, 255, 255, 0.58);
      }

      .pin::after {
        content: "";
        position: absolute;
        width: 4px;
        height: 9px;
        left: 6px;
        top: 11px;
        z-index: -1;
        border-radius: 0 0 4px 4px;
        background: #777;
        transform: rotate(12deg);
      }

      .pin-red {
        background: radial-gradient(circle at 30% 25%, #ff9da1, #db1f2d 62%, #750612);
      }

      .pin-blue {
        background: radial-gradient(circle at 30% 25%, #a5c8ff, #2563eb 62%, #092775);
      }

      .pin-green {
        background: radial-gradient(circle at 30% 25%, #a2f1ad, #1fa349 62%, #075b25);
      }

      .pin-yellow {
        background: radial-gradient(circle at 30% 25%, #fff498, #eab308 62%, #765300);
      }

      @media (max-width: 700px) {
        #whiteboard {
          width: 94vw;
          height: 75vh;
          padding: 12px;
          border-width: 6px;
        }

        #marker-tray {
          display: none;
        }
      }
    </style>
  </head>

      /* ---------------------------------------------------------------
         WEBGL SHADERS
      ---------------------------------------------------------------- */

      const VS = `
        attribute vec2 aPos;
        attribute vec2 aUV;

        uniform float uPeel;
        uniform float uLift;
        uniform float uPeelAngle;
        uniform float uPasting;
        uniform float uScale;
        uniform float uElevation;

        varying vec2 vUV;
        varying float vHi;
        varying float vSh;

        void main() {
          vUV = aUV;
          vec2 p = aPos;

          vHi = 0.0;
          vSh = 0.0;

          if (uPeel > 0.0) {
            vec2 peelAxis = vec2(cos(uPeelAngle), sin(uPeelAngle));
            vec2 uvCentered = aUV - vec2(0.5);

            float proj = dot(uvCentered, peelAxis);
            float diag = 0.5 - proj;

            float peelLine = -0.3 + uPeel * 2.0;
            float rampWidth = 0.6;

            float lifted =
              1.0 - smoothstep(peelLine - rampWidth, peelLine, diag);

            p *= 1.0 + lifted * uElevation;

            float inRamp =
              smoothstep(peelLine - rampWidth, peelLine - rampWidth * 0.5, diag) *
              smoothstep(peelLine + 0.05, peelLine - rampWidth * 0.3, diag);

            float curveAmount = uPasting > 0.5 ? 0.06 : 0.12;
            p += (-peelAxis) * inRamp * curveAmount;

            float t = smoothstep(peelLine - rampWidth, peelLine, diag);

            vHi = inRamp * 0.75 * pow(1.0 - t, 1.2);
            vSh = inRamp * 0.75 * pow(t, 1.2);
          }

          gl_Position = vec4(p * uScale, 0.0, 1.0);
        }
      `;

      const FS = `
        precision mediump float;

        uniform sampler2D uTex;
        uniform vec2 uTilt;
        uniform float uAspect;

        varying vec2 vUV;
        varying float vHi;
        varying float vSh;

        float hash(vec2 p) {
          return fract(
            sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453
          );
        }

        void main() {
          vec4 tex = texture2D(uTex, vUV);

          if (tex.a < 0.01) discard;

          vec3 c = tex.rgb;

          /* Fabric/rug texture */
          vec2 aspUV = vec2(vUV.x * uAspect, vUV.y);

          float woven =
            sin(aspUV.x * 360.0) *
            sin(aspUV.y * 470.0) *
            0.5 + 0.5;

          float fiber = hash(aspUV * 860.0);
          float pattern = mix(woven, fiber, 0.18);

          c *= mix(0.82, 1.06, pattern);

          /* Dynamic pile reflection while sticker moves */
          vec2 pileDirection = normalize(vec2(1.0, -1.0));
          vec2 tiltDirection = normalize(uTilt + vec2(0.0001));

          float alignment = dot(tiltDirection, pileDirection);
          c *= 1.0 + alignment * 0.12;

          /* Peel and curve shadows */
          c = mix(c, c + vec3(0.25), clamp(vHi, 0.0, 1.0) * 0.55);
          c = mix(c, c * 0.55, clamp(vSh, 0.0, 1.0) * 0.58);

          gl_FragColor = vec4(c, tex.a);
        }
      `;

      let globalZ = 1000;

      class Sticker {
        constructor(parent, config) {
          this.parent = parent;

          this.config = {
            url: "",
            x: 0,
            y: 0,
            w: 150,
            h: 150,
            elevation: 0.2,
            pin: "pin-red",
            ...config,
          };

          this.state = {
            x: this.config.x,
            y: this.config.y,
            peel: 0,
            lift: 0,
            tX: 0,
            tY: 0,
            peelAngle: -Math.PI / 4,
            peeling: false,
            held: false,
            pasting: false,
            texReady: false,
            scale: 1,
          };

          this.animationRunning = false;

          this.initDOM();
          this.initGL();
          this.loadImage();
          this.attachEvents();
        }

        initDOM() {
          this.wrap = document.createElement("div");
          this.wrap.className = "sticker-wrap";
          this.wrap.style.width = this.config.w + "px";
          this.wrap.style.height = this.config.h + "px";
          this.wrap.style.left = this.config.x + "px";
          this.wrap.style.top = this.config.y + "px";

          this.inner = document.createElement("div");
          this.inner.className = "sticker-inner";

          this.canvas = document.createElement("canvas");
          this.canvas.className = "gl-canvas";

          this.pin = document.createElement("div");
          this.pin.className = `pin ${this.config.pin}`;

          this.inner.appendChild(this.canvas);
          this.wrap.appendChild(this.inner);
          this.wrap.appendChild(this.pin);
          this.parent.appendChild(this.wrap);
        }

        createShader(source, type) {
          const gl = this.gl;
          const shader = gl.createShader(type);

          gl.shaderSource(shader, source);
          gl.compileShader(shader);

          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            console.error("Shader error:", gl.getShaderInfoLog(shader));
            gl.deleteShader(shader);
            return null;
          }

          return shader;
        }

        initGL() {
          this.gl = this.canvas.getContext("webgl", {
            alpha: true,
            antialias: true,
            premultipliedAlpha: false,
          });

          const gl = this.gl;

          if (!gl) {
            console.error("WebGL is not available.");
            return;
          }

          const vertexShader = this.createShader(VS, gl.VERTEX_SHADER);
          const fragmentShader = this.createShader(FS, gl.FRAGMENT_SHADER);

          this.program = gl.createProgram();

          gl.attachShader(this.program, vertexShader);
          gl.attachShader(this.program, fragmentShader);
          gl.linkProgram(this.program);

          if (!gl.getProgramParameter(this.program, gl.LINK_STATUS)) {
            console.error("Program error:", gl.getProgramInfoLog(this.program));
          }

          gl.useProgram(this.program);

          this.uniforms = {
            peel: gl.getUniformLocation(this.program, "uPeel"),
            lift: gl.getUniformLocation(this.program, "uLift"),
            peelAngle: gl.getUniformLocation(this.program, "uPeelAngle"),
            pasting: gl.getUniformLocation(this.program, "uPasting"),
            scale: gl.getUniformLocation(this.program, "uScale"),
            elevation: gl.getUniformLocation(this.program, "uElevation"),
            tilt: gl.getUniformLocation(this.program, "uTilt"),
            aspect: gl.getUniformLocation(this.program, "uAspect"),
            texture: gl.getUniformLocation(this.program, "uTex"),
          };

          const grid = 32;
          const vertices = [];
          const indices = [];

          for (let y = 0; y <= grid; y++) {
            for (let x = 0; x <= grid; x++) {
              vertices.push(
                (x / grid) * 2 - 1,
                (y / grid) * 2 - 1,
                x / grid,
                1 - y / grid,
              );
            }
          }

          for (let y = 0; y < grid; y++) {
            for (let x = 0; x < grid; x++) {
              const a = y * (grid + 1) + x;

              indices.push(
                a,
                a + 1,
                a + grid + 1,
                a + 1,
                a + grid + 2,
                a + grid + 1,
              );
            }
          }

          this.indexCount = indices.length;

          this.vertexBuffer = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, this.vertexBuffer);

          gl.bufferData(
            gl.ARRAY_BUFFER,
            new Float32Array(vertices),
            gl.STATIC_DRAW,
          );

          this.indexBuffer = gl.createBuffer();
          gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.indexBuffer);

          gl.bufferData(
            gl.ELEMENT_ARRAY_BUFFER,
            new Uint16Array(indices),
            gl.STATIC_DRAW,
          );

          const aPos = gl.getAttribLocation(this.program, "aPos");
          const aUV = gl.getAttribLocation(this.program, "aUV");

          gl.enableVertexAttribArray(aPos);
          gl.enableVertexAttribArray(aUV);

          gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 16, 0);
          gl.vertexAttribPointer(aUV, 2, gl.FLOAT, false, 16, 8);

          const pad = Math.max(this.config.w, this.config.h) * 0.32;
          const canvasWidth = this.config.w + pad * 2;
          const canvasHeight = this.config.h + pad * 2;

          this.canvas.width = Math.round(canvasWidth * 2);
          this.canvas.height = Math.round(canvasHeight * 2);

          this.canvas.style.width = canvasWidth + "px";
          this.canvas.style.height = canvasHeight + "px";
          this.canvas.style.left = -pad + "px";
          this.canvas.style.top = -pad + "px";

          this.state.scale = Math.min(
            this.config.w / canvasWidth,
            this.config.h / canvasHeight,
          );

          gl.viewport(0, 0, this.canvas.width, this.canvas.height);
        }

        loadImage() {
          const image = new Image();

          image.onload = () => {
            const gl = this.gl;

            this.texture = gl.createTexture();

            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, this.texture);

            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);

            gl.texImage2D(
              gl.TEXTURE_2D,
              0,
              gl.RGBA,
              gl.RGBA,
              gl.UNSIGNED_BYTE,
              image,
            );

            /*
              IMPORTANT:
              Both S and T must be CLAMP_TO_EDGE.
              Otherwise a non-power-of-two image can render black.
            */
            gl.texParameteri(
              gl.TEXTURE_2D,
              gl.TEXTURE_WRAP_S,
              gl.CLAMP_TO_EDGE,
            );

            gl.texParameteri(
              gl.TEXTURE_2D,
              gl.TEXTURE_WRAP_T,
              gl.CLAMP_TO_EDGE,
            );

            gl.texParameteri(
              gl.TEXTURE_2D,
              gl.TEXTURE_MIN_FILTER,
              gl.LINEAR,
            );

            gl.texParameteri(
              gl.TEXTURE_2D,
              gl.TEXTURE_MAG_FILTER,
              gl.LINEAR,
            );

            this.state.texReady = true;
            this.draw();
          };

          image.onerror = () => {
            console.error("Sticker image could not load:", this.config.url);
          };

          image.src = this.config.url;
        }

        attachEvents() {
          this.wrap.addEventListener("pointerdown", (event) => {
            event.preventDefault();

            this.wrap.setPointerCapture(event.pointerId);

            const rect = this.wrap.getBoundingClientRect();

            this.state.held = true;
            this.state.peeling = true;
            this.state.pasting = false;
            this.state.peel = 0;
            this.state.lift = 0;

            this.state.dragStartX = event.clientX;
            this.state.dragStartY = event.clientY;
            this.state.originalX = this.state.x;
            this.state.originalY = this.state.y;

            this.state.lastX = event.clientX;
            this.state.lastY = event.clientY;
            this.state.lastTime = performance.now();

            this.state.peelAngle = Math.atan2(
              event.clientY - (rect.top + rect.height / 2),
              event.clientX - (rect.left + rect.width / 2),
            );

            this.inner.style.transformOrigin = `
              ${event.clientX - rect.left}px
              ${event.clientY - rect.top}px
            `;

            this.wrap.style.zIndex = ++globalZ;

            this.startAnimation();
          });

          this.wrap.addEventListener("pointermove", (event) => {
            if (!this.state.held) return;

            const now = performance.now();
            const dt = Math.max(1, now - this.state.lastTime);

            this.state.x =
              this.state.originalX + event.clientX - this.state.dragStartX;

            this.state.y =
              this.state.originalY + event.clientY - this.state.dragStartY;

            this.wrap.style.left = this.state.x + "px";
            this.wrap.style.top = this.state.y + "px";

            const velocityX =
              ((event.clientX - this.state.lastX) / dt) * 16;

            const velocityY =
              ((event.clientY - this.state.lastY) / dt) * 16;

            const targetTiltY = Math.max(-22, Math.min(22, velocityX * 2));
            const targetTiltX = Math.max(-22, Math.min(22, -velocityY * 2));

            this.state.tX += (targetTiltX - this.state.tX) * 0.1;
            this.state.tY += (targetTiltY - this.state.tY) * 0.1;

            this.inner.style.transform = `
              rotateX(${this.state.tX}deg)
              rotateY(${this.state.tY}deg)
            `;

            this.state.lastX = event.clientX;
            this.state.lastY = event.clientY;
            this.state.lastTime = now;
          });

          const release = () => {
            if (!this.state.held) return;

            this.state.held = false;
            this.state.peeling = false;
            this.state.pasting = true;

            this.settleTilt();
            this.startAnimation();
          };

          this.wrap.addEventListener("pointerup", release);
          this.wrap.addEventListener("pointercancel", release);
        }

        settleTilt() {
          const settle = () => {
            this.state.tX *= 0.85;
            this.state.tY *= 0.85;

            this.inner.style.transform = `
              rotateX(${this.state.tX}deg)
              rotateY(${this.state.tY}deg)
            `;

            if (
              Math.abs(this.state.tX) > 0.1 ||
              Math.abs(this.state.tY) > 0.1
            ) {
              requestAnimationFrame(settle);
            } else {
              this.state.tX = 0;
              this.state.tY = 0;
              this.inner.style.transform = "";
            }
          };

          settle();
        }

        startAnimation() {
          if (this.animationRunning) return;

          this.animationRunning = true;
          this.lastAnimationTime = null;

          requestAnimationFrame((time) => this.animate(time));
        }

        animate(time) {
          if (this.lastAnimationTime === null) {
            this.lastAnimationTime = time;
          }

          const dt = Math.min(
            (time - this.lastAnimationTime) / 1000,
            0.1,
          );

          this.lastAnimationTime = time;

          const speed = 1.9 * dt;

          if (this.state.peeling) {
            this.state.peel = Math.min(1, this.state.peel + speed);
            this.state.lift = Math.min(1, this.state.lift + speed);
          }

          if (this.state.pasting) {
            this.state.peel = Math.max(0, this.state.peel - speed);
            this.state.lift = Math.max(0, this.state.lift - speed);

            if (this.state.peel <= 0) {
              this.state.pasting = false;
            }
          }

          const shadow = Math.max(this.state.peel, this.state.lift);

          this.canvas.style.filter = `
            drop-shadow(
              ${shadow * 8}px
              ${2 + shadow * 15}px
              ${2 + shadow * 14}px
              rgba(0, 0, 0, ${0.2 + shadow * 0.25})
            )
          `;

          this.draw();

          if (
            this.state.held ||
            this.state.peeling ||
            this.state.pasting
          ) {
            requestAnimationFrame((nextTime) => this.animate(nextTime));
          } else {
            this.animationRunning = false;
            this.lastAnimationTime = null;
          }
        }

        draw() {
          if (!this.state.texReady) return;

          const gl = this.gl;
          const s = this.state;
          const u = this.uniforms;

          gl.useProgram(this.program);
          gl.viewport(0, 0, this.canvas.width, this.canvas.height);

          gl.clearColor(0, 0, 0, 0);
          gl.clear(gl.COLOR_BUFFER_BIT);

          gl.enable(gl.BLEND);
          gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, this.texture);

          gl.uniform1i(u.texture, 0);
          gl.uniform1f(u.peel, s.peel);
          gl.uniform1f(u.lift, s.lift);
          gl.uniform1f(u.peelAngle, s.peelAngle);
          gl.uniform1f(u.pasting, s.pasting ? 1 : 0);
          gl.uniform1f(u.scale, s.scale);
          gl.uniform1f(u.elevation, this.config.elevation);
          gl.uniform2f(u.tilt, s.tY, -s.tX);
          gl.uniform1f(u.aspect, this.config.w / this.config.h);

          gl.drawElements(
            gl.TRIANGLES,
            this.indexCount,
            gl.UNSIGNED_SHORT,
            0,
          );
        }
      }

        const board = document.getElementById("board-surface");

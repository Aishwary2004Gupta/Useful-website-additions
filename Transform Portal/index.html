<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transform Portal</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      #canvas-container {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>

    <!-- <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

    <script type="module">
      import * as THREE from "https://esm.sh/three";
      import { OrbitControls } from "https://esm.sh/three/addons/controls/OrbitControls.js";
      import { RGBELoader } from "https://esm.sh/three/addons/loaders/RGBELoader.js";

      class TransformPortal {
        constructor() {
          this.renderer = new THREE.WebGLRenderer({ antialias: true });
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          this.renderer.setSize(window.innerWidth, window.innerHeight);
          this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
          this.renderer.toneMappingExposure = 1;
          document
            .getElementById("canvas-container")
            .appendChild(this.renderer.domElement);
          this.clock = new THREE.Clock();
          this.mainScene = new THREE.Scene();
          this.mainScene.background = new THREE.Color(0x000000);
          this.camera = new THREE.PerspectiveCamera(
            50,
            innerWidth / innerHeight,
            0.1,
            1000,
          );
          this.camera.position.set(10, 0, 0);
          this.activeWorld = null;
          this.makeWorlds();
          this.makePortal();
          this.setupInteraction();
          this.animate();
          window.addEventListener("resize", () => this.resize());
        }

        makeWorlds() {
          const material = new THREE.MeshPhysicalMaterial({
            color: 0x92b2ff,
            roughness: 0,
            clearcoat: 1,
            clearcoatRoughness: 0,
          });
          this.worlds = [0, 1].map((index) => {
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(
              index === 0 ? 0x101629 : 0x171321,
            );
            scene.fog = new THREE.Fog(scene.background, 12, 45);
            scene.add(new THREE.HemisphereLight(0x87ceeb, 0x545454, 1.2));
            const light = new THREE.DirectionalLight(0xffffff, 2);
            light.position.set(4, 8, 6);
            scene.add(light);
            const object =
              index === 0
                ? new THREE.Mesh(
                    new THREE.BoxGeometry(1.5, 1.5, 1.5),
                    material.clone(),
                  )
                : new THREE.Mesh(
                    new THREE.SphereGeometry(1, 60, 64),
                    material.clone(),
                  );
            scene.add(object);
            const floor = new THREE.Mesh(
              new THREE.CircleGeometry(7, 64),
              new THREE.MeshStandardMaterial({
                color: index === 0 ? 0x202b43 : 0x302437,
                roughness: 0.8,
              }),
            );
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -2.2;
            scene.add(floor);
            for (let i = 0; i < 12; i++) {
              const pillar = new THREE.Mesh(
                new THREE.BoxGeometry(0.16, 1.6 + (i % 3) * 0.45, 0.16),
                new THREE.MeshStandardMaterial({
                  color: index === 0 ? 0x566a9c : 0x8a5a83,
                  emissive: index === 0 ? 0x10182e : 0x21101d,
                }),
              );
              const angle = (i / 12) * Math.PI * 2;
              pillar.position.set(
                Math.cos(angle) * 4.5,
                -1.4,
                Math.sin(angle) * 4.5,
              );
              scene.add(pillar);
            }
            const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 100);
            camera.position.set(0, 0.2, 6.5);
            camera.lookAt(0, 0, 0);
            const target = new THREE.WebGLRenderTarget(768, 768, {
              minFilter: THREE.LinearFilter,
              magFilter: THREE.LinearFilter,
              format: THREE.RGBAFormat,
            });
            return {
              scene,
              camera,
              object,
              target,
              label: index === 0 ? "The Shifting Cube" : "The Blue Sphere",
            };
          });
        }

        makePortal() {
          const ring = new THREE.Mesh(
            new THREE.TorusGeometry(3, 0.2, 16, 100),
            new THREE.MeshStandardMaterial({ color: 0xf9f9f9 }),
          );
          this.mainScene.add(ring);
          this.portalFaces = this.worlds.map((world, index) => {
            const face = new THREE.Mesh(
              new THREE.CircleGeometry(2.8, 96),
              new THREE.MeshBasicMaterial({
                map: world.target.texture,
                side: THREE.DoubleSide,
              }),
            );
            face.position.z = index === 0 ? 0.012 : -0.012;
            face.userData.worldIndex = index;
            this.mainScene.add(face);
            return face;
          });
          this.mainScene.add(new THREE.AmbientLight(0xffffff, 1));
          const light = new THREE.DirectionalLight(0xffffff, 1);
          light.position.set(10, 10, 0);
          this.mainScene.add(light);
          this.portalCamera = this.camera;
          this.controls = new OrbitControls(
            this.camera,
            this.renderer.domElement,
          );
          this.controls.enableDamping = true;
          this.controls.dampingFactor = 0.05;
          this.controls.enableZoom = true;
          this.raycaster = new THREE.Raycaster();
          this.pointer = new THREE.Vector2();
          this.renderer.domElement.addEventListener("click", (event) =>
            this.onClick(event),
          );
          this.hint = document.createElement("div");
          this.hint.textContent =
            "Rotate around the ring · Click either world to enter";
          Object.assign(this.hint.style, {
            position: "fixed",
            left: "50%",
            bottom: "26px",
            transform: "translateX(-50%)",
            color: "rgba(255,255,255,.75)",
            font: "13px Arial, sans-serif",
            letterSpacing: ".04em",
            textShadow: "0 1px 8px #000",
            pointerEvents: "none",
            whiteSpace: "nowrap",
          });
          document.body.appendChild(this.hint);
          this.returnButton = document.createElement("button");
          this.returnButton.textContent = "← Return through portal";
          Object.assign(this.returnButton.style, {
            display: "none",
            position: "fixed",
            left: "24px",
            top: "24px",
            padding: "12px 16px",
            color: "white",
            background: "rgba(10,12,20,.65)",
            border: "1px solid rgba(255,255,255,.4)",
            borderRadius: "24px",
            cursor: "pointer",
            font: "14px Arial,sans-serif",
          });
          this.returnButton.onclick = () => this.exitWorld();
          document.body.appendChild(this.returnButton);
        }

        onClick(event) {
          if (this.activeWorld !== null) return;
          const rect = this.renderer.domElement.getBoundingClientRect();
          this.pointer.set(
            ((event.clientX - rect.left) / rect.width) * 2 - 1,
            -((event.clientY - rect.top) / rect.height) * 2 + 1,
          );
          this.raycaster.setFromCamera(this.pointer, this.camera);
          const hit = this.raycaster.intersectObjects(this.portalFaces)[0];
          if (hit) this.enterWorld(hit.object.userData.worldIndex);
        }

        enterWorld(index) {
          this.activeWorld = index;
          const world = this.worlds[index];
          this.ringView = {
            position: this.camera.position.clone(),
            target: this.controls.target.clone(),
          };
          this.controls.dispose();
          this.camera.position.set(0, 0.25, 6.5);
          this.camera.lookAt(0, 0, 0);
          this.controls = new OrbitControls(
            this.camera,
            this.renderer.domElement,
          );
          this.controls.enableDamping = true;
          this.controls.dampingFactor = 0.05;
          this.controls.minDistance = 2.5;
          this.controls.maxDistance = 14;
          this.controls.target.set(0, 0, 0);
          this.currentScene = world.scene;
          this.returnButton.style.display = "block";
          this.hint.textContent =
            world.label + " · Explore with drag and scroll";
        }

        exitWorld() {
          this.controls.dispose();
          this.camera.position.copy(this.ringView.position);
          this.camera.lookAt(this.ringView.target);
          this.controls = new OrbitControls(
            this.camera,
            this.renderer.domElement,
          );
          this.controls.enableDamping = true;
          this.controls.dampingFactor = 0.05;
          this.controls.enableZoom = true;
          this.controls.target.copy(this.ringView.target);
          this.activeWorld = null;
          this.currentScene = null;
          this.returnButton.style.display = "none";
          this.hint.textContent =
            "Rotate around the ring · Click either world to enter";
        }

        animate() {
          requestAnimationFrame(() => this.animate());
          const t = this.clock.getElapsedTime();
          this.worlds.forEach((world, index) => {
            world.object.position.y = Math.sin(t * 1.1 + index) * 0.3;
            world.object.rotation.x = Math.cos(t / 2);
            world.object.rotation.y = Math.sin(t / 2);
            world.object.rotation.z = Math.sin(t / 2);
            this.renderer.setRenderTarget(world.target);
            this.renderer.render(world.scene, world.camera);
          });
          this.renderer.setRenderTarget(null);
          this.controls.update();
          this.renderer.render(
            this.activeWorld === null ? this.mainScene : this.currentScene,
            this.camera,
          );
        }

        resize() {
          this.camera.aspect = innerWidth / innerHeight;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(innerWidth, innerHeight);
        }
      }
      new TransformPortal();
    </script>
  </body>
</html>

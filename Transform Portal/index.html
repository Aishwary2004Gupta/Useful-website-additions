<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transform Portal</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      #canvas-container {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>

    <!-- <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

    <script type="module">
      import * as THREE from "https://esm.sh/three";
      import { OrbitControls } from "https://esm.sh/three/addons/controls/OrbitControls.js";
      import { RGBELoader } from "https://esm.sh/three/addons/loaders/RGBELoader.js";

      // Vertex Shader
      const vertexShader = `
            void main() {
                vec4 worldPos = modelMatrix * vec4(position, 1.0);
                vec4 mvPosition = viewMatrix * worldPos;
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

      // Fragment Shader
      const fragmentShader = `
            uniform vec2 winResolution;
            uniform sampler2D uTexture;

            void main() {
                vec2 uv = gl_FragCoord.xy / winResolution.xy;
                vec4 color = texture2D(uTexture, uv);
                gl_FragColor = color;
            }
        `;

      class TransformPortal {
        constructor() {
          this.init();
          this.createScene();
          this.createLights();
          this.createObjects();
          this.createRenderTargets();
          this.setupControls();
          this.animate();
          this.handleResize();
        }

        init() {
          // Setup renderer
          this.renderer = new THREE.WebGLRenderer({ antialias: true });
          this.renderer.setSize(window.innerWidth, window.innerHeight);
          this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
          this.renderer.toneMappingExposure = 1;
          document
            .getElementById("canvas-container")
            .appendChild(this.renderer.domElement);

          // Setup scene
          this.scene = new THREE.Scene();
          this.scene.background = new THREE.Color(0x000000);

          // Setup camera
          this.camera = new THREE.PerspectiveCamera(
            50,
            window.innerWidth / window.innerHeight,
            0.1,
            1000,
          );
          this.camera.position.set(10, 0, 0);

          // Clock for animations
          this.clock = new THREE.Clock();
        }

        createScene() {
          // Add fog for atmosphere
          this.scene.fog = new THREE.Fog(0x08050b, 10, 100);
        }

        createLights() {
          // Directional light
          const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
          directionalLight.position.set(10, 10, 0);
          directionalLight.castShadow = true;
          this.scene.add(directionalLight);

          // Ambient light
          const ambientLight = new THREE.AmbientLight(0xffffff, 1);
          this.scene.add(ambientLight);

          // Hemisphere light for sky effect
          const hemisphereLight = new THREE.HemisphereLight(
            0x87ceeb,
            0x545454,
            0,
          );
          this.scene.add(hemisphereLight);
        }

        createObjects() {
          // Create uniforms for shaders
          this.uniforms = {
            uTexture: { value: null },
            winResolution: {
              value: new THREE.Vector2(
                window.innerWidth,
                window.innerHeight,
              ).multiplyScalar(Math.min(window.devicePixelRatio, 2)),
            },
          };

          // Create cylinder 1
          const cylinderGeometry = new THREE.CylinderGeometry(3, 3, 8, 32);
          this.cylinder1 = new THREE.Mesh(cylinderGeometry);
          this.cylinder1.rotation.x = -Math.PI / 2;
          this.cylinder1.position.set(0, 0, -4);

          // Materials for cylinder 1
          const shaderMaterial1 = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
              ...this.uniforms,
              uTexture: { value: null },
            },
          });

          const shaderMaterial2 = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
              ...this.uniforms,
              uTexture: { value: null },
            },
          });

          const transparentMaterial = new THREE.MeshStandardMaterial({
            color: 0x87ceeb,
            transparent: true,
            opacity: 0,
          });

          this.cylinder1.material = [
            shaderMaterial1,
            shaderMaterial2,
            transparentMaterial,
          ];
          this.scene.add(this.cylinder1);

          // Create cylinder 2
          this.cylinder2 = new THREE.Mesh(cylinderGeometry);
          this.cylinder2.rotation.x = -Math.PI / 2;
          this.cylinder2.position.set(0, 0, 4);

          // Materials for cylinder 2
          const shaderMaterial3 = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
              ...this.uniforms,
              uTexture: { value: null },
            },
          });

          const shaderMaterial4 = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms: {
              ...this.uniforms,
              uTexture: { value: null },
            },
          });

          this.cylinder2.material = [
            shaderMaterial3,
            transparentMaterial.clone(),
            shaderMaterial4,
          ];
          this.scene.add(this.cylinder2);

          // Build a layered portal rim with a dark metal frame and glowing energy.
          const torusGeometry = new THREE.TorusGeometry(3, 0.2, 24, 160);
          const frameMaterial = new THREE.MeshPhysicalMaterial({
            color: 0x202631,
            metalness: 0.9,
            roughness: 0.24,
            clearcoat: 1,
            clearcoatRoughness: 0.12,
          });
          const portalFrame = new THREE.Mesh(torusGeometry, frameMaterial);
          this.scene.add(portalFrame);

          this.portalEnergy = new THREE.Group();
          this.scene.add(this.portalEnergy);

          const makeEnergyRing = (radius, tube, color, opacity) => {
            const material = new THREE.MeshBasicMaterial({
              color,
              transparent: true,
              opacity,
              blending: THREE.AdditiveBlending,
              depthWrite: false,
              toneMapped: false,
            });
            const ring = new THREE.Mesh(
              new THREE.TorusGeometry(radius, tube, 12, 192),
              material,
            );
            this.portalEnergy.add(ring);
            return material;
          };

          this.portalPulseMaterial = makeEnergyRing(3, 0.16, 0xff7a16, 0.25);
          makeEnergyRing(3, 0.075, 0xffa52d, 0.7);
          makeEnergyRing(3, 0.026, 0xffedbd, 1);
          makeEnergyRing(2.79, 0.022, 0xffa52d, 0.9);
          makeEnergyRing(3.21, 0.022, 0xffa52d, 0.75);

          // Fine, uneven arcs give the rim an electrical, hand-drawn edge.
          const arcMaterial = new THREE.LineBasicMaterial({
            color: 0xffe2a0,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            toneMapped: false,
          });
          for (let arcIndex = 0; arcIndex < 9; arcIndex++) {
            const start = Math.random() * Math.PI * 2;
            const length = 0.2 + Math.random() * 0.75;
            const phase = Math.random() * Math.PI * 2;
            const points = [];
            for (let step = 0; step <= 36; step++) {
              const t = step / 36;
              const angle = start + length * t;
              const radius = 3 + Math.sin(t * 18 + phase) * 0.055 + (Math.random() - 0.5) * 0.035;
              points.push(
                new THREE.Vector3(
                  Math.cos(angle) * radius,
                  Math.sin(angle) * radius,
                  (Math.random() - 0.5) * 0.12,
                ),
              );
            }
            const arc = new THREE.Line(
              new THREE.BufferGeometry().setFromPoints(points),
              arcMaterial,
            );
            this.portalEnergy.add(arc);
          }

          // A halo of fine sparks drifts around the portal opening.
          const sparkPositions = new Float32Array(900 * 3);
          for (let i = 0; i < 900; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 3.08 + Math.pow(Math.random(), 1.7) * 0.65;
            sparkPositions[i * 3] = Math.cos(angle) * radius;
            sparkPositions[i * 3 + 1] = Math.sin(angle) * radius;
            sparkPositions[i * 3 + 2] = (Math.random() - 0.5) * 0.3;
          }
          const sparkGeometry = new THREE.BufferGeometry();
          sparkGeometry.setAttribute(
            "position",
            new THREE.BufferAttribute(sparkPositions, 3),
          );
          this.portalSparks = new THREE.Points(
            sparkGeometry,
            new THREE.PointsMaterial({
              color: 0xffc15b,
              size: 0.035,
              transparent: true,
              opacity: 0.9,
              blending: THREE.AdditiveBlending,
              depthWrite: false,
              sizeAttenuation: true,
              toneMapped: false,
            }),
          );
          this.portalEnergy.add(this.portalSparks);

          // Create torus knot
          const torusKnotGeometry = new THREE.TorusKnotGeometry(
            0.75,
            0.3,
            100,
            16,
          );
          const torusKnotMaterial = new THREE.MeshPhysicalMaterial({
            roughness: 0,
            clearcoat: 1,
            clearcoatRoughness: 0,
            color: 0x92b2ff,
          });
          this.torusKnot = new THREE.Mesh(torusKnotGeometry, torusKnotMaterial);
          this.torusKnot.position.set(0, 0, 0);
          this.scene.add(this.torusKnot);

          // Create smooth torus (replacing torus knot)
          // const innerTorusGeometry = new THREE.TorusGeometry(
          //   1.0, // radius
          //   0.35, // tube
          //   64, // radial segments
          //   128 // tubular segments
          // );

          // const innerTorusMaterial = new THREE.MeshPhysicalMaterial({
          //   roughness: 0,
          //   clearcoat: 1,
          //   clearcoatRoughness: 0,
          //   color: 0x8fb3e9,
          // });

          // this.torusKnot = new THREE.Mesh(
          //   innerTorusGeometry,
          //   innerTorusMaterial
          // );
          // this.torusKnot.position.set(0, 0, 0);
          // this.scene.add(this.torusKnot);

          // Create sphere
          // const sphereGeometry = new THREE.SphereGeometry(
          //     1.0,   // radius
          //     60,    // width segments (smooth)
          //     64     // height segments (smooth)
          // );

          // const sphereMaterial = new THREE.MeshPhysicalMaterial({
          //     roughness: 0,
          //     clearcoat: 1,
          //     clearcoatRoughness: 0,
          //     color: 0x73b9ed,   // same color as before
          // });

          // this.torusKnot = new THREE.Mesh(sphereGeometry, sphereMaterial);
          // this.torusKnot.position.set(0, 0, 0);
          // this.scene.add(this.torusKnot);

          // Create box
          const boxGeometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
          const boxMaterial = new THREE.MeshPhysicalMaterial({
            roughness: 0,
            clearcoat: 1,
            clearcoatRoughness: 0,
            color: 0x92b2ff,
          });
          this.box = new THREE.Mesh(boxGeometry, boxMaterial);
          this.box.position.set(0, 0, 0);
          this.scene.add(this.box);
        }

        createRenderTargets() {
          const renderTargetParameters = {
            minFilter: THREE.LinearFilter,
            magFilter: THREE.LinearFilter,
            format: THREE.RGBAFormat,
          };
 
          this.renderTarget1 = new THREE.WebGLRenderTarget(
            window.innerWidth * window.devicePixelRatio,
            window.innerHeight * window.devicePixelRatio,
            renderTargetParameters,
          );

          this.renderTarget2 = new THREE.WebGLRenderTarget(
            window.innerWidth * window.devicePixelRatio,
            window.innerHeight * window.devicePixelRatio,
            renderTargetParameters,
          );
        }

        setupControls() {
          this.controls = new OrbitControls(
            this.camera,
            this.renderer.domElement,
          );
          this.controls.enableZoom = true;
          this.controls.autoRotate = false;
          this.controls.autoRotateSpeed = 3;
          this.controls.enableDamping = true;
          this.controls.dampingFactor = 0.05;
        }

        updateUniforms() {
          const resolution = new THREE.Vector2(
            window.innerWidth,
            window.innerHeight,
          ).multiplyScalar(Math.min(window.devicePixelRatio, 2));

          // Update cylinder 1 materials
          this.cylinder1.material.forEach((material) => {
            if (material.type === "ShaderMaterial") {
              material.uniforms.winResolution.value = resolution;
            }
          });

          // Update cylinder 2 materials
          this.cylinder2.material.forEach((material) => {
            if (material.type === "ShaderMaterial") {
              material.uniforms.winResolution.value = resolution;
            }
          });
        }

        animate() {
          requestAnimationFrame(() => this.animate());

          const elapsedTime = this.clock.getElapsedTime();

          this.portalEnergy.rotation.z = Math.sin(elapsedTime * 0.18) * 0.035;
          this.portalSparks.rotation.z = elapsedTime * 0.025;
          this.portalPulseMaterial.opacity =
            0.22 + (Math.sin(elapsedTime * 3.4) + 1) * 0.055;

          // Update controls
          this.controls.update();

          // Update uniforms
          this.updateUniforms();

          // Render to texture 1 (box visible, torus knot hidden)
          this.torusKnot.visible = false;
          this.box.visible = true;
          this.renderer.setRenderTarget(this.renderTarget1);
          this.renderer.render(this.scene, this.camera);

          // Render to texture 2 (torus knot visible, box hidden)
          this.torusKnot.visible = true;
          this.box.visible = false;
          this.renderer.setRenderTarget(this.renderTarget2);
          this.renderer.render(this.scene, this.camera);

          // Reset render target
          this.renderer.setRenderTarget(null);

          // Update textures in materials
          this.cylinder1.material[0].uniforms.uTexture.value =
            this.renderTarget1.texture;
          this.cylinder1.material[1].uniforms.uTexture.value =
            this.renderTarget1.texture;
          this.cylinder2.material[0].uniforms.uTexture.value =
            this.renderTarget2.texture;
          this.cylinder2.material[2].uniforms.uTexture.value =
            this.renderTarget2.texture;

          // Animate positions
          const newPosZ = Math.sin(elapsedTime) * 3.5;
          this.box.position.z = newPosZ;
          this.torusKnot.position.z = newPosZ;

          // Animate rotations
          this.box.rotation.x = Math.cos(elapsedTime / 2);
          this.box.rotation.y = Math.sin(elapsedTime / 2);
          this.box.rotation.z = Math.sin(elapsedTime / 2);

          this.torusKnot.rotation.x = Math.cos(elapsedTime / 2);
          this.torusKnot.rotation.y = Math.sin(elapsedTime / 2);
          this.torusKnot.rotation.z = Math.sin(elapsedTime / 2);

          // Final render
          this.renderer.render(this.scene, this.camera);
        }

        handleResize() {
          window.addEventListener("resize", () => {
            // Update camera
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();

            // Update renderer
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Update render targets
            this.renderTarget1.setSize(
              window.innerWidth * window.devicePixelRatio,
              window.innerHeight * window.devicePixelRatio,
            );
            this.renderTarget2.setSize(
              window.innerWidth * window.devicePixelRatio,
              window.innerHeight * window.devicePixelRatio,
            );
          });
        }
      }

      // Initialize the scene
      new TransformPortal();
    </script>
  </body>
</html>

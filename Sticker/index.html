<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realistic Whiteboard Studio</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        background: #e0e0e0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      /* Realistic Wall Texture */
      #wall {
        position: fixed;
        inset: 0;
        background-color: #e5e5e5;
        background-image: 
          radial-gradient(circle at 2px 2px, rgba(0,0,0,0.02) 1px, transparent 0);
        background-size: 24px 24px;
        z-index: 0;
      }

      /* Realistic Whiteboard */
      #whiteboard-container {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(92vw, 1100px);
        height: min(85vh, 700px);
        z-index: 1;
      }

      #whiteboard-frame {
        position: absolute;
        inset: 0;
        background: #fff;
        /* Aluminum Frame */
        border: 12px solid #b0b0b0;
        border-image: linear-gradient(to bottom, #d1d1d1, #a0a0a0, #d1d1d1) 1;
        border-radius: 4px;
        box-shadow: 
            0 20px 50px rgba(0,0,0,0.15),
            0 0 0 2px rgba(0,0,0,0.05);
        overflow: hidden;
      }

      /* Glossy surface overlay */
      #whiteboard-frame::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 50%);
        pointer-events: none;
        z-index: 5;
      }

      /* Marker Tray */
      #marker-tray {
        position: absolute;
        bottom: -15px;
        left: 10%;
        right: 10%;
        height: 20px;
        background: linear-gradient(to bottom, #d1d1d1, #999);
        border-radius: 0 0 10px 10px;
        box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        z-index: 2;
      }

      /* The area where stickers can be dragged */
      #sticker-canvas-area {
        position: absolute;
        inset: 20px; /* Padding inside the frame */
        z-index: 10;
        perspective: 1000px;
      }

      /* Sticker Instance Styles */
      .sticker-instance {
        position: absolute;
        cursor: grab;
        user-select: none;
        transform-style: preserve-3d;
        will-change: transform;
      }

      .sticker-instance:active {
        cursor: grabbing;
      }

      .sticker-inner {
        position: absolute;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
      }

      .gl-canvas {
        display: block;
        pointer-events: none;
        position: absolute;
        will-change: filter;
      }
    </style>
  </head>
  <body>
    <div id="wall"></div>

    <div id="whiteboard-container">
      <div id="whiteboard-frame">
        <div id="sticker-canvas-area">
          <!-- Stickers will be injected here -->
        </div>
      </div>
      <div id="marker-tray"></div>
    </div>

    <script>
      // ============================================================================
      // CONFIGURATION & SHADERS
      // ============================================================================
      const RENDER_SCALE = 2;
      const PAD_BASE = 30;
      const MESH_GRID_SIZE = 32;
      const ANIM_SPEED = 1.92;
      const ELEVATION_MAX = 0.3;

      const VERTEX_SHADER = `
        attribute vec2 aPos;
        attribute vec2 aUV;
        uniform float uPeel, uLift, uPeelAngle, uPasting, uScale, uElevation;
        varying vec2 vUV;
        varying float vHi, vSh;
        void main() {
            vUV = aUV;
            vec2 p = aPos;
            vHi = 0.0; vSh = 0.0;
            if (uPeel > 0.0) {
                vec2 peelAxis = vec2(cos(uPeelAngle), sin(uPeelAngle));
                vec2 uvCentered = aUV - vec2(0.5);
                float proj = dot(uvCentered, peelAxis);
                float diag = 0.5 - proj;
                float peelLine = -0.3 + uPeel * 2.0;
                float rampWidth = 0.6;
                float lifted = smoothstep(peelLine - rampWidth, peelLine, diag);
                lifted = 1.0 - lifted;
                float scale = 1.0 + lifted * uElevation;
                p *= scale;
                float inRamp = smoothstep(peelLine - rampWidth, peelLine - rampWidth * 0.5, diag) *
                               smoothstep(peelLine + 0.05, peelLine - rampWidth * 0.3, diag);
                float curveAmount = uPasting > 0.5 ? 0.06 : 0.12;
                p += (-peelAxis) * inRamp * curveAmount;
                float t = smoothstep(peelLine - rampWidth, peelLine, diag);
                vHi = inRamp * 0.75 * pow(1.0 - t, 1.2);
                vSh = inRamp * 0.75 * pow(t, 1.2);
            }
            gl_Position = vec4(p * uScale, 0.0, 1.0);
        }`;

      const FRAGMENT_SHADER = `
        precision mediump float;
        uniform sampler2D uTex;
        uniform vec2 uTilt;
        uniform float uSheenStrength, uMaxTiltDeg, uAspect;
        varying vec2 vUV;
        varying float vHi, vSh;
        float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
        vec3 overlay(vec3 b, vec3 l) { return mix(2.0*b*l, 1.0-2.0*(1.0-b)*(1.0-l), step(0.5,b)); }
        void main() {
            vec4 tex = texture2D(uTex, vUV);
            if (tex.a < 0.01) discard;
            vec3 c = tex.rgb * 0.95;
            // Rug Logic
            vec2 aspUV = vec2(vUV.x * uAspect, vUV.y);
            float weave = (sin(aspUV.x * 400.0) * sin(aspUV.y * 400.0)) * 0.5 + 0.5;
            c *= mix(0.5, 1.2, mix(weave, hash(aspUV * 800.0), 0.3));
            float align = dot(normalize(uTilt + 0.001), normalize(vec2(1.0, -1.0)));
            c *= mix(0.8, 1.3, align * 0.5 + 0.5);
            // Peel Lighting
            c = mix(c, overlay(c, vec3(1.0)), clamp(vHi, 0.0, 1.0) * 0.55);
            float sh = clamp(vSh, 0.0, 1.0) * 0.6;
            c = mix(c, overlay(c, vec3(0.0)), sh) * (1.0 - sh * 0.35);
            gl_FragColor = vec4(c, tex.a);
        }`;

      // ============================================================================
      // STICKER CLASS
      // ============================================================================
      let globalZ = 1000;

      class Sticker {
        constructor(parent, config) {
          this.config = {
            x: 50, y: 50, w: 200, h: 200,
            img: '', ...config
          };
          
          this.state = {
            x: this.config.x, y: this.config.y,
            peel: 0, lift: 0, tiltX: 0, tiltY: 0,
            held: false, peeling: false, sticking: false,
            lastX: 0, lastY: 0, lastT: 0, scale: 1.0,
            texReady: false
          };

          this.initDOM(parent);
          this.initGL();
          this.loadImage();
          this.attachEvents();
        }

        initDOM(parent) {
          this.el = document.createElement('div');
          this.el.className = 'sticker-instance';
          this.el.style.width = `${this.config.w}px`;
          this.el.style.height = `${this.config.h}px`;
          this.el.style.left = `${this.config.x}px`;
          this.el.style.top = `${this.config.y}px`;
          
          this.inner = document.createElement('div');
          this.inner.className = 'sticker-inner';
          
          this.canvas = document.createElement('canvas');
          this.canvas.className = 'gl-canvas';
          
          this.inner.appendChild(this.canvas);
          this.el.appendChild(this.inner);
          parent.appendChild(this.el);
        }

        initGL() {
          const gl = this.gl = this.canvas.getContext('webgl', { alpha: true });
          const vs = gl.createShader(gl.VERTEX_SHADER);
          gl.shaderSource(vs, VERTEX_SHADER); gl.compileShader(vs);
          const fs = gl.createShader(gl.FRAGMENT_SHADER);
          gl.shaderSource(fs, FRAGMENT_SHADER); gl.compileShader(fs);
          
          this.prog = gl.createProgram();
          gl.attachShader(this.prog, vs); gl.attachShader(this.prog, fs);
          gl.linkProgram(this.prog);
          
          this.uni = {};
          ['uPeel', 'uLift', 'uPeelAngle', 'uPasting', 'uScale', 'uElevation', 'uTilt', 'uMaxTiltDeg', 'uAspect'].forEach(n => {
            this.uni[n] = gl.getUniformLocation(this.prog, n);
          });

          const N = MESH_GRID_SIZE, verts = [], inds = [];
          for (let j = 0; j <= N; j++) for (let i = 0; i <= N; i++) verts.push((i/N)*2-1, (j/N)*2-1, i/N, 1-j/N);
          for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
            let a = j*(N+1)+i; inds.push(a, a+1, a+N+1, a+1, a+N+2, a+N+1);
          }
          
          const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
          gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);
          const ibo = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
          gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(inds), gl.STATIC_DRAW);
          
          gl.useProgram(this.prog);
          const aPos = gl.getAttribLocation(this.prog, 'aPos');
          gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 16, 0);
          const aUV = gl.getAttribLocation(this.prog, 'aUV');
          gl.enableVertexAttribArray(aUV); gl.vertexAttribPointer(aUV, 2, gl.FLOAT, false, 16, 8);
          
          this.resize();
        }

        resize() {
          const pad = this.config.w * 0.4;
          const cw = this.config.w + pad * 2, ch = this.config.h + pad * 2;
          this.canvas.width = cw * RENDER_SCALE; this.canvas.height = ch * RENDER_SCALE;
          this.canvas.style.width = `${cw}px`; this.canvas.style.height = `${ch}px`;
          this.canvas.style.left = `${-pad}px`; this.canvas.style.top = `${-pad}px`;
          this.state.scale = this.config.w / cw;
          this.gl.viewport(0, 0, this.canvas.width, this.canvas.height);
        }

        loadImage() {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => {
            const gl = this.gl;
            this.tex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, this.tex);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            this.state.texReady = true;
            this.draw();
          };
          img.src = this.config.img;
        }

        attachEvents() {
          const down = (e) => {
            const cx = e.clientX || e.touches[0].clientX;
            const cy = e.clientY || e.touches[0].clientY;
            const r = this.el.getBoundingClientRect();
            this.inner.style.transformOrigin = `${cx - r.left}px ${cy - r.top}px`;
            this.state.peelAngle = Math.atan2(cy - (r.top + r.height/2), cx - (r.left + r.width/2));
            this.state.held = true; this.state.peeling = true; this.state.sticking = false;
            this.state.dragOffX = cx - this.state.x; this.state.dragOffY = cy - this.state.y;
            this.el.style.zIndex = globalZ++;
            this.lastT = performance.now();
            requestAnimationFrame((t) => this.tick(t));
          };
          this.el.addEventListener('mousedown', down);
          this.el.addEventListener('touchstart', down);

          const move = (e) => {
            if (!this.state.held) return;
            const cx = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            const cy = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            this.state.x = cx - this.state.dragOffX; this.state.y = cy - this.state.dragOffY;
            this.el.style.left = `${this.state.x}px`; this.el.style.top = `${this.state.y}px`;
            
            const now = performance.now(), dt = Math.max(1, now - this.lastT);
            const vx = (cx - this.state.lastMoveX) / dt * 16, vy = (cy - this.state.lastMoveY) / dt * 16;
            this.state.tiltY += (vx * 2 - this.state.tiltY) * 0.1;
            this.state.tiltX += (-vy * 2 - this.state.tiltX) * 0.1;
            this.inner.style.transform = `rotateX(${this.state.tiltX}deg) rotateY(${this.state.tiltY}deg)`;
            this.state.lastMoveX = cx; this.state.lastMoveY = cy; this.lastT = now;
          };
          window.addEventListener('mousemove', move);
          window.addEventListener('touchmove', move);

          const up = () => {
            if (!this.state.held) return;
            this.state.held = false; this.state.peeling = false; this.state.sticking = true;
            const settle = () => {
              this.state.tiltX *= 0.8; this.state.tiltY *= 0.8;
              this.inner.style.transform = `rotateX(${this.state.tiltX}deg) rotateY(${this.state.tiltY}deg)`;
              if (Math.abs(this.state.tiltX) > 0.1) requestAnimationFrame(settle);
              else this.inner.style.transform = '';
            };
            settle();
          };
          window.addEventListener('mouseup', up);
          window.addEventListener('touchend', up);
        }

        tick(t) {
          if (!this.lastTick) this.lastTick = t;
          const dt = (t - this.lastTick) / 1000; this.lastTick = t;
          const step = ANIM_SPEED * dt;
          if (this.state.peeling) {
            this.state.peel = Math.min(1, this.state.peel + step);
            this.state.lift = Math.min(1, this.state.lift + step);
          } else if (this.state.sticking) {
            this.state.peel = Math.max(0, this.state.peel - step);
            this.state.lift = Math.max(0, this.state.lift - step);
            if (this.state.peel <= 0) this.state.sticking = false;
          }
          
          const tr = Math.max(this.state.lift, this.state.peel);
          const shadow = `drop-shadow(${tr*15}px ${tr*15}px ${tr*10}px rgba(0,0,0,0.3))`;
          this.canvas.style.filter = shadow;

          this.draw();
          if (this.state.held || this.state.peeling || this.state.sticking) requestAnimationFrame((t)=>this.tick(t));
          else this.lastTick = null;
        }

        draw() {
          const gl = this.gl, u = this.uni, s = this.state;
          if (!s.texReady) return;
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.uniform1f(u.uPeel, s.peel); gl.uniform1f(u.uLift, s.lift);
          gl.uniform1f(u.uPeelAngle, s.peelAngle); gl.uniform1f(u.uPasting, s.sticking?1:0);
          gl.uniform1f(u.uScale, s.scale); gl.uniform1f(u.uElevation, ELEVATION_MAX);
          gl.uniform2f(u.uTilt, s.tiltY, -s.tiltX); gl.uniform1f(u.uMaxTiltDeg, 30);
          gl.uniform1f(u.uAspect, this.config.w/this.config.h);
          gl.drawElements(gl.TRIANGLES, this.indexCount, gl.UNSIGNED_SHORT, 0);
        }
      }

      // ============================================================================
      // INITIALIZATION
      // ============================================================================
      window.addEventListener('DOMContentLoaded', () => {
        const area = document.getElementById('sticker-canvas-area');
        
        // Add 3 stickers with different images and locations
        new Sticker(area, {
          x: 50, y: 50, w: 280, h: 200,
          img: "https://raw.githubusercontent.com/Aishwary2004Gupta/models/cloud/images/fake-journal.png"
        });

        new Sticker(area, {
          x: 400, y: 150, w: 220, h: 220,
          img: "https://imagedelivery.net/IEUjvl3YUlxY-MrTpOAWDQ/3fb4a247-64e9-4c54-2391-86598eebfe00/w=800"
        });

        new Sticker(area, {
          x: 100, y: 350, w: 250, h: 180,
          img: "https://plus.unsplash.com/premium_photo-1664194583917-b0ba07c4ce2a?q=80&w=500&auto=format"
        });
      });
    </script>
  </body>
</html>

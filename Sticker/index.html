<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draggable Sticker – with Rug Mode</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #e5e7eb;
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
      }

      #sticker-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: visible;
        perspective: 800px;
      }

      #sizing-div,
      #zoom-probe {
        position: absolute;
        opacity: 0;
        pointer-events: none;
        user-select: none;
      }

      #sticker {
        position: absolute;
        width: 100%;
        height: 100%;
        cursor: grab;
        user-select: none;
        perspective: 800px;
        transform-style: preserve-3d;
        will-change: transform;
        overflow: visible;
      }

      #sticker:active {
        cursor: grabbing;
      }

      #inner {
        position: absolute;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        overflow: visible;
      }

      canvas {
        display: block;
        pointer-events: none;
        position: absolute;
      }

      /* Simple UI for demo */
      .controls {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(8px);
        padding: 16px;
        border-radius: 16px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
        z-index: 10000;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .controls label {
        font-weight: 600;
        font-size: 0.85rem;
        color: #1e293b;
      }

      .controls select {
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        background: white;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <label for="mode-select">Effect Mode</label>
      <select id="mode-select">
        <option value="sheen">Sheen</option>
        <option value="holo">Holographic</option>
        <option value="rug" selected>Rug Texture</option>
      </select>
    </div>

    <div id="sticker-container">
      <div id="sizing-div"></div>
      <div id="zoom-probe"></div>
      <div id="sticker">
        <div id="inner">
          <canvas id="gl-canvas"></canvas>
        </div>
      </div>
    </div>

    <script>
      // ============================================================================
      // TEXTURE / IMAGE SOURCES
      // ============================================================================
      const DEFAULT_IMAGE =
        "https://imagedelivery.net/IEUjvl3YUlxY-MrTpOAWDQ/3fb4a247-64e9-4c54-2391-86598eebfe00/w=800";

      // ============================================================================
      // COMPONENT DEFAULTS
      // ============================================================================
      const COMPONENT_DEFAULTS = {
        image: {
          src: "https://plus.unsplash.com/premium_photo-1782403647102-070de72f10a0?q=80&w=1234&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D",
        },
        imageWidth: 600,
        imageHeight: 400,
        tilt: 45,
        lighting: true,
        lightingStrength: 10,
        lightingColor: "#ffffff",
        sheenMode: "rug", // "sheen" | "holo" | "rug"
        elevation: 10,
        staticShadow: "0px 1px 2px 0px rgba(0, 0, 0, 0.30)",
        dynamicShadow: "0px 13px 14px 0px rgba(0, 0, 0, 0.30)",
        rugStrength: 0.7, // internal rug intensity (for rug mode)
      };

      // ============================================================================
      // CONSTANTS
      // ============================================================================
      const RENDER_SCALE = 2;
      const PAD_BASE = 20;
      const MESH_GRID_SIZE = 32;
      const DRAG_Z_INDEX_BASE = 1000;
      let zIndexCounter = DRAG_Z_INDEX_BASE;
      const getNextZIndex = () => ++zIndexCounter;

      const DRAG_TILT_SENSITIVITY = 3;
      const DRAG_TILT_SMOOTHING = 0.05;
      const SHEEN_STRENGTH = 0.6;
      const SHEEN_TILT_SHIFT = 0.05;
      const SHEEN_TILT_DEADZONE = 0.035;
      const ANIM_SPEED = 1.92;
      const HOLO_MOTION_BUMP = 0.15;
      const HOLO_MOTION_DECAY = 0.88;
      const ELEVATION_INTERNAL_MAX = 0.3;

      // ============================================================================
      // WEBGL SHADERS
      // ============================================================================
      const VERTEX_SHADER = `
        attribute vec2 aPos;
        attribute vec2 aUV;
        uniform float uPeel;
        uniform float uLift;
        uniform float uPeelAngle;
        uniform float uPasting;
        uniform float uScale;
        uniform float uElevation;
        varying vec2 vUV;
        varying float vHi;
        varying float vSh;

        void main() {
            vUV = aUV;
            vec2 p = aPos;
            vHi = 0.0;
            vSh = 0.0;

            if (uPeel > 0.0) {
                vec2 peelAxis = vec2(cos(uPeelAngle), sin(uPeelAngle));
                vec2 uvCentered = aUV - vec2(0.5);
                float proj = dot(uvCentered, peelAxis);
                float diag = 0.5 - proj;

                float peelLine = -0.3 + uPeel * 2.0;
                float rampWidth = 0.6;
                float lifted = smoothstep(peelLine - rampWidth, peelLine, diag);
                lifted = 1.0 - lifted;

                float scale = 1.0 + lifted * uElevation;
                p *= scale;

                float inRamp = smoothstep(peelLine - rampWidth, peelLine - rampWidth * 0.5, diag) *
                               smoothstep(peelLine + 0.05, peelLine - rampWidth * 0.3, diag);

                float curveAmount = uPasting > 0.5 ? 0.06 : 0.12;
                p += (-peelAxis) * inRamp * curveAmount;

                float t = smoothstep(peelLine - rampWidth, peelLine, diag);
                vHi = inRamp * 0.75 * pow(1.0 - t, 1.2);
                vSh = inRamp * 0.75 * pow(t, 1.2);
            }

            gl_Position = vec4(p * uScale, 0.0, 1.0);
        }
      `;

      const FRAGMENT_SHADER = `
        precision mediump float;
        uniform sampler2D uTex;
        uniform sampler2D uRugTex;
        uniform float uRugMode;      // 0.0 = sheen/holo, 1.0 = rug mode
        uniform float uRugStrength;
        uniform vec2 uTilt;
        uniform float uSheenStrength;
        uniform float uSheenTiltShift;
        uniform float uSheenTiltDeadzone;
        uniform float uMaxTiltDeg;
        uniform float uHoloMode;     // only used when uRugMode < 0.5
        uniform float uHoloMotion;
        uniform vec3 uSheenColor;
        varying vec2 vUV;
        varying float vHi;
        varying float vSh;

        vec3 overlayBlend(vec3 base, vec3 blend) {
            return mix(2.0 * base * blend, 1.0 - 2.0 * (1.0 - base) * (1.0 - blend), step(0.5, base));
        }

        vec3 hsl2rgb(float h, float s, float l) {
            float c = (1.0 - abs(2.0 * l - 1.0)) * s;
            float x = c * (1.0 - abs(mod(h * 6.0, 2.0) - 1.0));
            float m = l - c * 0.5;
            vec3 rgb;
            if (h < 1.0/6.0) rgb = vec3(c, x, 0.0);
            else if (h < 2.0/6.0) rgb = vec3(x, c, 0.0);
            else if (h < 3.0/6.0) rgb = vec3(0.0, c, x);
            else if (h < 4.0/6.0) rgb = vec3(0.0, x, c);
            else if (h < 5.0/6.0) rgb = vec3(x, 0.0, c);
            else rgb = vec3(c, 0.0, x);
            return rgb + m;
        }

        void main() {
            vec4 tex = texture2D(uTex, vUV);
            if (tex.a < 0.01) discard;

            vec3 c = tex.rgb * 0.95;

            // ── Rug mode: weave texture overlay ──
            if (uRugMode > 0.5) {
                // Tile the rug texture (higher frequency for a fabric look)
                vec4 rugSample = texture2D(uRugTex, vUV * 8.0);
                float fiber = dot(rugSample.rgb, vec3(0.299, 0.587, 0.114));
                // Create a subtle woven undulation
                float weave = sin(vUV.x * 60.0) * sin(vUV.y * 60.0) * 0.15;
                fiber = clamp(fiber + weave, 0.0, 1.0);

                // Blend using soft light type
                vec3 rugColor = c * (0.7 + fiber * 0.6);
                c = mix(c, rugColor, uRugStrength);
            }

            // ── Sheen / Holo effect (only when not in rug mode) ──
            if (uRugMode < 0.5) {
                float maxTilt = max(0.001, uMaxTiltDeg);
                float tiltMag = clamp(length(uTilt) / maxTilt, 0.0, 1.0);
                float tiltGate = smoothstep(uSheenTiltDeadzone, 1.0, tiltMag);

                float gradient = fract(vUV.x * 0.5 + vUV.y * 0.5 + uTilt.x * uSheenTiltShift + uTilt.y * uSheenTiltShift);

                if (uHoloMode > 0.5) {
                    float holoStrength = uSheenStrength * uHoloMotion;
                    float distFromWhite = length(tex.rgb - vec3(1.0));
                    float nonWhiteMask = smoothstep(0.06, 0.22, distFromWhite);
                    vec3 rainbow = hsl2rgb(gradient, 0.8, 0.55);
                    c = mix(c, rainbow, holoStrength * nonWhiteMask * tex.a);
                } else {
                    float effectStrength = uSheenStrength * tiltGate;
                    float sheen = smoothstep(0.2, 0.5, gradient) * (1.0 - smoothstep(0.5, 0.8, gradient));
                    c = mix(c, uSheenColor, sheen * effectStrength * tex.a);
                }
            }

            // ── Peel/paste lighting (always applied) ──
            float hiW = clamp(vHi, 0.0, 1.0) * 0.55;
            float shW = clamp(vSh, 0.0, 1.0) * 0.60;

            vec3 hi = overlayBlend(c, vec3(1.0));
            c = mix(c, hi, hiW);

            vec3 sh = overlayBlend(c, vec3(0.0));
            c = mix(c, sh, shW);
            c *= (1.0 - shW * 0.35);

            c = clamp(c, 0.0, 1.0);
            gl_FragColor = vec4(c, tex.a);
        }
      `;

      // ============================================================================
      // UTILITIES
      // ============================================================================
      const resolveImageSource = (input) => {
        if (!input) return undefined;
        if (typeof input === "string") return input.trim() || undefined;
        return input.src || input.url || (input.asset && input.asset.url) || undefined;
      };

      const parseColorToRgb = (input) => {
        if (!input) return [1, 1, 1];
        const s = input.trim();
        const m = s.match(/rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/i);
        if (m) return [+m[1] / 255, +m[2] / 255, +m[3] / 255];
        let h = s.replace(/^#/, "");
        if (h.length === 3) h = h.split("").map((c) => c + c).join("");
        if (h.length >= 6)
          return [
            parseInt(h.slice(0, 2), 16) / 255,
            parseInt(h.slice(2, 4), 16) / 255,
            parseInt(h.slice(4, 6), 16) / 255,
          ];
        return [1, 1, 1];
      };

      const parseBoxShadow = (shadow) => {
        const result = { x: 0, y: 0, blur: 0, color: "rgba(0,0,0,0.3)" };
        if (!shadow) return result;
        const colorMatch = shadow.match(/(rgba?\([^)]+\)|#[0-9a-fA-F]{3,8}|\b[a-z]+\b(?=\s*$))/i);
        if (colorMatch) result.color = colorMatch[0];
        const numbers = shadow.match(/-?\d+(\.\d+)?(px)?/g);
        if (numbers) {
          const vals = numbers.map((n) => parseFloat(n));
          if (vals.length >= 1) result.x = vals[0];
          if (vals.length >= 2) result.y = vals[1];
          if (vals.length >= 3) result.blur = vals[2];
        }
        return result;
      };

      const lerpShadow = (a, b, t) => {
        const x = a.x + (b.x - a.x) * t;
        const y = a.y + (b.y - a.y) * t;
        const blur = a.blur + (b.blur - a.blur) * t;
        const color = t > 0.5 ? b.color : a.color;
        return `drop-shadow(${x.toFixed(2)}px ${y.toFixed(2)}px ${blur.toFixed(2)}px ${color})`;
      };

      // Generate a procedural rug texture using 2D canvas
      const generateRugTexture = () => {
        const size = 256;
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");

        // Background: warm wool colour
        ctx.fillStyle = "#d4b896";
        ctx.fillRect(0, 0, size, size);

        // Draw interlocking threads (horizontal and vertical)
        const threadCount = 16;
        const step = size / threadCount;
        ctx.lineWidth = step * 0.4;

        // Vertical threads
        ctx.strokeStyle = "#c1a57b";
        for (let i = 0; i < threadCount; i++) {
          const x = step * i + step / 2;
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, size);
          ctx.stroke();
        }

        // Horizontal threads (slightly darker)
        ctx.strokeStyle = "#b6946e";
        for (let j = 0; j < threadCount; j++) {
          const y = step * j + step / 2;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(size, y);
          ctx.stroke();
        }

        // Add subtle speckle/noise for texture
        ctx.fillStyle = "rgba(0,0,0,0.03)";
        for (let k = 0; k < 2000; k++) {
          const x = Math.random() * size;
          const y = Math.random() * size;
          ctx.fillRect(x, y, 2, 2);
        }

        return canvas;
      };

      // ============================================================================
      // MAIN STICKER CLASS
      // ============================================================================
      class StickerDrag {
        constructor(props) {
          this.props = { ...COMPONENT_DEFAULTS, ...props };

          this.tiltSensitivity = DRAG_TILT_SENSITIVITY;
          this.maxTilt = Math.max(1, this.props.tilt);
          this.tiltSmoothing = this.props.tiltSmoothing ?? DRAG_TILT_SMOOTHING;
          this.sheenStrength = this.props.lighting
            ? Math.max(1, Math.min(10, this.props.lightingStrength)) / 10
            : 0;
          this.sheenColor = parseColorToRgb(this.props.lightingColor);
          this.elevation = (Math.max(1, Math.min(10, this.props.elevation)) / 10) * ELEVATION_INTERNAL_MAX;
          this.sheenMode = this.props.sheenMode;
          this.imageWidth = this.props.imageWidth;
          this.imageHeight = this.props.imageHeight;
          this.rugStrength = this.props.rugStrength ?? 0.7;

          // DOM elements
          this.container = document.getElementById("sticker-container");
          this.sticker = document.getElementById("sticker");
          this.inner = document.getElementById("inner");
          this.canvas = document.getElementById("gl-canvas");
          this.sizingDiv = document.getElementById("sizing-div");
          this.zoomProbe = document.getElementById("zoom-probe");

          this.sizingDimensions = { width: 400, height: 400 };

          // WebGL state
          this.gl = null;
          this.program = null;
          this.texture = null;
          this.rugTexture = null;
          this.vbo = null;
          this.ibo = null;
          this.indexCount = 0;
          this.uniforms = {};

          // Animation state
          this.state = {
            x: 0, y: 0, width: 200, height: 200,
            scale: 1.0,
            held: false, peeling: false, sticking: false,
            dragStartX: 0, dragStartY: 0, dragOrigX: 0, dragOrigY: 0,
            peel: 0, lift: 0, peelAngle: -Math.PI / 4,
            dragTiltX: 0, dragTiltY: 0,
            currentTiltX: 0, currentTiltY: 0,
            prevTiltX: 0, prevTiltY: 0,
            holoMotion: 0,
            lastMoveX: 0, lastMoveY: 0, lastMoveT: 0,
            texReady: false,
          };

          this.animationId = null;
          this.lastTickT = null;
          this.parsedStaticShadow = parseBoxShadow(this.props.staticShadow);
          this.parsedDynamicShadow = parseBoxShadow(this.props.dynamicShadow);

          // Resize interval
          this.applyResizeTimeout = null;

          this.init();
        }

        // ─── INITIALIZERS ────────────────────────────
        init() {
          this.applySizingDiv();
          this.initWebGL();
          this.loadMainImage();
          this.createRugTextureFromCanvas();   // procedural rug texture
          this.attachEvents();
          this.startResizeDetection();

          // Sync UI dropdown
          const modeSelect = document.getElementById("mode-select");
          if (modeSelect) {
            modeSelect.value = this.sheenMode;
            modeSelect.addEventListener("change", (e) => {
              this.sheenMode = e.target.value;
              this.draw();
            });
          }
        }

        applySizingDiv() {
          const d = this.sizingDimensions;
          this.sizingDiv.style.width = `${d.width}px`;
          this.sizingDiv.style.height = `${d.height}px`;
          this.sizingDiv.style.minWidth = `${d.width}px`;
          this.sizingDiv.style.minHeight = `${d.height}px`;
        }

        initWebGL() {
          const canvas = this.canvas;
          const gl = canvas.getContext("webgl", { alpha: true, antialias: true, premultipliedAlpha: false });
          if (!gl) return;
          this.gl = gl;

          const compileShader = (source, type) => {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
              console.error("Shader compile error:", gl.getShaderInfoLog(shader));
              return null;
            }
            return shader;
          };

          const vs = compileShader(VERTEX_SHADER, gl.VERTEX_SHADER);
          const fs = compileShader(FRAGMENT_SHADER, gl.FRAGMENT_SHADER);
          if (!vs || !fs) return;

          const program = gl.createProgram();
          gl.attachShader(program, vs);
          gl.attachShader(program, fs);
          gl.linkProgram(program);
          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            console.error("Program link error:", gl.getProgramInfoLog(program));
            return;
          }
          this.program = program;

          const uniformNames = [
            "uPeel", "uLift", "uPeelAngle", "uPasting", "uScale", "uElevation",
            "uTilt", "uSheenStrength", "uSheenColor", "uSheenTiltShift",
            "uSheenTiltDeadzone", "uMaxTiltDeg", "uHoloMode", "uHoloMotion",
            "uTex", "uRugTex", "uRugMode", "uRugStrength"
          ];
          this.uniforms = {};
          for (const name of uniformNames) {
            this.uniforms[name] = gl.getUniformLocation(program, name);
          }
          this.aPos = gl.getAttribLocation(program, "aPos");
          this.aUV = gl.getAttribLocation(program, "aUV");

          const N = MESH_GRID_SIZE;
          const verts = [];
          const inds = [];
          for (let j = 0; j <= N; j++) {
            for (let i = 0; i <= N; i++) {
              verts.push((i / N) * 2 - 1, (j / N) * 2 - 1, i / N, 1 - j / N);
            }
          }
          for (let j = 0; j < N; j++) {
            for (let i = 0; i < N; i++) {
              const a = j * (N + 1) + i;
              inds.push(a, a + 1, a + N + 1, a + 1, a + N + 2, a + N + 1);
            }
          }
          const vbo = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
          gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);
          this.vbo = vbo;
          const ibo = gl.createBuffer();
          gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
          gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(inds), gl.STATIC_DRAW);
          this.ibo = ibo;
          this.indexCount = inds.length;

          gl.viewport(0, 0, canvas.width, canvas.height);
          gl.clearColor(0, 0, 0, 0);
          gl.clear(gl.COLOR_BUFFER_BIT);
        }

        loadMainImage() {
          const imageSrc = resolveImageSource(this.props.image) || DEFAULT_IMAGE;
          const gl = this.gl;
          if (!gl || !this.program) return;

          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => {
            if (this.texture) gl.deleteTexture(this.texture);
            const tex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            this.texture = tex;
            this.state.texReady = true;
            this.handleResize();
            this.updateShadowCSS();
            this.draw();
          };
          img.onerror = () => console.error("Failed to load main image");
          img.src = imageSrc;
        }

        createRugTextureFromCanvas() {
          const gl = this.gl;
          if (!gl) return;

          const rugCanvas = generateRugTexture();
          const tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, rugCanvas);
          // Repeat for tiling
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          this.rugTexture = tex;
        }

        // ─── DRAW ─────────────────────────────────────
        draw() {
          const gl = this.gl;
          const program = this.program;
          const texture = this.texture;
          const rugTexture = this.rugTexture;
          const state = this.state;
          if (!gl || !program || !texture || !state.texReady) return;

          gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
          gl.clearColor(0, 0, 0, 0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.enable(gl.BLEND);
          gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

          gl.useProgram(program);
          gl.bindBuffer(gl.ARRAY_BUFFER, this.vbo);
          gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.ibo);
          gl.enableVertexAttribArray(this.aPos);
          gl.enableVertexAttribArray(this.aUV);
          gl.vertexAttribPointer(this.aPos, 2, gl.FLOAT, false, 16, 0);
          gl.vertexAttribPointer(this.aUV, 2, gl.FLOAT, false, 16, 8);

          const u = this.uniforms;
          gl.uniform1f(u.uPeel, state.peel);
          gl.uniform1f(u.uLift, state.lift);
          gl.uniform1f(u.uPeelAngle, state.peelAngle);
          gl.uniform1f(u.uPasting, state.sticking ? 1.0 : 0.0);
          gl.uniform1f(u.uScale, state.scale);
          gl.uniform1f(u.uElevation, this.elevation);

          gl.uniform2f(u.uTilt, state.currentTiltX, state.currentTiltY);
          gl.uniform1f(u.uSheenStrength, this.sheenStrength);
          gl.uniform3f(u.uSheenColor, this.sheenColor[0], this.sheenColor[1], this.sheenColor[2]);
          gl.uniform1f(u.uSheenTiltShift, SHEEN_TILT_SHIFT);
          gl.uniform1f(u.uSheenTiltDeadzone, SHEEN_TILT_DEADZONE);
          gl.uniform1f(u.uMaxTiltDeg, this.maxTilt);
          gl.uniform1f(u.uHoloMode, this.sheenMode === "holo" ? 1.0 : 0.0);
          gl.uniform1f(u.uHoloMotion, state.holoMotion);

          // Rug mode logic
          const isRug = this.sheenMode === "rug" ? 1.0 : 0.0;
          gl.uniform1f(u.uRugMode, isRug);
          gl.uniform1f(u.uRugStrength, this.rugStrength);

          // Bind main texture
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, texture);
          gl.uniform1i(u.uTex, 0);
          // Bind rug texture (always available)
          if (rugTexture) {
            gl.activeTexture(gl.TEXTURE1);
            gl.bindTexture(gl.TEXTURE_2D, rugTexture);
            gl.uniform1i(u.uRugTex, 1);
          }

          gl.drawElements(gl.TRIANGLES, this.indexCount, gl.UNSIGNED_SHORT, 0);
        }

        // ─── SHADOW ──────────────────────────────────
        updateShadowCSS() {
          const tRaw = Math.max(this.state.lift, this.state.peel);
          const t = tRaw * tRaw * (3 - 2 * tRaw);
          this.canvas.style.filter = lerpShadow(this.parsedStaticShadow, this.parsedDynamicShadow, t);
        }

        // ─── ANIMATION LOOP ──────────────────────────
        tick(timestamp) {
          if (this.lastTickT === null) this.lastTickT = timestamp;
          const dt = Math.min((timestamp - this.lastTickT) / 1000, 0.1);
          this.lastTickT = timestamp;

          const step = ANIM_SPEED * dt;
          let changed = false;

          const state = this.state;
          if (state.peeling) {
            if (state.peel < 1 || state.lift < 1) {
              state.peel = Math.min(1, state.peel + step);
              state.lift = Math.min(1, state.lift + step);
              changed = true;
            }
          }
          if (state.sticking) {
            if (state.peel > 0 || state.lift > 0) {
              state.peel = Math.max(0, state.peel - step);
              state.lift = Math.max(0, state.lift - step);
              changed = true;
            } else {
              state.sticking = false;
            }
          }

          const holoDecay = this.sheenMode === "holo" && state.holoMotion > 0.005;
          if (holoDecay) {
            state.holoMotion *= HOLO_MOTION_DECAY;
            if (state.holoMotion < 0.005) state.holoMotion = 0;
            changed = true;
          }

          if (changed) this.updateShadowCSS();
          if (changed || state.held || holoDecay) this.draw();

          if (state.held || state.peeling || state.sticking || holoDecay) {
            this.animationId = requestAnimationFrame(this.tick);
          } else {
            this.animationId = null;
            this.lastTickT = null;
          }
        }

        ensureTickRunning() {
          if (this.animationId !== null) return;
          this.lastTickT = null;
          this.animationId = requestAnimationFrame(this.tick);
        }

        // ─── RESIZE ──────────────────────────────────
        handleResize() {
          const container = this.container;
          const canvas = this.canvas;
          const sticker = this.sticker;
          const gl = this.gl;
          if (!container || !canvas || !sticker || !gl) return;

          const cw = container.clientWidth || 200;
          const ch = container.clientHeight || 200;
          const w = this.imageWidth > 0 ? this.imageWidth : cw;
          const h = this.imageHeight > 0 ? this.imageHeight : ch;

          const maxDim = Math.max(w, h);
          const elevationPad = maxDim * this.elevation * 0.6;
          const effPad = PAD_BASE + elevationPad;
          const canvasW = w + effPad * 2;
          const canvasH = h + effPad * 2;

          const scale = Math.min(w / canvasW, h / canvasH);
          const x = (cw - w) / 2;
          const y = (ch - h) / 2;

          canvas.width = Math.round(canvasW * RENDER_SCALE);
          canvas.height = Math.round(canvasH * RENDER_SCALE);
          canvas.style.width = `${canvasW}px`;
          canvas.style.height = `${canvasH}px`;
          canvas.style.left = `${-effPad}px`;
          canvas.style.top = `${-effPad}px`;

          sticker.style.width = `${w}px`;
          sticker.style.height = `${h}px`;
          sticker.style.left = `${x}px`;
          sticker.style.top = `${y}px`;

          this.state.width = w;
          this.state.height = h;
          this.state.x = x;
          this.state.y = y;
          this.state.scale = scale;

          gl.viewport(0, 0, canvas.width, canvas.height);
          if (this.state.texReady) this.draw();
        }

        scheduleResize(measuredW, measuredH) {
          clearTimeout(this.applyResizeTimeout);
          this.applyResizeTimeout = setTimeout(() => {
            const prev = this.sizingDimensions;
            const w = Math.max(1, Math.round(measuredW)) || prev.width;
            const h = Math.max(1, Math.round(measuredH)) || prev.height;
            if (Math.abs(w - prev.width) >= 5 || Math.abs(h - prev.height) >= 5) {
              this.sizingDimensions = { width: w, height: h };
              this.applySizingDiv();
            }
            this.handleResize();
          }, 180);
        }

        startResizeDetection() {
          const container = this.container;
          const ro = new ResizeObserver(() => {
            const w = container.clientWidth || container.offsetWidth || 400;
            const h = container.clientHeight || container.offsetHeight || 400;
            this.scheduleResize(w, h);
          });
          ro.observe(container);
          this.resizeObserver = ro;
          this.handleResize();
        }

        // ─── POINTER HANDLERS ────────────────────────
        pointerDown(clientX, clientY) {
          const state = this.state;
          const sticker = this.sticker;
          const inner = this.inner;
          if (!sticker || !inner) return;

          const rect = sticker.getBoundingClientRect();
          const grabX = clientX - rect.left;
          const grabY = clientY - rect.top;
          inner.style.transformOrigin = `${grabX}px ${grabY}px`;

          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          state.peelAngle = Math.atan2(clientY - cy, clientX - cx);

          state.dragStartX = clientX;
          state.dragStartY = clientY;
          state.dragOrigX = state.x;
          state.dragOrigY = state.y;
          state.peel = 0;
          state.lift = 0;
          state.held = true;
          state.peeling = true;
          state.sticking = false;
          state.lastMoveX = clientX;
          state.lastMoveY = clientY;
          state.lastMoveT = performance.now();

          this.container.style.zIndex = getNextZIndex();
          this.ensureTickRunning();
        }

        pointerMove(clientX, clientY) {
          const state = this.state;
          if (!state.held) return;
          const sticker = this.sticker;
          const inner = this.inner;
          if (!sticker || !inner) return;

          state.x = state.dragOrigX + (clientX - state.dragStartX);
          state.y = state.dragOrigY + (clientY - state.dragStartY);
          sticker.style.left = `${state.x}px`;
          sticker.style.top = `${state.y}px`;

          const now = performance.now();
          const dt = Math.max(1, now - state.lastMoveT);
          const velX = ((clientX - state.lastMoveX) / dt) * 16;
          const velY = ((clientY - state.lastMoveY) / dt) * 16;
          state.lastMoveX = clientX;
          state.lastMoveY = clientY;
          state.lastMoveT = now;

          const targetTiltY = Math.max(-this.maxTilt, Math.min(this.maxTilt, velX * this.tiltSensitivity));
          const targetTiltX = Math.max(-this.maxTilt, Math.min(this.maxTilt, -velY * this.tiltSensitivity));
          state.dragTiltX += (targetTiltX - state.dragTiltX) * this.tiltSmoothing;
          state.dragTiltY += (targetTiltY - state.dragTiltY) * this.tiltSmoothing;
          state.currentTiltX = state.dragTiltX;
          state.currentTiltY = state.dragTiltY;

          if (this.sheenMode === "holo") {
            const delta = Math.abs(state.dragTiltX - state.prevTiltX) + Math.abs(state.dragTiltY - state.prevTiltY);
            state.holoMotion = Math.min(1, state.holoMotion + delta * HOLO_MOTION_BUMP);
            state.prevTiltX = state.dragTiltX;
            state.prevTiltY = state.dragTiltY;
          }

          inner.style.transform = `rotateX(${state.dragTiltX}deg) rotateY(${state.dragTiltY}deg)`;
        }

        pointerUp() {
          const state = this.state;
          if (!state.held) return;
          state.held = false;
          state.peeling = false;
          state.sticking = true;

          if (state.peel >= 0.95 && this.inner) {
            const rect = this.inner.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            state.peelAngle = Math.atan2(-(state.lastMoveY - cy), -(state.lastMoveX - cx));
            state.peel = 1;
          }

          this.settleTilt();
          this.ensureTickRunning();
        }

        settleTilt() {
          const inner = this.inner;
          const state = this.state;
          const step = () => {
            state.dragTiltX *= 0.9;
            state.dragTiltY *= 0.9;
            state.currentTiltX = state.dragTiltX;
            state.currentTiltY = state.dragTiltY;
            if (inner) inner.style.transform = `rotateX(${state.dragTiltX}deg) rotateY(${state.dragTiltY}deg)`;
            if (Math.abs(state.dragTiltX) > 0.1 || Math.abs(state.dragTiltY) > 0.1) {
              requestAnimationFrame(step);
            } else {
              state.dragTiltX = state.dragTiltY = 0;
              state.currentTiltX = state.currentTiltY = 0;
              state.prevTiltX = state.prevTiltY = 0;
              if (inner) inner.style.transform = "";
            }
          };
          step();
        }

        attachEvents() {
          this.sticker.addEventListener("mousedown", (e) => {
            e.preventDefault();
            this.pointerDown(e.clientX, e.clientY);
          });
          window.addEventListener("mousemove", (e) => this.pointerMove(e.clientX, e.clientY));
          window.addEventListener("mouseup", () => this.pointerUp());

          this.sticker.addEventListener("touchstart", (e) => {
            e.preventDefault();
            const t = e.touches[0];
            if (t) this.pointerDown(t.clientX, t.clientY);
          }, { passive: false });
          window.addEventListener("touchmove", (e) => {
            const t = e.touches[0];
            if (t) this.pointerMove(t.clientX, t.clientY);
          }, { passive: false });
          window.addEventListener("touchend", () => this.pointerUp());
        }
      }

      // ─── BOOT ──────────────────────────────────────
      window.addEventListener("DOMContentLoaded", () => {
        new StickerDrag({ sheenMode: "rug" });
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draggable Sticker on Rug</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: #d8cfc2;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      /* Floor backdrop so the rug reads as sitting on a surface */
      #floor {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 50% 40%,
            rgba(255, 255, 255, 0.25),
            rgba(0, 0, 0, 0.08) 80%
          ),
          repeating-linear-gradient(
            90deg,
            #cbb79a 0px,
            #cbb79a 46px,
            #c2ad8e 46px,
            #c2ad8e 48px
          );
        z-index: 0;
      }

      #sticker-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: visible;
        perspective: 800px;
        z-index: 2;
      }

      #sizing-div {
        position: relative;
        opacity: 0;
        pointer-events: none;
        user-select: none;
      }

      #zoom-probe {
        position: absolute;
        width: 20px;
        height: 20px;
        top: 0;
        left: 0;
        opacity: 0;
        pointer-events: none;
      }

      #sticker {
        position: absolute;
        width: 100%;
        height: 100%;
        cursor: grab;
        user-select: none;
        perspective: 800px;
        transform-style: preserve-3d;
        will-change: transform;
        overflow: visible;
      }

      #sticker:active {
        cursor: grabbing;
      }

      #inner {
        position: absolute;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        overflow: visible;
      }

      #gl-canvas {
        display: block;
        pointer-events: none;
        position: absolute;
      }

      /* ---------- RUG NODE ---------- */
      #rug-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotateX(52deg) rotateZ(-8deg);
        transform-style: preserve-3d;
        z-index: 1;
        pointer-events: none;
        filter: drop-shadow(0 40px 45px rgba(0, 0, 0, 0.45));
      }

      #rug-canvas {
        display: block;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div id="floor"></div>

    <!-- NEW: Rug texture node -->
    <div id="rug-container">
      <canvas id="rug-canvas"></canvas>
    </div>

    <div id="sticker-container">
      <div id="sizing-div"></div>
      <div id="zoom-probe"></div>
      <div id="sticker">
        <div id="inner">
          <canvas id="gl-canvas"></canvas>
        </div>
      </div>
    </div>

    <script>
      // ============================================================================
      // RUG TEXTURE NODE
      // Procedurally draws a woven rug with a border pattern + fringe.
      // ============================================================================

      class RugNode {
        constructor(props = {}) {
          this.props = {
            width: 640,
            height: 420,
            baseColor: "#8f2f2a", // deep rug red
            weaveColor: "#a33f38",
            borderColor: "#e9d7a8", // cream border
            accentColor: "#2c4a63", // navy accents
            fringeColor: "#e9dcc0",
            ...props,
          };

          this.container = document.getElementById("rug-container");
          this.canvas = document.getElementById("rug-canvas");
          this.ctx = this.canvas.getContext("2d");

          this.render();
        }

        render() {
          const { width, height } = this.props;
          const dpr = Math.min(window.devicePixelRatio || 1, 2);

          const fringe = 26; // fringe length on left/right ends
          const totalW = width + fringe * 2;

          this.canvas.width = Math.round(totalW * dpr);
          this.canvas.height = Math.round(height * dpr);
          this.canvas.style.width = totalW + "px";
          this.canvas.style.height = height + "px";

          const ctx = this.ctx;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          ctx.clearRect(0, 0, totalW, height);

          const ox = fringe; // rug body x-origin

          this.drawFringe(ctx, ox, width, height, fringe);
          this.drawBody(ctx, ox, width, height);
          this.drawWeave(ctx, ox, width, height);
          this.drawBorders(ctx, ox, width, height);
          this.drawCentralPattern(ctx, ox, width, height);
          this.drawWear(ctx, ox, width, height);
        }

        // Rounded rect helper
        rr(ctx, x, y, w, h, r) {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
        }

        drawFringe(ctx, ox, w, h, fringe) {
          ctx.save();
          ctx.strokeStyle = this.props.fringeColor;
          ctx.lineWidth = 2;
          ctx.lineCap = "round";
          const strands = 40;
          for (let i = 0; i < strands; i++) {
            const y = (i + 0.5) * (h / strands);
            const wob = Math.sin(i * 1.3) * 3;
            // left fringe
            ctx.beginPath();
            ctx.moveTo(ox, y);
            ctx.lineTo(ox - fringe + 4, y + wob);
            ctx.stroke();
            // right fringe
            ctx.beginPath();
            ctx.moveTo(ox + w, y);
            ctx.lineTo(ox + w + fringe - 4, y - wob);
            ctx.stroke();
          }
          ctx.restore();
        }

        drawBody(ctx, ox, w, h) {
          ctx.save();
          this.rr(ctx, ox, 0, w, h, 6);
          const grad = ctx.createLinearGradient(ox, 0, ox + w, h);
          grad.addColorStop(0, this.props.baseColor);
          grad.addColorStop(0.5, this.props.weaveColor);
          grad.addColorStop(1, this.props.baseColor);
          ctx.fillStyle = grad;
          ctx.fill();
          ctx.restore();
        }

        drawWeave(ctx, ox, w, h) {
          // Fine woven thread texture (vertical + horizontal micro lines)
          ctx.save();
          this.rr(ctx, ox, 0, w, h, 6);
          ctx.clip();

          ctx.globalAlpha = 0.06;
          ctx.strokeStyle = "#000";
          ctx.lineWidth = 1;
          for (let x = 0; x < w; x += 3) {
            ctx.beginPath();
            ctx.moveTo(ox + x, 0);
            ctx.lineTo(ox + x, h);
            ctx.stroke();
          }
          ctx.globalAlpha = 0.05;
          ctx.strokeStyle = "#fff";
          for (let y = 0; y < h; y += 3) {
            ctx.beginPath();
            ctx.moveTo(ox, y + 1);
            ctx.lineTo(ox + w, y + 1);
            ctx.stroke();
          }
          ctx.restore();
        }

        drawBorders(ctx, ox, w, h) {
          ctx.save();
          // Outer cream border
          ctx.lineWidth = 18;
          ctx.strokeStyle = this.props.borderColor;
          this.rr(ctx, ox + 12, 12, w - 24, h - 24, 4);
          ctx.stroke();

          // Navy accent line
          ctx.lineWidth = 4;
          ctx.strokeStyle = this.props.accentColor;
          this.rr(ctx, ox + 26, 26, w - 52, h - 52, 3);
          ctx.stroke();

          // Dashed decorative band inside border
          ctx.lineWidth = 3;
          ctx.strokeStyle = this.props.baseColor;
          ctx.setLineDash([8, 6]);
          this.rr(ctx, ox + 12, 12, w - 24, h - 24, 4);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.restore();
        }

        drawCentralPattern(ctx, ox, w, h) {
          ctx.save();
          this.rr(ctx, ox + 34, 34, w - 68, h - 68, 3);
          ctx.clip();

          const cx = ox + w / 2;
          const cy = h / 2;

          // Central medallion (diamond)
          const drawDiamond = (dx, dy, r, color, fill) => {
            ctx.beginPath();
            ctx.moveTo(dx, dy - r);
            ctx.lineTo(dx + r * 0.7, dy);
            ctx.lineTo(dx, dy + r);
            ctx.lineTo(dx - r * 0.7, dy);
            ctx.closePath();
            if (fill) {
              ctx.fillStyle = color;
              ctx.fill();
            } else {
              ctx.strokeStyle = color;
              ctx.lineWidth = 3;
              ctx.stroke();
            }
          };

          drawDiamond(cx, cy, 90, this.props.accentColor, true);
          drawDiamond(cx, cy, 74, this.props.borderColor, true);
          drawDiamond(cx, cy, 58, this.props.baseColor, true);
          drawDiamond(cx, cy, 40, this.props.borderColor, false);
          drawDiamond(cx, cy, 20, this.props.accentColor, true);

          // Corner motifs
          const corners = [
            [ox + 70, 70],
            [ox + w - 70, 70],
            [ox + 70, h - 70],
            [ox + w - 70, h - 70],
          ];
          for (const [px, py] of corners) {
            drawDiamond(px, py, 26, this.props.borderColor, false);
            drawDiamond(px, py, 12, this.props.accentColor, true);
          }

          // Scattered dot motifs along the field
          ctx.fillStyle = this.props.borderColor;
          for (let gx = -2; gx <= 2; gx++) {
            for (let gy = -1; gy <= 1; gy++) {
              if (gx === 0 && gy === 0) continue;
              const px = cx + gx * 55;
              const py = cy + gy * 70;
              ctx.beginPath();
              ctx.arc(px, py, 4, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          ctx.restore();
        }

        drawWear(ctx, ox, w, h) {
          // Soft vignette + light streaks to fake pile depth and wear
          ctx.save();
          this.rr(ctx, ox, 0, w, h, 6);
          ctx.clip();

          const vg = ctx.createRadialGradient(
            ox + w / 2,
            h / 2,
            h * 0.2,
            ox + w / 2,
            h / 2,
            h * 0.75,
          );
          vg.addColorStop(0, "rgba(0,0,0,0)");
          vg.addColorStop(1, "rgba(0,0,0,0.28)");
          ctx.fillStyle = vg;
          ctx.fillRect(ox, 0, w, h);

          // Diagonal sheen band (pile catching light)
          const sheen = ctx.createLinearGradient(ox, 0, ox + w, h);
          sheen.addColorStop(0.35, "rgba(255,255,255,0)");
          sheen.addColorStop(0.5, "rgba(255,255,255,0.08)");
          sheen.addColorStop(0.65, "rgba(255,255,255,0)");
          ctx.fillStyle = sheen;
          ctx.fillRect(ox, 0, w, h);
          ctx.restore();
        }
      }

      // ============================================================================
      // DEFAULTS + CONSTANTS  (sticker, unchanged)
      // ============================================================================

      const DEFAULT_IMAGE =
        "https://imagedelivery.net/IEUjvl3YUlxY-MrTpOAWDQ/3fb4a247-64e9-4c54-2391-86598eebfe00/w=800";

      const COMPONENT_DEFAULTS = {
        image: {
          src: "https://plus.unsplash.com/premium_photo-1782403647102-070de72f10a0?q=80&w=1234&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D",
        },
        imageWidth: 600,
        imageHeight: 400,
        tilt: 45,
        lighting: true,
        lightingStrength: 10,
        lightingColor: "#ffffff",
        sheenMode: "sheen",
        elevation: 10,
        staticShadow: "0px 1px 2px 0px rgba(0, 0, 0, 0.30)",
        dynamicShadow: "0px 13px 14px 0px rgba(0, 0, 0, 0.30)",
      };

      const RENDER_SCALE = 2;
      const PAD_BASE = 20;
      const MESH_GRID_SIZE = 32;
      const DRAG_Z_INDEX_BASE = 1000;

      let zIndexCounter = DRAG_Z_INDEX_BASE;
      function getNextZIndex() {
        zIndexCounter += 1;
        return zIndexCounter;
      }

      const DRAG_TILT_SENSITIVITY = 3;
      const DRAG_MAX_TILT_DEG = 30;
      const DRAG_TILT_SMOOTHING = 0.05;
      const SHEEN_STRENGTH = 0.6;
      const SHEEN_TILT_SHIFT = 0.05;
      const SHEEN_TILT_DEADZONE = 0.035;
      const ANIM_SPEED = 1.92;
      const HOLO_MOTION_BUMP = 0.15;
      const HOLO_MOTION_DECAY = 0.88;
      const ELEVATION_INTERNAL_MAX = 0.3;

      // ============================================================================
      // WebGL Shaders (unchanged)
      // ============================================================================

      const VERTEX_SHADER = `
attribute vec2 aPos;
attribute vec2 aUV;
uniform float uPeel;
uniform float uLift;
uniform float uPeelAngle;
uniform float uPasting;
uniform float uScale;
uniform float uElevation;
varying vec2 vUV;
varying float vHi;
varying float vSh;

void main() {
    vUV = aUV;
    vec2 p = aPos;
    vHi = 0.0;
    vSh = 0.0;

    if (uPeel > 0.0) {
        vec2 peelAxis = vec2(cos(uPeelAngle), sin(uPeelAngle));
        vec2 uvCentered = aUV - vec2(0.5);
        float proj = dot(uvCentered, peelAxis);
        float diag = 0.5 - proj;
        float peelLine = -0.3 + uPeel * 2.0;
        float rampWidth = 0.6;
        float lifted = smoothstep(peelLine - rampWidth, peelLine, diag);
        lifted = 1.0 - lifted;
        float scale = 1.0 + lifted * uElevation;
        p *= scale;
        float inRamp = smoothstep(peelLine - rampWidth, peelLine - rampWidth * 0.5, diag) *
                       smoothstep(peelLine + 0.05, peelLine - rampWidth * 0.3, diag);
        float curveAmount = uPasting > 0.5 ? 0.06 : 0.12;
        p += (-peelAxis) * inRamp * curveAmount;
        float t = smoothstep(peelLine - rampWidth, peelLine, diag);
        vHi = inRamp * 0.75 * pow(1.0 - t, 1.2);
        vSh = inRamp * 0.75 * pow(t, 1.2);
    }
    gl_Position = vec4(p * uScale, 0.0, 1.0);
}
`;

      const FRAGMENT_SHADER = `
precision mediump float;
uniform sampler2D uTex;
uniform vec2 uTilt;
uniform float uSheenStrength;
uniform float uSheenTiltShift;
uniform float uSheenTiltDeadzone;
uniform float uMaxTiltDeg;
uniform float uHoloMode;
uniform float uHoloMotion;
uniform vec3 uSheenColor;
varying vec2 vUV;
varying float vHi;
varying float vSh;

vec3 overlayBlend(vec3 base, vec3 blend) {
    return mix(2.0 * base * blend, 1.0 - 2.0 * (1.0 - base) * (1.0 - blend), step(0.5, base));
}

vec3 hsl2rgb(float h, float s, float l) {
    float c = (1.0 - abs(2.0 * l - 1.0)) * s;
    float x = c * (1.0 - abs(mod(h * 6.0, 2.0) - 1.0));
    float m = l - c * 0.5;
    vec3 rgb;
    if (h < 1.0/6.0) rgb = vec3(c, x, 0.0);
    else if (h < 2.0/6.0) rgb = vec3(x, c, 0.0);
    else if (h < 3.0/6.0) rgb = vec3(0.0, c, x);
    else if (h < 4.0/6.0) rgb = vec3(0.0, x, c);
    else if (h < 5.0/6.0) rgb = vec3(x, 0.0, c);
    else rgb = vec3(c, 0.0, x);
    return rgb + m;
}

void main() {
    vec4 tex = texture2D(uTex, vUV);
    if (tex.a < 0.01) discard;
    vec3 c = tex.rgb * 0.95;
    float maxTilt = max(0.001, uMaxTiltDeg);
    float tiltMag = clamp(length(uTilt) / maxTilt, 0.0, 1.0);
    float tiltGate = smoothstep(uSheenTiltDeadzone, 1.0, tiltMag);
    float gradient = fract(vUV.x * 0.5 + vUV.y * 0.5 + uTilt.x * uSheenTiltShift + uTilt.y * uSheenTiltShift);
    if (uHoloMode > 0.5) {
        float holoStrength = uSheenStrength * uHoloMotion;
        float distFromWhite = length(tex.rgb - vec3(1.0));
        float nonWhiteMask = smoothstep(0.06, 0.22, distFromWhite);
        vec3 rainbow = hsl2rgb(gradient, 0.8, 0.55);
        c = mix(c, rainbow, holoStrength * nonWhiteMask * tex.a);
    } else {
        float effectStrength = uSheenStrength * tiltGate;
        float sheen = smoothstep(0.2, 0.5, gradient) * (1.0 - smoothstep(0.5, 0.8, gradient));
        c = mix(c, uSheenColor, sheen * effectStrength * tex.a);
    }
    float hiW = clamp(vHi, 0.0, 1.0) * 0.55;
    float shW = clamp(vSh, 0.0, 1.0) * 0.60;
    vec3 hi = overlayBlend(c, vec3(1.0));
    c = mix(c, hi, hiW);
    vec3 sh = overlayBlend(c, vec3(0.0));
    c = mix(c, sh, shW);
    c *= (1.0 - shW * 0.35);
    c = clamp(c, 0.0, 1.0);
    gl_FragColor = vec4(c, tex.a);
}
`;

      // ============================================================================
      // UTILITIES (unchanged)
      // ============================================================================

      function resolveImageSource(input) {
        if (!input) return undefined;
        if (typeof input === "string") return input.trim() || undefined;
        return (
          input.src ||
          input.url ||
          (input.asset && input.asset.url) ||
          undefined
        );
      }

      function parseColorToRgb(input) {
        if (!input) return [1, 1, 1];
        const s = input.trim();
        const m = s.match(/rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/i);
        if (m) return [+m[1] / 255, +m[2] / 255, +m[3] / 255];
        let h = s.replace(/^#/, "");
        if (h.length === 3)
          h = h
            .split("")
            .map((c) => c + c)
            .join("");
        if (h.length >= 6)
          return [
            parseInt(h.slice(0, 2), 16) / 255,
            parseInt(h.slice(2, 4), 16) / 255,
            parseInt(h.slice(4, 6), 16) / 255,
          ];
        return [1, 1, 1];
      }

      function parseBoxShadow(shadow) {
        const result = { x: 0, y: 0, blur: 0, color: "rgba(0,0,0,0.3)" };
        if (!shadow) return result;
        const colorMatch = shadow.match(
          /(rgba?\([^)]+\)|#[0-9a-fA-F]{3,8}|\b[a-z]+\b(?=\s*$))/i,
        );
        if (colorMatch) result.color = colorMatch[0];
        const numbers = shadow.match(/-?\d+(\.\d+)?(px)?/g);
        if (numbers) {
          const vals = numbers.map((n) => parseFloat(n));
          if (vals.length >= 1) result.x = vals[0];
          if (vals.length >= 2) result.y = vals[1];
          if (vals.length >= 3) result.blur = vals[2];
        }
        return result;
      }

      function lerpShadow(a, b, t) {
        const x = a.x + (b.x - a.x) * t;
        const y = a.y + (b.y - a.y) * t;
        const blur = a.blur + (b.blur - a.blur) * t;
        const color = t > 0.5 ? b.color : a.color;
        return `drop-shadow(${x.toFixed(2)}px ${y.toFixed(2)}px ${blur.toFixed(2)}px ${color})`;
      }

      // ============================================================================
      // STICKER DRAG CLASS (unchanged)
      // ============================================================================

      class StickerDrag {
        constructor(props) {
          this.props = { ...COMPONENT_DEFAULTS, ...props };
          this.tiltSensitivity = DRAG_TILT_SENSITIVITY;
          this.maxTilt = Math.max(1, this.props.tilt);
          this.tiltSmoothing =
            this.props.tiltSmoothing != null
              ? this.props.tiltSmoothing
              : DRAG_TILT_SMOOTHING;
          this.sheenStrength = this.props.lighting
            ? Math.max(1, Math.min(10, this.props.lightingStrength)) / 10
            : 0;
          this.sheenColor = parseColorToRgb(this.props.lightingColor);
          this.elevation =
            (Math.max(1, Math.min(10, this.props.elevation)) / 10) *
            ELEVATION_INTERNAL_MAX;
          this.sheenMode = this.props.sheenMode;
          this.imageWidth = this.props.imageWidth;
          this.imageHeight = this.props.imageHeight;

          this.container = document.getElementById("sticker-container");
          this.sticker = document.getElementById("sticker");
          this.inner = document.getElementById("inner");
          this.canvas = document.getElementById("gl-canvas");
          this.sizingDiv = document.getElementById("sizing-div");
          this.zoomProbe = document.getElementById("zoom-probe");

          this.sizingDimensions = { width: 400, height: 400 };

          this.gl = null;
          this.program = null;
          this.texture = null;
          this.vbo = null;
          this.ibo = null;
          this.indexCount = 0;
          this.uniforms = {};

          this.state = {
            x: 0,
            y: 0,
            width: 200,
            height: 200,
            imageAspectRatio: null,
            scale: 1.0,
            held: false,
            peeling: false,
            sticking: false,
            dragStartX: 0,
            dragStartY: 0,
            dragOrigX: 0,
            dragOrigY: 0,
            peel: 0,
            lift: 0,
            peelAngle: -Math.PI / 4,
            dragTiltX: 0,
            dragTiltY: 0,
            currentTiltX: 0,
            currentTiltY: 0,
            prevTiltX: 0,
            prevTiltY: 0,
            holoMotion: 0,
            lastMoveX: 0,
            lastMoveY: 0,
            lastMoveT: 0,
            texReady: false,
          };

          this.animationId = null;
          this.lastTickT = null;

          this.parsedStaticShadow = parseBoxShadow(this.props.staticShadow);
          this.parsedDynamicShadow = parseBoxShadow(this.props.dynamicShadow);

          this.applyResizeTimeout = null;
          this.SIZING_THRESHOLD = 5;
          this.RESIZE_DEBOUNCE_MS = 180;

          this.tick = this.tick.bind(this);
          this.draw = this.draw.bind(this);
          this.handleResize = this.handleResize.bind(this);
          this.updateShadowCSS = this.updateShadowCSS.bind(this);

          this.init();
        }

        init() {
          this.applySizingDiv();
          this.initWebGL();
          this.loadImage();
          this.attachEvents();
          this.startResizeDetection();
        }

        applySizingDiv() {
          const d = this.sizingDimensions;
          this.sizingDiv.style.width = d.width + "px";
          this.sizingDiv.style.height = d.height + "px";
          this.sizingDiv.style.minWidth = d.width + "px";
          this.sizingDiv.style.minHeight = d.height + "px";
        }

        initWebGL() {
          const canvas = this.canvas;
          const gl = canvas.getContext("webgl", {
            alpha: true,
            antialias: true,
            premultipliedAlpha: false,
          });
          if (!gl) return;
          this.gl = gl;

          const compileShader = (source, type) => {
            const shader = gl.createShader(type);
            if (!shader) return null;
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
              console.error(
                "Shader compile error:",
                gl.getShaderInfoLog(shader),
              );
              gl.deleteShader(shader);
              return null;
            }
            return shader;
          };

          const vs = compileShader(VERTEX_SHADER, gl.VERTEX_SHADER);
          const fs = compileShader(FRAGMENT_SHADER, gl.FRAGMENT_SHADER);
          if (!vs || !fs) return;

          const program = gl.createProgram();
          if (!program) return;
          gl.attachShader(program, vs);
          gl.attachShader(program, fs);
          gl.linkProgram(program);
          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            console.error("Program link error:", gl.getProgramInfoLog(program));
            return;
          }
          this.program = program;

          const uniformNames = [
            "uPeel",
            "uLift",
            "uPeelAngle",
            "uPasting",
            "uScale",
            "uElevation",
            "uTilt",
            "uSheenStrength",
            "uSheenColor",
            "uSheenTiltShift",
            "uSheenTiltDeadzone",
            "uMaxTiltDeg",
            "uHoloMode",
            "uHoloMotion",
            "uTex",
          ];
          for (const name of uniformNames)
            this.uniforms[name] = gl.getUniformLocation(program, name);
          this.aPos = gl.getAttribLocation(program, "aPos");
          this.aUV = gl.getAttribLocation(program, "aUV");

          const N = MESH_GRID_SIZE;
          const verts = [];
          const inds = [];
          for (let j = 0; j <= N; j++)
            for (let i = 0; i <= N; i++)
              verts.push((i / N) * 2 - 1, (j / N) * 2 - 1, i / N, 1 - j / N);
          for (let j = 0; j < N; j++)
            for (let i = 0; i < N; i++) {
              const a = j * (N + 1) + i;
              inds.push(a, a + 1, a + N + 1, a + 1, a + N + 2, a + N + 1);
            }

          const vbo = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
          gl.bufferData(
            gl.ARRAY_BUFFER,
            new Float32Array(verts),
            gl.STATIC_DRAW,
          );
          this.vbo = vbo;

          const ibo = gl.createBuffer();
          gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
          gl.bufferData(
            gl.ELEMENT_ARRAY_BUFFER,
            new Uint16Array(inds),
            gl.STATIC_DRAW,
          );
          this.ibo = ibo;
          this.indexCount = inds.length;

          gl.viewport(0, 0, canvas.width, canvas.height);
          gl.clearColor(0, 0, 0, 0);
          gl.clear(gl.COLOR_BUFFER_BIT);
        }

        draw() {
          const gl = this.gl;
          const program = this.program;
          const texture = this.texture;
          const state = this.state;
          if (!gl || !program || !texture || !state.texReady) return;

          gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
          gl.clearColor(0, 0, 0, 0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.enable(gl.BLEND);
          gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
          gl.useProgram(program);

          gl.bindBuffer(gl.ARRAY_BUFFER, this.vbo);
          gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.ibo);
          gl.enableVertexAttribArray(this.aPos);
          gl.enableVertexAttribArray(this.aUV);
          gl.vertexAttribPointer(this.aPos, 2, gl.FLOAT, false, 16, 0);
          gl.vertexAttribPointer(this.aUV, 2, gl.FLOAT, false, 16, 8);

          const u = this.uniforms;
          gl.uniform1f(u.uPeel, state.peel);
          gl.uniform1f(u.uLift, state.lift);
          gl.uniform1f(u.uPeelAngle, state.peelAngle);
          gl.uniform1f(u.uPasting, state.sticking ? 1.0 : 0.0);
          gl.uniform1f(u.uScale, state.scale);
          gl.uniform1f(u.uElevation, this.elevation);
          gl.uniform2f(u.uTilt, state.currentTiltX, state.currentTiltY);
          gl.uniform1f(u.uSheenStrength, this.sheenStrength);
          gl.uniform3f(
            u.uSheenColor,
            this.sheenColor[0],
            this.sheenColor[1],
            this.sheenColor[2],
          );
          gl.uniform1f(u.uSheenTiltShift, SHEEN_TILT_SHIFT);
          gl.uniform1f(u.uSheenTiltDeadzone, SHEEN_TILT_DEADZONE);
          gl.uniform1f(u.uMaxTiltDeg, this.maxTilt);
          gl.uniform1f(u.uHoloMode, this.sheenMode === "holo" ? 1.0 : 0.0);
          gl.uniform1f(u.uHoloMotion, state.holoMotion);

          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, texture);
          gl.uniform1i(u.uTex, 0);
          gl.drawElements(gl.TRIANGLES, this.indexCount, gl.UNSIGNED_SHORT, 0);
        }

        updateShadowCSS() {
          const canvas = this.canvas;
          const state = this.state;
          if (!canvas) return;
          const tRaw = Math.max(state.lift, state.peel);
          const t = tRaw * tRaw * (3 - 2 * tRaw);
          canvas.style.filter = lerpShadow(
            this.parsedStaticShadow,
            this.parsedDynamicShadow,
            t,
          );
        }

        tick(timestamp) {
          const state = this.state;
          if (this.lastTickT === null) this.lastTickT = timestamp;
          const dt = Math.min((timestamp - this.lastTickT) / 1000, 0.1);
          this.lastTickT = timestamp;
          const step = ANIM_SPEED * dt;
          let changed = false;

          if (state.peeling && (state.peel < 1 || state.lift < 1)) {
            state.peel = Math.min(1, state.peel + step);
            state.lift = Math.min(1, state.lift + step);
            changed = true;
          }
          if (state.sticking) {
            if (state.peel > 0 || state.lift > 0) {
              state.peel = Math.max(0, state.peel - step);
              state.lift = Math.max(0, state.lift - step);
              changed = true;
            } else state.sticking = false;
          }

          const holoDecayActive =
            this.sheenMode === "holo" && state.holoMotion > 0.005;
          if (holoDecayActive) {
            state.holoMotion *= HOLO_MOTION_DECAY;
            if (state.holoMotion < 0.005) state.holoMotion = 0;
            changed = true;
          }

          if (changed) this.updateShadowCSS();
          if (changed || state.held || holoDecayActive) this.draw();

          if (
            state.held ||
            state.peeling ||
            state.sticking ||
            holoDecayActive
          ) {
            this.animationId = requestAnimationFrame(this.tick);
          } else {
            this.animationId = null;
            this.lastTickT = null;
          }
        }

        ensureTickRunning() {
          if (this.animationId !== null) return;
          this.lastTickT = null;
          this.animationId = requestAnimationFrame(this.tick);
        }

        handleResize() {
          const container = this.container;
          const canvas = this.canvas;
          const sticker = this.sticker;
          const gl = this.gl;
          const state = this.state;
          if (!container || !canvas || !sticker || !gl) return;

          const containerWidth = container.clientWidth || 200;
          const containerHeight = container.clientHeight || 200;
          const width = this.imageWidth > 0 ? this.imageWidth : containerWidth;
          const height =
            this.imageHeight > 0 ? this.imageHeight : containerHeight;

          const maxDim = Math.max(width, height);
          const elevationPad = maxDim * this.elevation * 0.6;
          const effectivePad = PAD_BASE + elevationPad;
          const canvasWidth = width + effectivePad * 2;
          const canvasHeight = height + effectivePad * 2;

          const scaleX = width / canvasWidth;
          const scaleY = height / canvasHeight;
          const scale = Math.min(scaleX, scaleY);

          const x = (containerWidth - width) / 2;
          const y = (containerHeight - height) / 2;

          canvas.width = Math.round(canvasWidth * RENDER_SCALE);
          canvas.height = Math.round(canvasHeight * RENDER_SCALE);
          canvas.style.width = `${canvasWidth}px`;
          canvas.style.height = `${canvasHeight}px`;
          canvas.style.position = "absolute";
          canvas.style.left = `${-effectivePad}px`;
          canvas.style.top = `${-effectivePad}px`;

          sticker.style.width = `${width}px`;
          sticker.style.height = `${height}px`;
          sticker.style.left = `${x}px`;
          sticker.style.top = `${y}px`;

          state.width = width;
          state.height = height;
          state.x = x;
          state.y = y;
          state.scale = scale;

          gl.viewport(0, 0, canvas.width, canvas.height);
          if (state.texReady) this.draw();
        }

        scheduleResize(measuredW, measuredH) {
          if (this.applyResizeTimeout) clearTimeout(this.applyResizeTimeout);
          this.applyResizeTimeout = setTimeout(() => {
            this.applyResizeTimeout = null;
            const prev = this.sizingDimensions;
            const w = Math.max(1, Math.round(measuredW)) || prev.width;
            const h = Math.max(1, Math.round(measuredH)) || prev.height;
            const dw = Math.abs(w - prev.width);
            const dh = Math.abs(h - prev.height);
            if (dw >= this.SIZING_THRESHOLD || dh >= this.SIZING_THRESHOLD) {
              this.sizingDimensions = { width: w, height: h };
              this.applySizingDiv();
            }
            this.handleResize();
          }, this.RESIZE_DEBOUNCE_MS);
        }

        startResizeDetection() {
          const container = this.container;
          if (!container) return;
          this.handleResize();
          const ro = new ResizeObserver(() => {
            const w = container.clientWidth || container.offsetWidth || 400;
            const h = container.clientHeight || container.offsetHeight || 400;
            this.scheduleResize(w, h);
          });
          ro.observe(container);
          this.resizeObserver = ro;
        }

        loadImage() {
          const imageSrc =
            resolveImageSource(this.props.image) || DEFAULT_IMAGE;
          const gl = this.gl;
          if (!gl || !this.program) return;

          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => {
            const state = this.state;
            state.imageAspectRatio = img.width / img.height;
            if (this.texture) gl.deleteTexture(this.texture);
            const texture = gl.createTexture();
            if (!texture) return;
            gl.bindTexture(gl.TEXTURE_2D, texture);
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
            gl.texImage2D(
              gl.TEXTURE_2D,
              0,
              gl.RGBA,
              gl.RGBA,
              gl.UNSIGNED_BYTE,
              img,
            );
            gl.texParameteri(
              gl.TEXTURE_2D,
              gl.TEXTURE_WRAP_S,
              gl.CLAMP_TO_EDGE,
            );
            gl.texParameteri(
              gl.TEXTURE_2D,
              gl.TEXTURE_WRAP_T,
              gl.CLAMP_TO_EDGE,
            );
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            this.texture = texture;
            state.texReady = true;
            this.handleResize();
            this.updateShadowCSS();
            this.draw();
          };
          img.onerror = () => console.error("Failed to load image");
          img.src = imageSrc;
        }

        settleTilt() {
          const state = this.state;
          const inner = this.inner;
          const step = () => {
            state.dragTiltX *= 0.9;
            state.dragTiltY *= 0.9;
            state.currentTiltX = state.dragTiltX;
            state.currentTiltY = state.dragTiltY;
            if (inner)
              inner.style.transform = `rotateX(${state.dragTiltX}deg) rotateY(${state.dragTiltY}deg)`;
            if (
              Math.abs(state.dragTiltX) > 0.1 ||
              Math.abs(state.dragTiltY) > 0.1
            ) {
              requestAnimationFrame(step);
            } else {
              state.dragTiltX = 0;
              state.dragTiltY = 0;
              state.currentTiltX = 0;
              state.currentTiltY = 0;
              state.prevTiltX = 0;
              state.prevTiltY = 0;
              if (inner) inner.style.transform = "";
            }
          };
          step();
        }

        pointerDown(clientX, clientY) {
          const state = this.state;
          const container = this.container;
          const sticker = this.sticker;
          const inner = this.inner;
          if (!container || !sticker || !inner) return;
          const rect = sticker.getBoundingClientRect();
          const grabOffsetX = clientX - rect.left;
          const grabOffsetY = clientY - rect.top;
          inner.style.transformOrigin = `${grabOffsetX}px ${grabOffsetY}px`;
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          state.peelAngle = Math.atan2(clientY - centerY, clientX - centerX);
          state.dragStartX = clientX;
          state.dragStartY = clientY;
          state.dragOrigX = state.x;
          state.dragOrigY = state.y;
          state.peel = 0;
          state.lift = 0;
          state.held = true;
          state.peeling = true;
          state.sticking = false;
          state.lastMoveX = clientX;
          state.lastMoveY = clientY;
          state.lastMoveT = performance.now();
          container.style.zIndex = `${getNextZIndex()}`;
          this.ensureTickRunning();
        }

        pointerMove(clientX, clientY) {
          const state = this.state;
          if (!state.held) return;
          const sticker = this.sticker;
          const inner = this.inner;
          if (!sticker || !inner) return;
          state.x = state.dragOrigX + (clientX - state.dragStartX);
          state.y = state.dragOrigY + (clientY - state.dragStartY);
          sticker.style.left = `${state.x}px`;
          sticker.style.top = `${state.y}px`;
          const now = performance.now();
          const dt = Math.max(1, now - state.lastMoveT);
          const velX = ((clientX - state.lastMoveX) / dt) * 16;
          const velY = ((clientY - state.lastMoveY) / dt) * 16;
          state.lastMoveX = clientX;
          state.lastMoveY = clientY;
          state.lastMoveT = now;
          const targetTiltY = Math.max(
            -this.maxTilt,
            Math.min(this.maxTilt, velX * this.tiltSensitivity),
          );
          const targetTiltX = Math.max(
            -this.maxTilt,
            Math.min(this.maxTilt, -velY * this.tiltSensitivity),
          );
          state.dragTiltX +=
            (targetTiltX - state.dragTiltX) * this.tiltSmoothing;
          state.dragTiltY +=
            (targetTiltY - state.dragTiltY) * this.tiltSmoothing;
          state.currentTiltX = state.dragTiltX;
          state.currentTiltY = state.dragTiltY;
          if (this.sheenMode === "holo") {
            const tiltDelta =
              Math.abs(state.dragTiltX - state.prevTiltX) +
              Math.abs(state.dragTiltY - state.prevTiltY);
            state.holoMotion = Math.min(
              1,
              state.holoMotion + tiltDelta * HOLO_MOTION_BUMP,
            );
            state.prevTiltX = state.dragTiltX;
            state.prevTiltY = state.dragTiltY;
          }
          inner.style.transform = `rotateX(${state.dragTiltX}deg) rotateY(${state.dragTiltY}deg)`;
        }

        pointerUp() {
          const state = this.state;
          if (!state.held) return;
          const inner = this.inner;
          state.held = false;
          state.peeling = false;
          state.sticking = true;
          if (state.peel >= 0.95 && inner) {
            const rect = inner.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            state.peelAngle = Math.atan2(
              -(state.lastMoveY - centerY),
              -(state.lastMoveX - centerX),
            );
            state.peel = 1;
          }
          this.settleTilt();
          this.ensureTickRunning();
        }

        attachEvents() {
          this.sticker.addEventListener("mousedown", (e) => {
            e.preventDefault();
            this.pointerDown(e.clientX, e.clientY);
          });
          window.addEventListener("mousemove", (e) =>
            this.pointerMove(e.clientX, e.clientY),
          );
          window.addEventListener("mouseup", () => this.pointerUp());
          this.sticker.addEventListener(
            "touchstart",
            (e) => {
              e.preventDefault();
              const t = e.touches[0];
              if (t) this.pointerDown(t.clientX, t.clientY);
            },
            { passive: false },
          );
          window.addEventListener(
            "touchmove",
            (e) => {
              const t = e.touches[0];
              if (t) this.pointerMove(t.clientX, t.clientY);
            },
            { passive: false },
          );
          window.addEventListener("touchend", () => this.pointerUp());
        }
      }

      // ============================================================================
      // BOOT
      // ============================================================================

      window.addEventListener("DOMContentLoaded", () => {
        // NEW: create the rug texture node behind the sticker
        new RugNode({
          width: 680,
          height: 460,
          baseColor: "#8f2f2a",
          weaveColor: "#a33f38",
          borderColor: "#e9d7a8",
          accentColor: "#2c4a63",
          fringeColor: "#e9dcc0",
        });

        // Sticker (unchanged)
        new StickerDrag({});
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Dithered Characters</title>
<style>
:root{
  --particle:#111;
  --bg:#f4f3ef;
  --bg-spot:rgba(255,255,255,.55);
  --surface:rgba(255,255,255,.72);
  --surface-solid:#fff;
  --surface-hover:#f0efeb;
  --border:rgba(0,0,0,.08);
  --border-strong:rgba(0,0,0,.15);
  --text:#1a1a1a;
  --text-sub:#888;
  --accent:#111;
  --accent-fg:#f4f3ef;
  --radius:14px;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.06);
  --shadow-lg:0 4px 24px rgba(0,0,0,.10);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  min-height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow-x:hidden;padding:24px 16px;
  background:var(--bg);
  background-image:radial-gradient(ellipse at 50% 30%,var(--bg-spot),transparent 70%);
  font-family:var(--font);color:var(--text);
  -webkit-font-smoothing:antialiased;
}

/* ── Header ── */
.header{text-align:center;margin-bottom:28px}
.header h1{
  font-size:clamp(20px,4vw,28px);font-weight:700;
  letter-spacing:-.03em;line-height:1.2;
}
.header p{font-size:13px;color:var(--text-sub);margin-top:6px;letter-spacing:.01em}

/* ── Layout ── */
.demo{display:flex;flex-direction:column;align-items:center;gap:24px;width:100%;max-width:900px}

/* ── Stage ── */
.stage{position:relative;display:flex;align-items:center;justify-content:center}
.dithered-logo{
  position:relative;
  width:min(78vmin,680px);height:min(78vmin,680px);
  max-width:88vw;max-height:82vh;
  color:var(--particle);
  border-radius:20px;
}
.dithered-logo canvas{
  position:absolute;inset:0;display:block;
  width:100%;height:100%;
  touch-action:none;cursor:pointer;
  border-radius:20px;
  opacity:1;transition:opacity .32s cubic-bezier(.4,0,.2,1);
}
.dithered-logo.fading canvas{opacity:0}

/* loading pulse */
.dithered-logo.loading::after{
  content:"";position:absolute;inset:0;
  border-radius:20px;
  background:radial-gradient(circle,rgba(0,0,0,.03) 0%,transparent 70%);
  animation:pulse 1.2s ease-in-out infinite;
  pointer-events:none;
}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.8}}

/* ── Arrows ── */
.nav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:5;
  width:52px;height:52px;display:grid;place-items:center;
  border:1px solid var(--border);border-radius:50%;
  background:var(--surface);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  color:var(--text);cursor:pointer;
  box-shadow:var(--shadow);
  transition:background .2s,box-shadow .2s,transform .18s cubic-bezier(.4,0,.2,1);
}
.nav:hover{background:var(--surface-solid);box-shadow:var(--shadow-lg);transform:translateY(-50%) scale(1.08)}
.nav:active{transform:translateY(-50%) scale(.93)}
.nav svg{width:22px;height:22px;stroke-width:2.2}
.nav.prev{left:-62px}
.nav.next{right:-62px}

/* ── Dots + Counter ── */
.indicators{display:flex;align-items:center;gap:14px}
.dots{display:flex;gap:6px;align-items:center}
.dot{
  width:8px;height:8px;border-radius:99px;border:none;
  background:var(--border-strong);cursor:pointer;padding:0;
  transition:all .3s cubic-bezier(.4,0,.2,1);
}
.dot:hover{background:var(--text-sub)}
.dot.active{background:var(--accent);width:24px}
.counter{font-size:12px;color:var(--text-sub);font-variant-numeric:tabular-nums;min-width:42px;text-align:center;letter-spacing:.02em}

/* ── Controls ── */
.controls{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;
  padding:8px 12px;border-radius:var(--radius);
  background:var(--surface);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;border:1px solid var(--border);border-radius:10px;
  background:var(--surface-solid);color:var(--text);
  font-size:13px;font-weight:500;font-family:var(--font);
  cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);
  transition:all .2s cubic-bezier(.4,0,.2,1);
  user-select:none;-webkit-user-select:none;
}
.btn:hover{background:var(--surface-hover);box-shadow:var(--shadow);transform:translateY(-1px)}
.btn:active{transform:translateY(0);box-shadow:none}
.btn input{display:none}
.btn svg{width:15px;height:15px;opacity:.45;flex-shrink:0}
.btn.active{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.btn.active svg{opacity:.85}
.divider{width:1px;height:24px;background:var(--border);margin:0 4px}
.hint{font-size:12px;color:var(--text-sub);letter-spacing:.02em;margin-top:4px}

/* ── Responsive ── */
@media(max-width:680px){
  body{padding:14px 10px}
  .header{margin-bottom:18px}
  .dithered-logo{width:min(86vw,480px);height:min(86vw,480px)}
  .nav{width:42px;height:42px}
  .nav svg{width:18px;height:18px}
  .nav.prev{left:-16px}
  .nav.next{right:-16px}
  .btn{padding:7px 12px;font-size:12px}
  .controls{gap:4px;padding:6px 8px}
  .divider{height:20px;margin:0 2px}
}
@media(max-width:400px){
  .nav.prev{left:-8px}
  .nav.next{right:-8px}
}
</style>
</head>
<body>

<header class="header">
  <h1>Dithered Characters</h1>
  <p>Interactive particle portraits — hover, click &amp; explore</p>
</header>

<main class="demo">
  <div class="stage">
    <button class="nav prev" id="prevBtn" aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="dithered-logo" id="ditheredLogo">
      <canvas id="particleCanvas"></canvas>
    </div>
    <button class="nav next" id="nextBtn" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <div class="indicators">
    <div class="dots" id="dots"></div>
    <span class="counter" id="counter">1 / 16</span>
  </div>

  <div class="controls">
    <label class="btn" id="uploadBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Upload
      <input type="file" id="imagePicker" accept="image/*"/>
    </label>
    <div class="divider"></div>
    <button class="btn" id="bwBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20z" fill="currentColor"/></svg>
      B&amp;W
    </button>
    <button class="btn active" id="colorBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="10.5" r="2.5"/><circle cx="8.5" cy="7.5" r="2.5"/><circle cx="6.5" cy="12" r="2.5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.5-.7 1.5-1.5 0-.4-.1-.7-.4-1-.2-.3-.4-.6-.4-1 0-.8.7-1.5 1.5-1.5H16c3.3 0 6-2.7 6-6 0-5.5-4.5-9-10-9z"/></svg>
      Color
    </button>
  </div>

  <p class="hint">Hover &amp; click to interact · Arrow keys or swipe to navigate</p>
</main>

<script>
/* ═══════════════════════════════════════════
   Constants
   ═══════════════════════════════════════════ */
const RIPPLE_SPEED   = 225;
const RIPPLE_WIDTH   = 37;
const RIPPLE_FORCE   = 50;
const RIPPLE_DURATION= 675;
const CURSOR_RADIUS  = 100;
const CURSOR_RAD_SQ  = CURSOR_RADIUS * CURSOR_RADIUS;
const CURSOR_FORCE   = 40;
const LERP           = 0.12;
const SNAP           = 0.01;
const MAX_DPR        = 2;                       // cap for perf

/* ═══════════════════════════════════════════
   Gallery
   ═══════════════════════════════════════════ */
const GALLERY = [
  "https://cdn.prod.website-files.com/5e51c674258ffe10d286d30a/5e535be8d871310468110f17_peep-88.svg",
  "https://cdn.prod.website-files.com/5e51c674258ffe10d286d30a/5e535822c99250c79ec8c2e3_peep-55.svg",
  "https://cdn.prod.website-files.com/5e51c674258ffe10d286d30a/5e535d4c5197057a87a74020_peep-100.svg",
  "https://cdn.prod.website-files.com/5e51c674258ffe10d286d30a/5e535c92c67e790fd496656f_peep-94.svg",
  "https://cdn.prod.website-files.com/5e51c674258ffe10d286d30a/5e535da59588e079598123fc_peep-103.svg",
  "https://cdn.prod.website-files.com/5e51c674258ffe10d286d30a/5e53523cf3aa4b6f462b2ec0_peep-17.svg",
  "https://cdn.prod.website-files.com/5e51c674258ffe10d286d30a/5e535b9746008059478ec0d0_peep-85.svg",
  "https://cdn.prod.website-files.com/5e51c674258ffe10d286d30a/5e535d68c6b2498a0c2cbf6a_peep-101.svg",
  "https://cdn.prod.website-files.com/5e51c674258ffe10d286d30a/5e53515e2b568a43f515edd5_peep-10.svg",
  "https://cdn.prod.website-files.com/5e51c674258ffe10d286d30a/5e5358c38e249393f1066ab8_peep-61.svg",
  "https://cdn.prod.website-files.com/5e51c674258ffe10d286d30a/5e535bb6e35d38cae7684f8c_peep-86.svg",
  "https://cdn.prod.website-files.com/5e51c674258ffe10d286d30a/5e535686f5fa1a3aa6f812cb_peep-42.svg",
  "https://cdn.prod.website-files.com/5e51c674258ffe10d286d30a/5e535c225197058c80a6eabc_peep-90.svg",
  "https://cdn.prod.website-files.com/5e51c674258ffe10d286d30a/5e5352709588e06bd47b75e0_peep-19.svg",
  "https://cdn.prod.website-files.com/5e51c674258ffe10d286d30a/5e5358707371bb635d9f3338_peep-58.svg",
  "https://cdn.prod.website-files.com/5e51c674258ffe10d286d30a/5e5359ee8becbf772f53c5d4_peep-71.svg",
];

/* ═══════════════════════════════════════════
   Spatial Hash Grid  (fast cursor lookup)
   ═══════════════════════════════════════════ */
class SpatialGrid {
  constructor(cellSize, w, h) {
    this.cs = cellSize;
    this.cols = Math.ceil(w / cellSize) + 1;
    this.rows = Math.ceil(h / cellSize) + 1;
    this.cells = new Array(this.cols * this.rows);
    for (let i = 0; i < this.cells.length; i++) this.cells[i] = [];
  }
  insert(id, x, y) {
    const c = (x / this.cs) | 0, r = (y / this.cs) | 0;
    if (c >= 0 && c < this.cols && r >= 0 && r < this.rows)
      this.cells[r * this.cols + c].push(id);
  }
  query(x, y, out) {
    out.length = 0;
    const c0 = (x / this.cs) | 0, r0 = (y / this.cs) | 0;
    for (let dr = -1; dr <= 1; dr++) {
      const r = r0 + dr;
      if (r < 0 || r >= this.rows) continue;
      for (let dc = -1; dc <= 1; dc++) {
        const c = c0 + dc;
        if (c < 0 || c >= this.cols) continue;
        const cell = this.cells[r * this.cols + c];
        for (let k = 0; k < cell.length; k++) out.push(cell[k]);
      }
    }
    return out;
  }
}

/* ═══════════════════════════════════════════
   DitheredLogo  (optimised)
   ═══════════════════════════════════════════ */
class DitheredLogo {
  constructor(container, imageSrc, config = {}) {
    this.el  = container;
    this.cv  = container.querySelector("canvas");
    this.cx  = this.cv.getContext("2d", { desynchronized: true, alpha: true });
    this.cfg = {
      gridSize: matchMedia("(max-width:640px)").matches ? 140 : 210,
      scale: 1.1, dotScale: 1.1, invert: true,
      cornerRadius: 0.16, threshold: 168, contrast: 14,
      gamma: 1.04, blur: 0, diffusionStrength: 1,
      serpentine: true, particleColor: "currentColor",
      ...config,
    };
    this.src = imageSrc;
    this.sys = null;
    this.monochrome = false;
    this.cursor = { x: 0, y: 0, on: false };
    this.ripples = [];
    this.raf = 0;
    this.running = false;
    this.lw = 0; this.lh = 0;
    this.resizeTimer = null;
    this._dpr = Math.min(devicePixelRatio || 1, MAX_DPR);
    this._cachedRect = null;
    this._bwColorCache = "";
    this.grid = null;
    this._nearby = [];          // reusable query result
    this._fx = null;            // reusable force arrays
    this._fy = null;

    this.ro = new ResizeObserver(() => this._resize());
    this.ro.observe(this.el);
    this._bind();
    this._resize();
    this.rebuild();
  }

  /* ── Pointer events (cached rect) ── */
  _bind() {
    const c = this.cv;
    const updateCursor = (e) => {
      if (!this._cachedRect) this._cachedRect = c.getBoundingClientRect();
      this.cursor.x = e.clientX - this._cachedRect.left;
      this.cursor.y = e.clientY - this._cachedRect.top;
    };
    c.addEventListener("pointermove", (e) => {
      updateCursor(e);
      this.cursor.on = true;
      this._loop();
    });
    c.addEventListener("pointerleave", (e) => {
      if (e.pointerType === "mouse") { this.cursor.on = false; this._loop(); }
    });
    c.addEventListener("pointercancel", () => { this.cursor.on = false; this._loop(); });
    c.addEventListener("pointerup", (e) => {
      updateCursor(e);
      this.ripples.push({ x: this.cursor.x, y: this.cursor.y, t: performance.now() });
      if (e.pointerType !== "mouse") this.cursor.on = false;
      this._loop();
    });
  }

  setColorMode(useColor) {
    this.monochrome = !useColor;
    if (this.sys) { this._draw(); this._loop(); }
  }

  _img(src) {
    return new Promise((ok, no) => {
      const i = new Image();
      i.crossOrigin = "anonymous";
      i.onload = () => ok(i);
      i.onerror = () => no(new Error("Load failed: " + src));
      i.src = src;
    });
  }

  /* ── Image → greyscale grid + colour data ── */
  _gray(img) {
    const C = this.cfg;
    const iw = img.naturalWidth || img.width;
    const ih = img.naturalHeight || img.height;
    const asp = iw / ih;
    const w = asp >= 1 ? C.gridSize : Math.round(C.gridSize * asp);
    const h = asp >= 1 ? Math.round(C.gridSize / asp) : C.gridSize;

    // downsample for alpha + colour
    const ac = document.createElement("canvas");
    ac.width = w; ac.height = h;
    const ax = ac.getContext("2d");
    ax.imageSmoothingEnabled = true;
    ax.imageSmoothingQuality = "high";
    ax.drawImage(img, 0, 0, w, h);
    const ad = ax.getImageData(0, 0, w, h).data;

    // optional blur pass
    const pad = Math.ceil(C.blur * 3);
    const sc = document.createElement("canvas");
    sc.width = iw + pad * 2; sc.height = ih + pad * 2;
    const sx = sc.getContext("2d");
    if (C.blur > 0) sx.filter = `blur(${C.blur}px)`;
    sx.drawImage(img, pad, pad, iw, ih);
    sx.filter = "none";

    const fc = document.createElement("canvas");
    fc.width = w; fc.height = h;
    const fx = fc.getContext("2d");
    fx.imageSmoothingEnabled = true;
    fx.imageSmoothingQuality = "high";
    fx.drawImage(sc, pad, pad, iw, ih, 0, 0, w, h);
    const px = fx.getImageData(0, 0, w, h).data;

    const gs = new Uint8Array(w * h);
    const alpha = new Uint8Array(w * h);
    const colors = new Uint8Array(w * h * 3);
    const cf = (259 * (C.contrast + 255)) / (255 * (259 - C.contrast));

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const pi = (y * w + x) * 4;
        const idx = y * w + x;
        const ba = px[pi + 3] / 255;
        alpha[idx] = ad[pi + 3];
        colors[idx * 3]     = ad[pi];
        colors[idx * 3 + 1] = ad[pi + 1];
        colors[idx * 3 + 2] = ad[pi + 2];
        let l = ba > 0.01
          ? (0.299 * px[pi] + 0.587 * px[pi + 1] + 0.114 * px[pi + 2]) / ba
          : 0;
        if (C.contrast) l = cf * (l - 128) + 128;
        if (C.gamma !== 1) l = 255 * Math.pow(Math.max(0, l / 255), 1 / C.gamma);
        gs[idx] = Math.max(0, Math.min(255, Math.round(l)));
      }
    }
    return { gs, alpha, colors, w, h };
  }

  /* ── Floyd-Steinberg dither ── */
  _dither(g) {
    const C = this.cfg;
    const { gs, alpha, w, h } = g;
    const err = new Float32Array(gs);
    const pos = [];
    for (let y = 0; y < h; y++) {
      const ltr = !C.serpentine || y % 2 === 0;
      const sx = ltr ? 0 : w - 1, ex = ltr ? w : -1, st = ltr ? 1 : -1;
      for (let x = sx; x !== ex; x += st) {
        const idx = y * w + x;
        if (alpha[idx] < 128) continue;
        const ov = err[idx];
        const nv = ov > C.threshold ? 255 : 0;
        const e = (ov - nv) * C.diffusionStrength;
        if (nv > 0) pos.push(x, y);
        const sp = (nx, ny, wt) => {
          if (nx < 0 || nx >= w || ny < 0 || ny >= h) return;
          const ni = ny * w + nx;
          if (alpha[ni] < 128) return;
          err[ni] += e * wt;
        };
        sp(x + st, y, 7 / 16);
        sp(x - st, y + 1, 3 / 16);
        sp(x, y + 1, 5 / 16);
        sp(x + st, y + 1, 1 / 16);
      }
    }
    return new Float32Array(pos);
  }

  /* ── Invert: background dots instead of foreground ── */
  _invert(pts, w, h, alpha) {
    const r = Math.round(this.cfg.cornerRadius * Math.min(w, h));
    const mask = new Set();
    for (let y = 0; y < h; y++)
      for (let x = 0; x < w; x++) {
        let ok = false;
        if (x >= r && x < w - r) ok = true;
        else if (y >= r && y < h - r) ok = true;
        else {
          const cx = x < r ? r : w - r - 1;
          const cy = y < r ? r : h - r - 1;
          ok = (x - cx) ** 2 + (y - cy) ** 2 <= r * r;
        }
        if (ok) mask.add(y * w + x);
      }
    const filled = new Set();
    for (let i = 0; i < pts.length; i += 2)
      filled.add(Math.round(pts[i + 1]) * w + Math.round(pts[i]));
    const out = [];
    for (const idx of mask)
      if (!filled.has(idx) && alpha[idx] >= 128)
        out.push(idx % w, Math.floor(idx / w));
    return new Float32Array(out);
  }

  /* ── Colour extraction & quantised buckets ── */
  _extractColors(positions, gridColors, gridW) {
    const count = positions.length / 2;
    const pColors = new Uint8Array(count * 3);
    for (let i = 0; i < count; i++) {
      const px = Math.round(positions[i * 2]);
      const py = Math.round(positions[i * 2 + 1]);
      const si = py * gridW + px;
      pColors[i * 3]     = gridColors[si * 3];
      pColors[i * 3 + 1] = gridColors[si * 3 + 1];
      pColors[i * 3 + 2] = gridColors[si * 3 + 2];
    }
    return pColors;
  }

  _buildColorBuckets(pColors, count) {
    const map = {};
    for (let i = 0; i < count; i++) {
      const qr = pColors[i * 3] >> 3;
      const qg = pColors[i * 3 + 1] >> 3;
      const qb = pColors[i * 3 + 2] >> 3;
      const key = (qr << 10) | (qg << 5) | qb;
      if (!map[key])
        map[key] = { css: `rgb(${(qr << 3) | 4},${(qg << 3) | 4},${(qb << 3) | 4})`, ids: [] };
      map[key].ids.push(i);
    }
    return Object.values(map);
  }

  /* ── Build particle system + spatial grid ── */
  _initParticles(positions, sf, ds, ox, oy, pColors) {
    const n = positions.length / 2;
    const bx = new Float32Array(n);
    const by = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      bx[i] = ox + positions[i * 2] * sf;
      by[i] = oy + positions[i * 2 + 1] * sf;
    }
    return {
      n, bx, by,
      ox: new Float32Array(n),
      oy: new Float32Array(n),
      sz: sf * ds,
      colorBuckets: this._buildColorBuckets(pColors, n),
    };
  }

  _buildSpatialGrid() {
    if (!this.sys || !this._cachedRect) return;
    this.grid = new SpatialGrid(CURSOR_RADIUS, this._cachedRect.width, this._cachedRect.height);
    const s = this.sys;
    for (let i = 0; i < s.n; i++) this.grid.insert(i, s.bx[i], s.by[i]);
  }

  /* ── Full rebuild from image ── */
  async rebuild(newSrc) {
    if (newSrc) this.src = newSrc;
    this.el.classList.add("loading");
    try {
      const img = await this._img(this.src);
      this._cachedRect = this.cv.getBoundingClientRect();
      const g = this._gray(img);
      let pts = this._dither(g);
      if (this.cfg.invert) pts = this._invert(pts, g.w, g.h, g.alpha);
      const pColors = this._extractColors(pts, g.colors, g.w);
      const sf = Math.max(0.5,
        (Math.min(this._cachedRect.width, this._cachedRect.height) * this.cfg.scale) /
        Math.max(g.w, g.h));
      const originX = Math.round((this._cachedRect.width  - g.w * sf) / 2);
      const originY = Math.round((this._cachedRect.height - g.h * sf) / 2);
      const mobile = matchMedia("(max-width:640px)").matches;
      const ds = mobile ? this.cfg.dotScale * 0.8 : this.cfg.dotScale;
      this.ripples.length = 0;
      this.sys = this._initParticles(pts, sf, ds, originX, originY, pColors);
      this._fx = new Float32Array(this.sys.n);
      this._fy = new Float32Array(this.sys.n);
      this._buildSpatialGrid();
      this._cacheBwColor();
      this._draw();
      this._loop();
      return true;
    } catch (err) {
      console.error("DitheredLogo:", err);
      return false;
    } finally {
      this.el.classList.remove("loading");
    }
  }

  _cacheBwColor() {
    this._bwColorCache = this.cfg.particleColor === "currentColor"
      ? getComputedStyle(this.el).color
      : this.cfg.particleColor;
  }

  /* ── Physics step ── */
  _step(now) {
    const s = this.sys;
    if (!s) return false;

    // cull expired ripples (no splice)
    let w = 0;
    for (let i = 0; i < this.ripples.length; i++)
      if (now - this.ripples[i].t < RIPPLE_DURATION) this.ripples[w++] = this.ripples[i];
    this.ripples.length = w;

    // ensure force arrays
    if (!this._fx || this._fx.length < s.n) {
      this._fx = new Float32Array(s.n);
      this._fy = new Float32Array(s.n);
    }
    this._fx.fill(0, 0, s.n);
    this._fy.fill(0, 0, s.n);

    // ── cursor repulsion (spatial grid) ──
    if (this.cursor.on && this.grid) {
      const nb = this.grid.query(this.cursor.x, this.cursor.y, this._nearby);
      for (let k = 0; k < nb.length; k++) {
        const i = nb[k];
        const vx = s.bx[i] + s.ox[i] - this.cursor.x;
        const vy = s.by[i] + s.oy[i] - this.cursor.y;
        const d2 = vx * vx + vy * vy;
        if (d2 > 0.1 && d2 < CURSOR_RAD_SQ) {
          const d = Math.sqrt(d2);
          const f = ((1 - d / CURSOR_RADIUS) ** 3) * CURSOR_FORCE;
          this._fx[i] += (vx / d) * f;
          this._fy[i] += (vy / d) * f;
        }
      }
    }

    // ── ripple forces (bounding-box cull) ──
    const rLen = this.ripples.length;
    const rm = rLen > 0 ? 1 + 0.5 * (rLen - 1) : 0;
    for (let r = 0; r < rLen; r++) {
      const rip = this.ripples[r];
      const el = now - rip.t;
      const rad = (el / 1000) * RIPPLE_SPEED;
      const life = 1 - el / RIPPLE_DURATION;
      const maxD = rad + RIPPLE_WIDTH;
      for (let i = 0; i < s.n; i++) {
        const dx = s.bx[i] - rip.x;
        const dy = s.by[i] - rip.y;
        if (dx > maxD || dx < -maxD || dy > maxD || dy < -maxD) continue;   // cheap reject
        const d2 = dx * dx + dy * dy;
        if (d2 < 0.01) continue;
        const d = Math.sqrt(d2);
        const band = Math.abs(d - rad);
        if (band < RIPPLE_WIDTH) {
          const wf = (1 - band / RIPPLE_WIDTH) * life * RIPPLE_FORCE * rm;
          this._fx[i] += (dx / d) * wf;
          this._fy[i] += (dy / d) * wf;
        }
      }
    }

    // ── integrate ──
    let motion = false;
    for (let i = 0; i < s.n; i++) {
      s.ox[i] += (this._fx[i] - s.ox[i]) * LERP;
      s.oy[i] += (this._fy[i] - s.oy[i]) * LERP;
      if (Math.abs(s.ox[i]) < SNAP) s.ox[i] = 0;
      if (Math.abs(s.oy[i]) < SNAP) s.oy[i] = 0;
      if (s.ox[i] || s.oy[i]) motion = true;
    }
    return motion || rLen > 0 || this.cursor.on;
  }

  /* ── Batched draw (one fill per colour bucket) ── */
  _draw() {
    const s = this.sys;
    if (!s) return;
    const dpr = this._dpr;
    const cx = this.cx;
    cx.clearRect(0, 0, this.cv.width, this.cv.height);
    const sz = s.sz * dpr;
    const half = sz * 0.5;

    if (this.monochrome) {
      cx.fillStyle = this._bwColorCache;
      cx.beginPath();
      for (let i = 0; i < s.n; i++) {
        const x = (s.bx[i] + s.ox[i]) * dpr - half;
        const y = (s.by[i] + s.oy[i]) * dpr - half;
        cx.rect(x, y, sz, sz);
      }
      cx.fill();
    } else {
      for (let b = 0; b < s.colorBuckets.length; b++) {
        const bucket = s.colorBuckets[b];
        cx.fillStyle = bucket.css;
        cx.beginPath();
        const ids = bucket.ids;
        for (let j = 0; j < ids.length; j++) {
          const i = ids[j];
          const x = (s.bx[i] + s.ox[i]) * dpr - half;
          const y = (s.by[i] + s.oy[i]) * dpr - half;
          cx.rect(x, y, sz, sz);
        }
        cx.fill();
      }
    }
  }

  /* ── Animation loop ── */
  _loop() {
    if (this.running || !this.sys) return;
    this.running = true;
    const tick = (now) => {
      const more = this._step(now);
      this._draw();
      if (more) this.raf = requestAnimationFrame(tick);
      else this.running = false;
    };
    this.raf = requestAnimationFrame(tick);
  }

  /* ── Resize handler ── */
  _resize() {
    this._cachedRect = this.cv.getBoundingClientRect();
    this._dpr = Math.min(devicePixelRatio || 1, MAX_DPR);
    this.cv.width  = Math.max(1, Math.round(this._cachedRect.width  * this._dpr));
    this.cv.height = Math.max(1, Math.round(this._cachedRect.height * this._dpr));
    if (this.sys) { this._draw(); this._buildSpatialGrid(); this._cacheBwColor(); }
    const w = Math.round(this._cachedRect.width);
    const h = Math.round(this._cachedRect.height);
    if (this.lw && (w !== this.lw || h !== this.lh)) {
      clearTimeout(this.resizeTimer);
      this.resizeTimer = setTimeout(() => this.rebuild(), 200);
    }
    this.lw = w; this.lh = h;
  }

  destroy() { cancelAnimationFrame(this.raf); this.ro.disconnect(); }
}

/* ═══════════════════════════════════════════
   Init
   ═══════════════════════════════════════════ */
const stage = document.getElementById("ditheredLogo");
const logo  = new DitheredLogo(stage, GALLERY[0]);

/* ═══════════════════════════════════════════
   Carousel
   ═══════════════════════════════════════════ */
let index = 0, busy = false;
const dotsBox = document.getElementById("dots");
const counter = document.getElementById("counter");

GALLERY.forEach((_, i) => {
  const d = document.createElement("button");
  d.className = "dot" + (i === 0 ? " active" : "");
  d.setAttribute("aria-label", "Image " + (i + 1));
  d.addEventListener("click", () => show(i));
  dotsBox.appendChild(d);
});

function syncUI() {
  [...dotsBox.children].forEach((d, i) => d.classList.toggle("active", i === index));
  counter.textContent = `${index + 1} / ${GALLERY.length}`;
}
syncUI();

async function show(i) {
  if (busy || i === index) return;
  busy = true; index = i;
  stage.classList.add("fading");
  await new Promise(r => setTimeout(r, 320));
  await logo.rebuild(GALLERY[index]);
  syncUI();
  stage.classList.remove("fading");
  busy = false;
}

document.getElementById("nextBtn").addEventListener("click", () => show((index + 1) % GALLERY.length));
document.getElementById("prevBtn").addEventListener("click", () => show((index - 1 + GALLERY.length) % GALLERY.length));

/* keyboard */
window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") show((index + 1) % GALLERY.length);
  if (e.key === "ArrowLeft")  show((index - 1 + GALLERY.length) % GALLERY.length);
});

/* touch swipe */
let tx = 0, ty = 0;
stage.addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
stage.addEventListener("touchend", (e) => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    dx < 0 ? show((index + 1) % GALLERY.length) : show((index - 1 + GALLERY.length) % GALLERY.length);
  }
}, { passive: true });

/* ═══════════════════════════════════════════
   B&W / Color toggle
   ═══════════════════════════════════════════ */
const bwBtn    = document.getElementById("bwBtn");
const colorBtn = document.getElementById("colorBtn");

bwBtn.addEventListener("click", () => {
  bwBtn.classList.add("active"); colorBtn.classList.remove("active");
  logo.setColorMode(false);
});
colorBtn.addEventListener("click", () => {
  colorBtn.classList.add("active"); bwBtn.classList.remove("active");
  logo.setColorMode(true);
});

/* ═══════════════════════════════════════════
   Upload → append to gallery
   ═══════════════════════════════════════════ */
document.getElementById("imagePicker").addEventListener("change", (e) => {
  const f = e.target.files[0]; if (!f) return;
  GALLERY.push(URL.createObjectURL(f));
  const d = document.createElement("button");
  d.className = "dot";
  d.setAttribute("aria-label", "Image " + GALLERY.length);
  d.addEventListener("click", () => show(GALLERY.length - 1));
  dotsBox.appendChild(d);
  show(GALLERY.length - 1);
});
</script>
</body>

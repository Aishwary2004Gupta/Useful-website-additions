<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Interactable Ripple Water Sphere</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import * as THREE from "https://esm.sh/three";
      import { OrbitControls } from "https://esm.sh/three/addons/controls/OrbitControls.js";

      // ------------------------------------------------
      // SCENE + CAMERA + RENDERER
      // ------------------------------------------------
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(-4, 0, -3);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 1));

      // ------------------------------------------------
      // ENVIRONMENT MAP
      // ------------------------------------------------
      const textureLoader = new THREE.TextureLoader();
      const envURL =
        "https://i.postimg.cc/DZTfk0vf/D10451C5-EB9F-4364-B668-83F91FC4B26C.jpg";

      const reflectionTex = textureLoader.load(envURL);
      const refractionTex = textureLoader.load(envURL);

      reflectionTex.mapping = THREE.EquirectangularReflectionMapping;
      refractionTex.mapping = THREE.EquirectangularRefractionMapping;
      reflectionTex.colorSpace = THREE.SRGBColorSpace;
      refractionTex.colorSpace = THREE.SRGBColorSpace;

      scene.background = reflectionTex;
      scene.environment = reflectionTex;

      // ------------------------------------------------
      // MEDIUM-RES WATER SPHERE  (64x64 instead of 128x128)
      // ------------------------------------------------
      const geometry = new THREE.SphereGeometry(2, 64, 64);
      const base = new Float32Array(geometry.attributes.position.array);
      const posAttr = geometry.attributes.position;
      const posArr = posAttr.array; // direct typed array for speed

      // One sphere, FrontSide — drops the second overlapping mesh
      const matWater = new THREE.MeshPhysicalMaterial({
        color: 0x5cafdf,
        envMap: reflectionTex,
        roughness: 0.05,
        metalness: 0.2,
        transmission: 0.85,
        ior: 1.12,
        thickness: 0.5,
        clearcoat: 0.5,
        clearcoatRoughness: 0.1,
        side: THREE.FrontSide,
        transparent: true,
      });

      const sphereMesh = new THREE.Mesh(geometry, matWater);
      scene.add(sphereMesh);

      // ------------------------------------------------
      // CONTROLS
      // ------------------------------------------------
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;

      // ------------------------------------------------
      // RIPPLE DATA  (plain objects, no Vector3 clones)
      // ------------------------------------------------
      const vertexCount = posAttr.count;

      const RIPPLE_RADIUS   = 1.3;
      const RIPPLE_DECAY    = 1.5;
      const RIPPLE_SPEED    = 2.0;
      const RIPPLE_AMP      = 0.05;
      const RIPPLE_LIFETIME = 2.5;   // seconds before a ripple dies
      const MAX_RIPPLES     = 4;     // hard cap to keep cost bounded

      // Ring-buffer pool to avoid GC pressure
      const ripples = new Array(MAX_RIPPLES);
      for (let i = 0; i < MAX_RIPPLES; i++) {
        ripples[i] = { x: 0, y: 0, z: 0, t: 0, alive: false };
      }
      let rippleHead = 0;
      let activeRipples = 0;

      // ------------------------------------------------
      // RIPPLE TRIGGER  (throttled)
      // ------------------------------------------------
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let lastTriggerTime = 0;
      const TRIGGER_COOLDOWN_MS = 40; // max ~25 ripples/sec

      function triggerRipple(point) {
        const r = ripples[rippleHead];
        r.x = point.x; r.y = point.y; r.z = point.z;
        r.t = 0; r.alive = true;
        rippleHead = (rippleHead + 1) % MAX_RIPPLES;
        if (activeRipples < MAX_RIPPLES) activeRipples++;
      }

      function onPointer(e) {
        const now = performance.now();
        if (now - lastTriggerTime < TRIGGER_COOLDOWN_MS) return;
        lastTriggerTime = now;

        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.intersectObject(sphereMesh, false)[0];
        if (hit) triggerRipple(hit.point);
      }

      window.addEventListener("pointermove", onPointer);
      window.addEventListener("pointerdown", onPointer);

      // ------------------------------------------------
      // ANIMATION LOOP
      // ------------------------------------------------
      const dt = 1 / 60;
      const r2 = RIPPLE_RADIUS * RIPPLE_RADIUS;

      function animate() {
        requestAnimationFrame(animate);
        controls.update();

        // Nothing to do if no ripples — skip the expensive loop entirely
        if (activeRipples === 0) {
          renderer.render(scene, camera);
          return;
        }

        // 1. Advance ripple ages
        for (let r = 0; r < MAX_RIPPLES; r++) {
          const rp = ripples[r];
          if (!rp.alive) continue;
          rp.t += dt;
          if (rp.t > RIPPLE_LIFETIME) {
            rp.alive = false;
            activeRipples--;
          }
        }

        // 2. Reset vertices to base shape (one fast typed-array copy)
        posArr.set(base);

        // 3. Apply each ripple — squared-distance early-out is critical
        for (let r = 0; r < MAX_RIPPLES; r++) {
          const rp = ripples[r];
          if (!rp.alive) continue;

          const bandCenter = rp.t * RIPPLE_SPEED;
          const bandMin = bandCenter - RIPPLE_RADIUS;
          const bandMax = bandCenter + RIPPLE_RADIUS;
          const bandMax2 = bandMax * bandMax;
          const bandMin2 = bandMin * bandMin;

          for (let i = 0; i < vertexCount; i++) {
            const i3 = i * 3;
            const dx = posArr[i3]     - rp.x;
            const dy = posArr[i3 + 1] - rp.y;
            const dz = posArr[i3 + 2] - rp.z;
            const d2 = dx * dx + dy * dy + dz * dz;

            // Cheap reject before any sqrt/sin/exp
            if (d2 > bandMax2) continue;
            if (d2 < bandMin2 && rp.t > 0.05) continue;

            const dist = Math.sqrt(d2);

            const wave = Math.sin((dist - bandCenter) * 6.0);
            const intensity = wave * Math.exp(-dist * RIPPLE_DECAY) * RIPPLE_AMP;

            // Push along vertex direction (outward from sphere center)
            posArr[i3]     += posArr[i3]     * intensity;
            posArr[i3 + 1] += posArr[i3 + 1] * intensity;
            posArr[i3 + 2] += posArr[i3 + 2] * intensity;
          }
        }

        posAttr.needsUpdate = true;
        geometry.computeVertexNormals();
        geometry.attributes.normal.needsUpdate = true;

        renderer.render(scene, camera);
      }

      animate();

      // ------------------------------------------------
      // RESIZE HANDLER
      // ------------------------------------------------
      window.addEventListener("resize", () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dithered Image</title>

    <style>
      :root,
      [data-theme="light"] {
        --particle: #111111;
        --bg: #f5f5f0;
        --bg-spot: rgba(255, 255, 255, 0.55);
        --surface: #ffffff;
        --surface-hover: #f2f2ef;
        --border: #e0e0dd;
        --text: #1a1a1a;
        --text-sub: #999;
        --shadow: 0 2px 10px rgba(0, 0, 0, 0.06);
        --shadow-up: 0 6px 20px rgba(0, 0, 0, 0.1);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding: 20px;
        background-color: var(--bg);
        background-image: radial-gradient(
          ellipse at 50% 32%,
          var(--bg-spot),
          transparent 68%
        );
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      /* ── Layout ── */
      .demo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        width: 100%;
      }

      /* ── Stage: canvas + arrows ── */
      .stage {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .dithered-logo {
        position: relative;
        width: min(80vmin, 720px);
        height: min(80vmin, 720px);
        max-width: 90vw;
        max-height: 90vh;
        color: var(--particle);
      }

      /* IMPORTANT: only opacity is animated.
         A CSS transform would change getBoundingClientRect()
         and break the cursor / ripple coordinate mapping. */
      .dithered-logo canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: pointer;
        opacity: 1;
        transition: opacity 0.28s ease;
      }
      .dithered-logo.fading canvas {
        opacity: 0;
      }

      /* ── Arrows ── */
      .nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        z-index: 5;
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        box-shadow: var(--shadow-up);
        transition:
          background 0.2s ease,
          box-shadow 0.2s ease,
          scale 0.18s ease;
      }
      .nav:hover {
        background: var(--surface-hover);
        scale: 1.08;
      }
      .nav:active {
        scale: 0.94;
      }
      .nav svg {
        width: 28px;
        height: 28px;
        stroke-width: 2.4;
      }
      .nav.prev {
        left: -70px;
      }
      .nav.next {
        right: -70px;
      }

      /* ── Dots ── */
      .dots {
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 99px;
        border: none;
        background: var(--border);
        cursor: pointer;
        transition: all 0.25s ease;
      }
      .dot.active {
        background: var(--text);
        width: 26px;
      }

      /* ── Controls ── */
      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
        padding: 0 10px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 10px 18px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        color: var(--text);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        box-shadow: var(--shadow);
        transition: all 0.22s ease;
        user-select: none;
        -webkit-user-select: none;
      }
      .btn:hover {
        background: var(--surface-hover);
        box-shadow: var(--shadow-up);
        transform: translateY(-1px);
      }
      .btn:active {
        transform: translateY(0);
      }
      .btn input {
        display: none;
      }
      .btn svg {
        width: 16px;
        height: 16px;
        opacity: 0.5;
        flex-shrink: 0;
      }
      .btn.active {
        border-color: var(--text);
        background: var(--text);
        color: var(--bg);
      }
      .btn.active svg {
        opacity: 0.85;
      }

      .divider {
        width: 1px;
        height: 28px;
        background: var(--border);
        margin: 0 4px;
      }

      .hint {
        font-size: 13px;
        color: var(--text-sub);
        letter-spacing: 0.02em;
      }

      @media (max-width: 640px) {
        body {
          padding: 10px;
        }
        .dithered-logo {
          width: min(84vw, 520px);
          height: min(84vw, 520px);
        }
        .nav {
          width: 46px;
          height: 46px;
        }
        .nav svg {
          width: 20px;
          height: 20px;
        }
        .nav.prev {
          left: -20px;
        }
        .nav.next {
          right: -20px;
        }
        .btn {
          padding: 9px 14px;
          font-size: 13px;
        }
      }
    </style>
  </head>

  <body>
    <main class="demo">
      <div class="stage">
        <button class="nav prev" id="prevBtn" aria-label="Previous image">
          <svg
            viewBox="0 0 24 24"

          </svg>

        <div class="divider"></div>

        <button class="btn" id="bwBtn">
          <svg
            viewBox="0 0 24 24"

        <button class="btn active" id="colorBtn">

            <circle cx="13.5" cy="6.5" r="2.5" />
            <circle cx="17.5" cy="10.5" r="2.5" />
            <circle cx="8.5" cy="7.5" r="2.5" />
            <circle cx="6.5" cy="12" r="2.5" />
            <path
              d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.5-.7 1.5-1.5 0-.4-.1-.7-.4-1-.2-.3-.4-.6-.4-1 0-.8.7-1.5 1.5-1.5H16c3.3 0 6-2.7 6-6 0-5.5-4.5-9-10-9z"
            />
          </svg>
          Color
        </button>
      </div>

      <p class="hint">Hover &amp; click to interact with particles</p>
    </main>

    <script>
      /* ═══════ Constants ═══════ */
      const RIPPLE_SPEED = 225;
      const RIPPLE_WIDTH = 37;
      const RIPPLE_FORCE = 60;
      const RIPPLE_DURATION = 675;
      const CURSOR_RADIUS = 100;
      const CURSOR_RADIUS_SQ = CURSOR_RADIUS * CURSOR_RADIUS;
      const CURSOR_FORCE = 100;
      const LERP = 0.12;
      const SNAP = 0.01;
      const MAX_DPR = 2; // [FIX] cap device pixel ratio — 3× screens were rendering 9× pixels
      const imageCache = new Map();

      function preloadImage(src) {
        if (!src) return Promise.resolve(null);
        if (imageCache.has(src)) return imageCache.get(src);

        const promise = new Promise((resolve, reject) => {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.decoding = "async";
          img.onload = () => resolve(img);
          img.onerror = () => {
            imageCache.delete(src);
            reject(new Error("Failed to load: " + src));
          };
          img.src = src;
        });

        imageCache.set(src, promise);
        return promise;
      }

      /* ═══════ Gallery ═══════ */
      const GALLERY = [
        "https://images.unsplash.com/photo-1784792993431-d81e88fdacfb",
        "https://images.unsplash.com/photo-1784768143954-4f4f736ccd80",
        "https://images.unsplash.com/photo-1783657542205-d027329527d4",
        "https://spcdn.shortpixel.ai/spio/ret_img,q_orig,to_auto,s_webp:avif/https://goldpenguin.org/wp-content/uploads/2024/01/The-moon-as-seen-on-beautiful-lake-symbolizing-space-and-nature-generated-with-Midjourney-2048x1148.png",
        "https://plus.unsplash.com/premium_vector-1741788653302-b6883564bd02?q=80&w=1051&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D",
        "https://raw.githubusercontent.com/Aishwary2004Gupta/models/cloud/images/dragonTown.png",
        "https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/12532de5-e93d-4cd5-9bbe-cace0d45f7a9/dfeiukg-4e1b3d9e-49a8-4865-9a44-49a866744c6c.jpg/v1/fill/w_1192,h_670,q_70,strp/midjourney_ai_sunset_aurora_borealis_4k_wallpaper_by_darkprncsai_dfeiukg-pre.jpg?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7ImhlaWdodCI6Ijw9NzIwIiwicGF0aCI6Ii9mLzEyNTMyZGU1LWU5M2QtNGNkNS05YmJlLWNhY2UwZDQ1ZjdhOS9kZmVpdWtnLTRlMWIzZDllLTQ5YTgtNDg2NS05YTQ0LTQ5YTg2Njc0NGM2Yy5qcGciLCJ3aWR0aCI6Ijw9MTI4MCJ9XV0sImF1ZCI6WyJ1cm46c2VydmljZTppbWFnZS5vcGVyYXRpb25zIl19.Y11P7M5AKJF-btEXquIUBiYTo6_gLEjwO9D-DeQqEPU",
        "https://raw.githubusercontent.com/Aishwary2004Gupta/models/cloud/images/heaven.jpg",
        "https://raw.githubusercontent.com/Aishwary2004Gupta/models/cloud/images/Background.jpg",
        "https://raw.githubusercontent.com/Aishwary2004Gupta/models/cloud/images/blueWhale.png",
        "https://raw.githubusercontent.com/Aishwary2004Gupta/models/cloud/images/ufo.png",
        "https://raw.githubusercontent.com/Aishwary2004Gupta/models/cloud/images/mountainVally.png",
      ];

      /* ═══════ [FIX] Spatial hash grid for O(1) cursor lookups ═══════ */
      class SpatialGrid {
        constructor(cellSize, w, h) {
          this.cs = cellSize;
          this.cols = Math.ceil(w / cellSize) + 1;
          this.rows = Math.ceil(h / cellSize) + 1;
          this.cells = new Array(this.cols * this.rows);
          for (let i = 0; i < this.cells.length; i++) this.cells[i] = [];
        }
        insert(id, x, y) {
          const c = (x / this.cs) | 0,
            r = (y / this.cs) | 0;
          if (c >= 0 && c < this.cols && r >= 0 && r < this.rows)
            this.cells[r * this.cols + c].push(id);
        }
        query(x, y, out) {
          out.length = 0;
          const c0 = (x / this.cs) | 0,
            r0 = (y / this.cs) | 0;
          for (let dr = -1; dr <= 1; dr++) {
            const r = r0 + dr;
            if (r < 0 || r >= this.rows) continue;
            for (let dc = -1; dc <= 1; dc++) {
              const c = c0 + dc;
              if (c < 0 || c >= this.cols) continue;
              const cell = this.cells[r * this.cols + c];
              for (let k = 0; k < cell.length; k++) out.push(cell[k]);
            }
          }
          return out;
        }
      }

      /* ═══════ DitheredLogo ═══════ */
      class DitheredLogo {
        constructor(container, imageSrc, config = {}) {
          this.el = container;
          this.cv = container.querySelector("canvas");
          // [FIX] desynchronized hint reduces input-to-paint latency
          this.cx = this.cv.getContext("2d", {
            desynchronized: true,
            alpha: true,
          });
          this.cfg = {
            // [FIX] 340 → adaptive: 200 desktop / 140 mobile
            // 340 produced ~80k+ particles causing the main lag
            gridSize: matchMedia("(max-width:640px)").matches ? 140 : 200,
            scale: 1,
            dotScale: 1,
            invert: true,
            cornerRadius: 0.16,
            threshold: 168,
            contrast: 14,
            gamma: 1.04,
            blur: 1.15,
            diffusionStrength: 1,
            serpentine: true,
            particleColor: "currentColor",
            ...config,
          };
          this.src = imageSrc;
          this.sys = null;
          this.monochrome = false;
          this.cursor = { x: 0, y: 0, on: false };
          this.ripples = [];
          this.raf = 0;
          this.running = false;
          this.lw = 0;
          this.lh = 0;
          this.resizeTimer = null;

          // [FIX] cached rect avoids forced layout on every pointermove
          this._cachedRect = null;
          // [FIX] cached DPR avoids recalc every draw
          this._dpr = Math.min(devicePixelRatio || 1, MAX_DPR);
          // [FIX] cached bw color avoids getComputedStyle every frame
          this._bwColorCache = "";
          // [FIX] spatial grid + reusable query buffer
          this.grid = null;
          this._nearby = [];
          // [FIX] pre-allocated force arrays avoid per-particle allocation
          this._fx = null;
          this._fy = null;

          this.ro = new ResizeObserver(() => this._resize());
          this.ro.observe(this.el);

          this._bind();
          this._resize();
          this.rebuild();
        }

        /* ── Pointer events ── */
        _bind() {
          const c = this.cv;
          // [FIX] helper uses cached rect instead of getBoundingClientRect() per event
          const updateCursor = (e) => {
            if (!this._cachedRect)
              this._cachedRect = c.getBoundingClientRect();
            this.cursor.x = e.clientX - this._cachedRect.left;
            this.cursor.y = e.clientY - this._cachedRect.top;
          };

          c.addEventListener("pointermove", (e) => {
            updateCursor(e);
            this.cursor.on = true;
            this._loop();
          });
          c.addEventListener("pointerleave", (e) => {
            if (e.pointerType === "mouse") {
              this.cursor.on = false;
              this._loop();
            }
          });
          c.addEventListener("pointercancel", () => {
            this.cursor.on = false;
            this._loop();
          });
          c.addEventListener("pointerup", (e) => {
            updateCursor(e);
            this.ripples.push({
              x: this.cursor.x,
              y: this.cursor.y,
              t: performance.now(),
            });
            if (e.pointerType !== "mouse") this.cursor.on = false;
            this._loop();
          });
        }

        setColorMode(useColor) {
          this.monochrome = !useColor;
          if (this.sys) {
            this._draw();
            this._loop();
          }
        }

        _img(src) {
          return preloadImage(src);
        }

        _gray(img) {
          const C = this.cfg;
          const iw = img.naturalWidth || img.width;
          const ih = img.naturalHeight || img.height;
          const asp = iw / ih;
          const w = asp >= 1 ? C.gridSize : Math.round(C.gridSize * asp);
          const h = asp >= 1 ? Math.round(C.gridSize / asp) : C.gridSize;

          const ac = document.createElement("canvas");
          ac.width = w;
          ac.height = h;
          const ax = ac.getContext("2d");
          ax.imageSmoothingEnabled = true;
          ax.imageSmoothingQuality = "high";
          ax.drawImage(img, 0, 0, w, h);
          const ad = ax.getImageData(0, 0, w, h).data;

          const pad = Math.ceil(C.blur * 3);
          const sc = document.createElement("canvas");
          sc.width = iw + pad * 2;
          sc.height = ih + pad * 2;
          const sx = sc.getContext("2d");
          if (C.blur > 0) sx.filter = `blur(${C.blur}px)`;
          sx.drawImage(img, pad, pad, iw, ih);
          sx.filter = "none";

          const fc = document.createElement("canvas");
          fc.width = w;
          fc.height = h;
          const fx = fc.getContext("2d");
          fx.imageSmoothingEnabled = true;
          fx.imageSmoothingQuality = "high";
          fx.drawImage(sc, pad, pad, iw, ih, 0, 0, w, h);
          const px = fx.getImageData(0, 0, w, h).data;

          const gs = new Uint8Array(w * h);
          const alpha = new Uint8Array(w * h);
          const colors = new Uint8Array(w * h * 3);
          const cf = (259 * (C.contrast + 255)) / (255 * (259 - C.contrast));

          for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
              const pi = (y * w + x) * 4;
              const idx = y * w + x;
              const ba = px[pi + 3] / 255;

              alpha[idx] = ad[pi + 3];
              colors[idx * 3] = ad[pi];
              colors[idx * 3 + 1] = ad[pi + 1];
              colors[idx * 3 + 2] = ad[pi + 2];

              let l =
                ba > 0.01
                  ? (0.299 * px[pi] +
                      0.587 * px[pi + 1] +
                      0.114 * px[pi + 2]) /
                    ba
                  : 0;

              if (C.contrast) l = cf * (l - 128) + 128;
              if (C.gamma !== 1)
                l = 255 * Math.pow(Math.max(0, l / 255), 1 / C.gamma);

              gs[idx] = Math.max(0, Math.min(255, Math.round(l)));
            }
          }

          return { gs, alpha, colors, w, h };
        }

        _dither(g) {
          const C = this.cfg;
          const { gs, alpha, w, h } = g;
          const err = new Float32Array(w * h);
          for (let i = 0; i < gs.length; i++) err[i] = gs[i];
          const pos = [];

          for (let y = 0; y < h; y++) {
            const ltr = !C.serpentine || y % 2 === 0;
            const sx = ltr ? 0 : w - 1;
            const ex = ltr ? w : -1;
            const st = ltr ? 1 : -1;

            for (let x = sx; x !== ex; x += st) {
              const idx = y * w + x;
              if (alpha[idx] < 128) continue;

              const ov = err[idx];
              const nv = ov > C.threshold ? 255 : 0;
              const e = (ov - nv) * C.diffusionStrength;
              if (nv > 0) pos.push(x, y);

              const sp = (nx, ny, wt) => {
                if (nx < 0 || nx >= w || ny < 0 || ny >= h) return;
                const ni = ny * w + nx;
                if (alpha[ni] < 128) return;
                err[ni] += e * wt;
              };

              sp(x + st, y, 7 / 16);
              sp(x - st, y + 1, 3 / 16);
              sp(x, y + 1, 5 / 16);
              sp(x + st, y + 1, 1 / 16);
            }
          }
          return new Float32Array(pos);
        }

        _invert(pts, w, h, alpha) {
          const r = Math.round(this.cfg.cornerRadius * Math.min(w, h));
          const mask = new Set();

          for (let y = 0; y < h; y++)
            for (let x = 0; x < w; x++) {
              let ok = false;
              if (x >= r && x < w - r) ok = true;
              else if (y >= r && y < h - r) ok = true;
              else {
                const cx = x < r ? r : w - r - 1;
                const cy = y < r ? r : h - r - 1;
                ok = (x - cx) ** 2 + (y - cy) ** 2 <= r * r;
              }
              if (ok) mask.add(y * w + x);
            }

          const filled = new Set();
          for (let i = 0; i < pts.length; i += 2)
            filled.add(Math.round(pts[i + 1]) * w + Math.round(pts[i]));

          const out = [];
          for (const idx of mask)
            if (!filled.has(idx) && alpha[idx] >= 128)
              out.push(idx % w, Math.floor(idx / w));

          return new Float32Array(out);
        }

        _extractColors(positions, gridColors, gridW) {
          const count = positions.length / 2;
          const pColors = new Uint8Array(count * 3);

          for (let i = 0; i < count; i++) {
            const px = Math.round(positions[i * 2]);
            const py = Math.round(positions[i * 2 + 1]);
            const srcIdx = py * gridW + px;

            pColors[i * 3] = gridColors[srcIdx * 3];
            pColors[i * 3 + 1] = gridColors[srcIdx * 3 + 1];
            pColors[i * 3 + 2] = gridColors[srcIdx * 3 + 2];
          }
          return pColors;
        }

        _buildColorBuckets(pColors, count) {
          const bucketMap = {};

          for (let i = 0; i < count; i++) {
            const qr = pColors[i * 3] >> 3;
            const qg = pColors[i * 3 + 1] >> 3;
            const qb = pColors[i * 3 + 2] >> 3;
            const key = (qr << 10) | (qg << 5) | qb;

            if (!bucketMap[key]) {
              bucketMap[key] = {
                css:
                  "rgb(" +
                  ((qr << 3) | 4) +
                  "," +
                  ((qg << 3) | 4) +
                  "," +
                  ((qb << 3) | 4) +
                  ")",
                ids: [],
              };
            }
            bucketMap[key].ids.push(i);
          }

          return Object.values(bucketMap);
        }

        _initParticles(positions, sf, ds, ox, oy, pColors) {
          const n = positions.length / 2;
          const bx = new Float32Array(n);
          const by = new Float32Array(n);

          for (let i = 0; i < n; i++) {
            bx[i] = ox + positions[i * 2] * sf;
            by[i] = oy + positions[i * 2 + 1] * sf;
          }

          return {
            n,
            bx,
            by,
            ox: new Float32Array(n),
            oy: new Float32Array(n),
            sz: sf * ds,
            colorBuckets: this._buildColorBuckets(pColors, n),
          };
        }

        // [FIX] build spatial grid after particles are placed
        _buildSpatialGrid() {
          if (!this.sys || !this._cachedRect) return;
          this.grid = new SpatialGrid(
            CURSOR_RADIUS,
            this._cachedRect.width,
            this._cachedRect.height,
          );
          const s = this.sys;
          for (let i = 0; i < s.n; i++)
            this.grid.insert(i, s.bx[i], s.by[i]);
        }

        async rebuild(newSrc) {
          if (newSrc) this.src = newSrc;

          try {
            const img = await this._img(this.src);
            // [FIX] cache rect once per rebuild
            this._cachedRect = this.cv.getBoundingClientRect();
            const g = this._gray(img);

            let pts = this._dither(g);
            if (this.cfg.invert) pts = this._invert(pts, g.w, g.h, g.alpha);

            const pColors = this._extractColors(pts, g.colors, g.w);

            const sf = Math.max(
              0.5,
              (Math.min(this._cachedRect.width, this._cachedRect.height) *
                this.cfg.scale) /
                Math.max(g.w, g.h),
            );
            const originX = Math.round(
              (this._cachedRect.width - g.w * sf) / 2,
            );
            const originY = Math.round(
              (this._cachedRect.height - g.h * sf) / 2,
            );
            const mobile = matchMedia("(max-width:640px)").matches;
            const ds = mobile ? this.cfg.dotScale * 0.8 : this.cfg.dotScale;

            /* clear leftover motion from previous image */
            this.ripples.length = 0;

            this.sys = this._initParticles(
              pts,
              sf,
              ds,
              originX,
              originY,
              pColors,
            );

            // [FIX] pre-allocate reusable force arrays
            this._fx = new Float32Array(this.sys.n);
            this._fy = new Float32Array(this.sys.n);

            // [FIX] build spatial grid for fast cursor queries
            this._buildSpatialGrid();

            // [FIX] cache bw color once
            this._bwColorCache = this._bwColor();

            this._draw();
            this._loop();
            return true;
          } catch (err) {
            console.error("DitheredLogo:", err);
            return false;
          }
        }

        _step(now) {
          const s = this.sys;
          if (!s) return false;

          // [FIX] in-place compaction instead of splice (avoids array shifts)
          let w = 0;
          for (let i = 0; i < this.ripples.length; i++)
            if (now - this.ripples[i].t < RIPPLE_DURATION)
              this.ripples[w++] = this.ripples[i];
          this.ripples.length = w;

          const rm =
            this.ripples.length > 0
              ? 1 + 0.5 * (this.ripples.length - 1)
              : 0;
          let motion = false;

          // [FIX] ensure force arrays exist and zero them
          if (!this._fx || this._fx.length < s.n) {
            this._fx = new Float32Array(s.n);
            this._fy = new Float32Array(s.n);
          }
          this._fx.fill(0, 0, s.n);
          this._fy.fill(0, 0, s.n);

          // [FIX] cursor repulsion uses spatial grid — O(k) instead of O(n)
          if (this.cursor.on && this.grid) {
            const nb = this.grid.query(
              this.cursor.x,
              this.cursor.y,
              this._nearby,
            );
            for (let k = 0; k < nb.length; k++) {
              const i = nb[k];
              const vx = s.bx[i] + s.ox[i] - this.cursor.x;
              const vy = s.by[i] + s.oy[i] - this.cursor.y;
              const d2 = vx * vx + vy * vy;
              if (d2 > 0.1 && d2 < CURSOR_RADIUS_SQ) {
                const d = Math.sqrt(d2);
                const f =
                  ((1 - d / CURSOR_RADIUS) ** 3) * CURSOR_FORCE;
                this._fx[i] += (vx / d) * f;
                this._fy[i] += (vy / d) * f;
              }
            }
          }

          // [FIX] ripple forces with bounding-box cull before sqrt
          const rLen = this.ripples.length;
          for (let r = 0; r < rLen; r++) {
            const rip = this.ripples[r];
            const el = now - rip.t;
            const rad = (el / 1000) * RIPPLE_SPEED;
            const life = 1 - el / RIPPLE_DURATION;
            const maxD = rad + RIPPLE_WIDTH;

            for (let i = 0; i < s.n; i++) {
              const dx = s.bx[i] - rip.x;
              const dy = s.by[i] - rip.y;
              // [FIX] cheap AABB reject — skips ~95% of sqrt calls
              if (dx > maxD || dx < -maxD || dy > maxD || dy < -maxD)
                continue;
              const d2 = dx * dx + dy * dy;
              if (d2 < 0.01) continue;
              const d = Math.sqrt(d2);
              const band = Math.abs(d - rad);
              if (band < RIPPLE_WIDTH) {
                const wf =
                  (1 - band / RIPPLE_WIDTH) * life * RIPPLE_FORCE * rm;
                this._fx[i] += (dx / d) * wf;
                this._fy[i] += (dy / d) * wf;
              }
            }
          }

          // [FIX] integrate in separate pass (cleaner, same cache behavior)
          for (let i = 0; i < s.n; i++) {
            s.ox[i] += (this._fx[i] - s.ox[i]) * LERP;
            s.oy[i] += (this._fy[i] - s.oy[i]) * LERP;
            if (Math.abs(s.ox[i]) < SNAP) s.ox[i] = 0;
            if (Math.abs(s.oy[i]) < SNAP) s.oy[i] = 0;
            if (s.ox[i] || s.oy[i]) motion = true;
          }

          return motion || this.ripples.length > 0 || this.cursor.on;
        }

        _bwColor() {
          return this.cfg.particleColor === "currentColor"
            ? getComputedStyle(this.el).color
            : this.cfg.particleColor;
        }

        _draw() {
          const s = this.sys;
          if (!s) return;

          // [FIX] use cached DPR instead of reading devicePixelRatio every frame
          const dpr = this._dpr;

          this.cx.clearRect(0, 0, this.cv.width, this.cv.height);

          const sz = s.sz * dpr;
          const half = sz * 0.5;

          // [FIX] batch all rects into a single path per colour, then one fill()
          // was: individual fillRect() per particle = tens of thousands of draw calls
          // now: beginPath() + rect() loop + single fill() = ~50 draw calls total
          if (this.monochrome) {
            this.cx.fillStyle = this._bwColorCache;
            this.cx.globalAlpha = 1;
            this.cx.beginPath();
            for (let i = 0; i < s.n; i++) {
              const x = (s.bx[i] + s.ox[i]) * dpr - half;
              const y = (s.by[i] + s.oy[i]) * dpr - half;
              this.cx.rect(x, y, sz, sz);
            }
            this.cx.fill();
          } else {
            this.cx.globalAlpha = 1;
            for (let b = 0; b < s.colorBuckets.length; b++) {
              const bucket = s.colorBuckets[b];
              this.cx.fillStyle = bucket.css;
              this.cx.beginPath();
              const ids = bucket.ids;
              for (let j = 0; j < ids.length; j++) {
                const i = ids[j];
                const x = (s.bx[i] + s.ox[i]) * dpr - half;
                const y = (s.by[i] + s.oy[i]) * dpr - half;
                this.cx.rect(x, y, sz, sz);
              }
              this.cx.fill();
            }
          }
        }

        _loop() {
          if (this.running || !this.sys) return;
          this.running = true;

          const tick = (now) => {
            const more = this._step(now);
            this._draw();
            if (more) this.raf = requestAnimationFrame(tick);
            else this.running = false;
          };
          this.raf = requestAnimationFrame(tick);
        }

        _resize() {
          // [FIX] cache rect and DPR
          this._cachedRect = this.cv.getBoundingClientRect();
          this._dpr = Math.min(devicePixelRatio || 1, MAX_DPR);
          this.cv.width = Math.max(
            1,
            Math.round(this._cachedRect.width * this._dpr),
          );
          this.cv.height = Math.max(
            1,
            Math.round(this._cachedRect.height * this._dpr),
          );
          if (this.sys) {
            this._draw();
            this._buildSpatialGrid();
            this._bwColorCache = this._bwColor();
          }

          const w = Math.round(this._cachedRect.width);
          const h = Math.round(this._cachedRect.height);
          if (this.lw && (w !== this.lw || h !== this.lh)) {
            clearTimeout(this.resizeTimer);
            this.resizeTimer = setTimeout(() => this.rebuild(), 180);
          }
          this.lw = w;
          this.lh = h;
        }

        destroy() {
          cancelAnimationFrame(this.raf);
          this.ro.disconnect();
        }
      }

      /* ═══════ Init ═══════ */
      const stage = document.getElementById("ditheredLogo");
      const logo = new DitheredLogo(stage, GALLERY[0]);

      /* ═══════ Carousel ═══════ */
      let index = 0;
      let busy = false;

      const dotsBox = document.getElementById("dots");

      function preloadGalleryAround(targetIndex) {
        const total = GALLERY.length;
        if (!total) return;

        const neighbors = [
          targetIndex,
          (targetIndex + 1) % total,
          (targetIndex - 1 + total) % total,
        ];

        neighbors.forEach((i) => {
          preloadImage(GALLERY[i]).catch(() => {});
        });
      }
      GALLERY.forEach((_, i) => {
        const d = document.createElement("button");
        d.className = "dot" + (i === 0 ? " active" : "");
        d.setAttribute("aria-label", "Image " + (i + 1));
        d.addEventListener("click", () => show(i));
        dotsBox.appendChild(d);
      });

      function syncDots() {
        [...dotsBox.children].forEach((d, i) =>
          d.classList.toggle("active", i === index),
        );
      }

      async function show(i) {
        if (busy || i === index) return;
        busy = true;
        index = i;
        preloadGalleryAround(index);

        /* fade out (opacity only — rect stays identical) */
        stage.classList.add("fading");
        await new Promise((r) => setTimeout(r, 280));

        await logo.rebuild(GALLERY[index]);
        syncDots();

        stage.classList.remove("fading");
        busy = false;
      }

      document
        .getElementById("nextBtn")
        .addEventListener("click", () => show((index + 1) % GALLERY.length));

      document
        .getElementById("prevBtn")
        .addEventListener("click", () =>
          show((index - 1 + GALLERY.length) % GALLERY.length),
        );

      /* keyboard arrows */
      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") show((index + 1) % GALLERY.length);
        if (e.key === "ArrowLeft")
          show((index - 1 + GALLERY.length) % GALLERY.length);
      });

      /* ═══════ B&W / Color ═══════ */
      const bwBtn = document.getElementById("bwBtn");
      const colorBtn = document.getElementById("colorBtn");

      bwBtn.addEventListener("click", () => {
        bwBtn.classList.add("active");
        colorBtn.classList.remove("active");
        logo.setColorMode(false);
      });

      colorBtn.addEventListener("click", () => {
        colorBtn.classList.add("active");
        bwBtn.classList.remove("active");
        logo.setColorMode(true);
      });

      /* ═══════ Upload — adds to gallery ═══════ */
      document
        .getElementById("imagePicker")
        .addEventListener("change", (e) => {
          const f = e.target.files[0];
          if (!f) return;
          const uploadedUrl = URL.createObjectURL(f);
          GALLERY.push(uploadedUrl);

          const d = document.createElement("button");
          d.className = "dot";
          d.addEventListener("click", () => show(GALLERY.length - 1));
          dotsBox.appendChild(d);

          preloadImage(uploadedUrl).catch(() => {});
          show(GALLERY.length - 1);
        });
    </script>
  </body>
</html>
